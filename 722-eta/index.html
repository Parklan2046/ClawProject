<!DOCTYPE html>
<html lang="zh-Hant-HK" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>巴士 ETA · 商務版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#f4f5f7;--card:#ffffff;--card-hover:#fafbfc;
  --accent:#f97316;--accent-light:#fff7ed;--accent-border:rgba(249,115,22,.18);
  --accent2:#ec4899;
  --text:#111827;--text-secondary:#374151;--dim:#6b7280;
  --green:#059669;--green-bg:#ecfdf5;--green-border:rgba(5,150,105,.18);
  --amber:#d97706;--amber-bg:#fffbeb;--amber-border:rgba(217,119,6,.18);
  --red:#dc2626;--red-bg:#fef2f2;--red-border:rgba(220,38,38,.12);
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-border:rgba(37,99,235,.18);
  --cyan:#0891b2;--cyan-bg:#ecfeff;
  --kmb:#2563eb;--kmb-bg:#eff6ff;--kmb-border:rgba(37,99,235,.18);
  --ctb:#f97316;--ctb-bg:#fff7ed;--ctb-border:rgba(249,115,22,.18);
  --border:#e5e7eb;--border-hover:#d1d5db;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --modal-overlay:rgba(0,0,0,.25);
}
[data-theme="dark"]{
  --bg:#09090b;--card:#18181b;--card-hover:#1f1f23;
  --accent:#f97316;--accent-light:rgba(249,115,22,.08);--accent-border:rgba(249,115,22,.18);
  --accent2:#ec4899;
  --text:#fafafa;--text-secondary:#d4d4d8;--dim:#a1a1aa;
  --green:#22c55e;--green-bg:rgba(34,197,94,.08);--green-border:rgba(34,197,94,.14);
  --amber:#eab308;--amber-bg:rgba(234,179,8,.08);--amber-border:rgba(234,179,8,.14);
  --red:#ef4444;--red-bg:rgba(239,68,68,.06);--red-border:rgba(239,68,68,.12);
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,.08);--blue-border:rgba(59,130,246,.18);
  --cyan:#22d3ee;--cyan-bg:rgba(34,211,238,.08);
  --kmb:#3b82f6;--kmb-bg:rgba(59,130,246,.08);--kmb-border:rgba(59,130,246,.18);
  --ctb:#f97316;--ctb-bg:rgba(249,115,22,.08);--ctb-border:rgba(249,115,22,.18);
  --border:rgba(255,255,255,.06);--border-hover:rgba(255,255,255,.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow-md:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
  --modal-overlay:rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;padding:20px 16px 100px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .3s,color .3s;
}
.page{max-width:560px;margin:0 auto}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.topbar-brand h1{font-size:1.15em;font-weight:700;letter-spacing:-.02em}
.topbar-brand .sub{font-size:.68em;color:var(--dim);font-weight:500}
.topbar-actions{display:flex;gap:6px;align-items:center}
.theme-btn{
  background:var(--card);border:1px solid var(--border);color:var(--dim);
  width:32px;height:32px;border-radius:50%;font-size:.85em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);transition:all .15s;
  font-family:inherit;
}
.theme-btn:hover{color:var(--text);border-color:var(--border-hover)}

/* Controls */
.controls-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.controls-row input{
  background:var(--card);color:var(--text);border:1px solid var(--border);
  padding:8px 12px;border-radius:6px;font-size:.82em;font-family:inherit;
  font-weight:500;outline:none;transition:border-color .15s;box-shadow:var(--shadow-sm);
}
.controls-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.controls-row input.route-input{width:72px;font-weight:800;text-align:center;font-size:.88em}
.controls-row input.stop-input{flex:1;min-width:0}
.controls-row button{
  background:var(--accent);color:#fff;border:none;
  padding:8px 18px;border-radius:6px;font-size:.76em;font-weight:600;font-family:inherit;
  cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm);white-space:nowrap;
}
.controls-row button:hover{opacity:.9;transform:translateY(-1px)}
.controls-row button:active{transform:scale(.97)}
.controls-row button:disabled{opacity:.5;transform:none}
.controls-row button.ghost-btn{background:var(--card);color:var(--dim);border:1px solid var(--border)}
.controls-row button.ghost-btn:hover{color:var(--text);border-color:var(--border-hover)}

/* Bookmarks */
.bookmarks-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bm-scroll{flex:1;display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.bm-scroll::-webkit-scrollbar{height:3px}.bm-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.bm-chip{
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  background:var(--card);border:1px solid var(--border);
  border-radius:999px;padding:5px 10px;flex:0 0 auto;
  cursor:pointer;font-size:.72em;font-weight:600;color:var(--text);
  transition:all .12s;box-shadow:var(--shadow-sm);
}
.bm-chip:hover{border-color:var(--accent-border);background:var(--accent-light)}
.bm-chip .badge{padding:2px 5px;border-radius:4px;font-size:.7em;font-weight:700}
.bm-chip .badge.kmb{background:var(--kmb-bg);color:var(--kmb);border:1px solid var(--kmb-border)}
.bm-chip .badge.ctb{background:var(--ctb-bg);color:var(--ctb);border:1px solid var(--ctb-border)}
.bm-edit-btn{
  background:var(--card);border:1px solid var(--border);color:var(--dim);
  padding:6px 12px;border-radius:6px;font-size:.7em;cursor:pointer;font-family:inherit;
  font-weight:500;white-space:nowrap;box-shadow:var(--shadow-sm);transition:all .15s;
}
.bm-edit-btn:hover{color:var(--text);border-color:var(--border-hover)}
.bm-edit-btn.active{color:#fff;background:var(--red);border-color:var(--red)}

/* Loading */
.loading-state{text-align:center;padding:48px 20px;color:var(--dim)}
.loading-spinner{width:26px;height:26px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Status */
.status-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.74em;color:var(--dim);flex-wrap:wrap}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease infinite;flex-shrink:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(5,150,105,.5)}50%{box-shadow:0 0 0 5px rgba(5,150,105,0)}}
.op-badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:.8em;font-weight:700}
.op-badge.kmb{background:var(--kmb-bg);color:var(--kmb)}
.op-badge.ctb{background:var(--ctb-bg);color:var(--ctb)}

/* ETA Cards */
.eta-list{display:flex;flex-direction:column;gap:8px}
.eta-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:14px 16px;
  box-shadow:var(--shadow-sm);transition:border-color .2s,box-shadow .2s;
  animation:ci .35s ease;
}
@keyframes ci{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.eta-card:hover{border-color:var(--border-hover);box-shadow:var(--shadow-md)}
.eta-card.first{border-color:var(--green-border);box-shadow:0 0 0 1px rgba(5,150,105,.06)}
.eta-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eta-left{flex:1;min-width:0}
.eta-time{font-size:1.6em;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.eta-card.first .eta-time{color:var(--green)}
.eta-dest{margin-top:3px;font-size:.8em;color:var(--text-secondary);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.eta-right{text-align:right;flex-shrink:0}
.eta-mins{font-size:1.4em;font-weight:800}
.eta-card.first .eta-mins{color:var(--green)}
.eta-card:not(.first) .eta-mins{color:var(--amber)}
.eta-mins.urgent{color:var(--red)!important;animation:urg 1s ease infinite}
@keyframes urg{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.eta-mins-label{font-size:.62em;color:var(--dim);font-weight:500}
.eta-remark{margin-top:6px;font-size:.72em;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:6px;padding:4px 8px;display:inline-block}
.eta-progress{height:2.5px;background:var(--bg);border-radius:4px;margin-top:8px;overflow:hidden}
.eta-progress-fill{height:100%;border-radius:4px;transition:width 1s linear}
.eta-card.first .eta-progress-fill{background:linear-gradient(90deg,var(--green),var(--cyan))}
.eta-card:not(.first) .eta-progress-fill{background:linear-gradient(90deg,var(--amber),var(--accent))}

/* Timer bar */
.timer-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-top:8px;font-size:.64em;color:var(--dim)}
.timer-ind{display:inline-flex;align-items:center;gap:5px}
.timer-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:tdot 1s ease infinite;display:inline-block}
.timer-dot.paused{background:var(--dim);animation:none}
@keyframes tdot{0%,100%{opacity:1}50%{opacity:.3}}
.timer-bar button{background:var(--card);border:1px solid var(--border);color:var(--dim);padding:4px 12px;border-radius:6px;font-size:.9em;cursor:pointer;font-family:inherit;font-weight:500;box-shadow:var(--shadow-sm);transition:all .15s}
.timer-bar button:hover{color:var(--text);border-color:var(--border-hover)}
.timer-bar button.paused{color:var(--amber);border-color:var(--amber-border);background:var(--amber-bg)}

/* Footer */
.footer-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px;font-size:.64em;color:var(--dim)}
.footer-bar a{color:var(--accent);text-decoration:none;font-weight:500}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h2{font-size:.92em;font-weight:600;margin-bottom:12px;letter-spacing:-.01em}
.modal label{display:block;font-size:.7em;color:var(--dim);margin:10px 0 4px;font-weight:500}
.modal input,.modal select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:.82em;outline:none;font-family:inherit;transition:border-color .15s}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal .actions button{padding:10px 16px;border-radius:6px;font-size:.78em;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit;transition:all .15s;border:none}
.btn-primary{flex:1;min-width:100px;background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)!important}.btn-secondary:hover{background:var(--border)}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--border)!important}.btn-ghost:hover{color:var(--text)}

/* Stop card in modal */
.stop-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.stop-card:hover{border-color:var(--accent-border);background:var(--accent-light)}
.stop-title{font-weight:600;font-size:.8em}
.stop-sub{margin-top:2px;color:var(--dim);font-size:.7em}
.stop-actions{display:flex;gap:5px;margin-top:7px}
.stop-actions button{flex:1;border:none;border-radius:6px;padding:6px 10px;font-size:.76em;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;color:#fff;background:var(--accent)}
.stop-actions button.sec{background:var(--bg);color:var(--text);border:1px solid var(--border)}

/* Direction cards in modal */
.dir-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .15s;margin-bottom:8px}
.dir-card:hover{border-color:var(--accent-border);background:var(--accent-light)}
.dir-card .dir-arrow{font-size:1.3em;flex-shrink:0}
.dir-card .dir-info{flex:1;min-width:0}
.dir-card .dir-label{font-weight:600;font-size:.82em}
.dir-card .dir-sub{font-size:.68em;color:var(--dim);margin-top:2px}

/* Toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:8px 16px;font-size:.78em;font-weight:500;z-index:300;opacity:0;transition:opacity .2s;box-shadow:var(--shadow-md);pointer-events:none}
.toast.show{opacity:1}

/* Chat */
.chat-toggle{position:fixed;bottom:18px;right:18px;z-index:50;width:48px;height:48px;border-radius:10px;border:1px solid var(--border);cursor:pointer;overflow:hidden;box-shadow:var(--shadow-md);padding:0;background:var(--card);transition:all .2s}
.chat-toggle:hover{border-color:var(--accent)}
.chat-toggle:active{transform:scale(.93)}
.chat-toggle img{width:100%;height:100%;object-fit:cover}
.chat-panel{position:fixed;bottom:76px;right:18px;z-index:51;width:min(340px,calc(100vw - 28px));height:400px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.15)}
.chat-panel.open{display:flex}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.chat-head img{width:28px;height:28px;border-radius:6px;object-fit:cover;border:1px solid var(--border)}
.chat-head .close-btn{background:none;border:none;color:var(--dim);font-size:1em;cursor:pointer;font-family:inherit}.chat-head .close-btn:hover{color:var(--text)}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:.78em;line-height:1.5}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:6px;animation:fIn .25s}
.chat-msg.bot{background:var(--bg);align-self:flex-start;border:1px solid var(--border)}
.chat-msg.user{background:var(--accent);align-self:flex-end;color:#fff;font-weight:500}
.chat-input-row{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border);background:var(--card)}
.chat-input-row input{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.78em;outline:none;font-family:inherit}
.chat-input-row input:focus{border-color:var(--accent)}
.chat-input-row button{background:var(--accent);border:none;border-radius:6px;padding:8px 14px;color:#fff;font-weight:600;cursor:pointer;font-size:.78em;font-family:inherit}
.chat-input-row button:hover{opacity:.9}
.chat-typing{display:flex;gap:4px;padding:8px 12px;align-self:flex-start}
.chat-typing span{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bb 1.4s infinite}
.chat-typing span:nth-child(2){animation-delay:.2s}.chat-typing span:nth-child(3){animation-delay:.4s}
@keyframes bb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes fIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:380px){body{padding:14px 10px 100px}.eta-card{padding:12px 12px}.controls-row{gap:6px}.controls-row input{padding:7px 8px;font-size:.76em}}
</style>
</head>
<body>

<div class="page">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-brand">
      <h1>巴士 ETA</h1>
      <span class="sub">KMB + Citybus · 實時到站</span>
    </div>
    <div class="topbar-actions">
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="切換主題">🌙</button>
    </div>
  </div>

  <!-- Search -->
  <div class="controls-row">
    <input id="routeNo" class="route-input" value="722" placeholder="路線">
    <input id="stopId" class="stop-input" value="001272" placeholder="Stop ID 或站名">
    <button id="checkBtn" onclick="openEta()">查詢</button>
    <button class="ghost-btn" onclick="openSearch()">搜尋</button>
  </div>

  <!-- Bookmarks -->
  <div class="bookmarks-row">
    <div id="bmList" class="bm-scroll"></div>
    <button id="bmEditBtn" class="bm-edit-btn" onclick="toggleEdit()">管理</button>
  </div>

  <!-- Loading -->
  <div id="loading" class="loading-state" style="display:none"><div class="loading-spinner"></div><p>載入中...</p></div>

  <!-- Main -->
  <div id="app">
    <div id="status" class="status-bar"></div>
    <div id="etaList" class="eta-list"></div>
    <div id="error" style="color:var(--red);font-size:.74em;text-align:center;margin-top:6px"></div>

    <!-- Timer -->
    <div class="timer-bar">
      <span class="timer-ind"><span class="timer-dot" id="rd"></span><span id="tl">10s</span></span>
      <button id="tpBtn" onclick="togglePause()">暫停</button>
    </div>

    <div class="footer-bar">
      <span>即時到站時間僅供參考</span>
      <span><a href="/">首頁</a></span>
    </div>
  </div>
</div>

<!-- Chat -->
<button class="chat-toggle" id="chatToggle" onclick="toggleChat()"><img src="/assets/busbot-avatar.jpg" alt="巴膠仔"></button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <img src="/assets/busbot-avatar.jpg" alt="巴膠仔">
    <div style="flex:1"><div style="font-weight:600;font-size:.82em">巴膠仔</div><div style="font-size:.64em;color:var(--dim)">在線</div></div>
    <button class="close-btn" onclick="document.getElementById('chatPanel').style.display='none'">&times;</button>
  </div>
  <div class="chat-msgs" id="chatMsgs">
    <div class="chat-msg bot">嗨～我係巴膠仔🚌 有咩巴士問題隨時問我！</div>
  </div>
  <div class="chat-input-row">
    <input id="chatInput" placeholder="輸入問題..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">發送</button>
  </div>
</div>

<!-- Search Modal -->
<div id="searchModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 id="sTitle">🔍 搜尋巴士路線</h2>
      <button class="btn-ghost" style="padding:6px 10px;font-size:.76em" onclick="closeSearch()">✕</button>
    </div>

    <!-- Step 1: Route -->
    <div id="step1">
      <label>輸入巴士路線</label>
      <input id="sRoute" value="" placeholder="例如：722 / 6 / 101 / 113" style="font-size:1.1rem;font-weight:800;text-align:center;padding:12px">
      <div class="actions">
        <button class="btn-primary" onclick="findRoute()" style="flex:1">🔍 搜尋路線</button>
      </div>
      <div id="sStatus1" style="font-size:.72em;color:var(--dim);margin-top:8px;text-align:center"></div>
    </div>

    <!-- Step 2: Direction -->
    <div id="step2" style="display:none">
      <p style="font-size:.82em;margin-bottom:10px">路線 <b id="sRouteLabel" style="color:var(--accent)"></b> 有以下方向：</p>
      <div id="dirList"></div>
      <div class="actions"><button class="btn-ghost" onclick="goStep(1)">← 重新搜尋</button></div>
    </div>

    <!-- Step 3: Stops -->
    <div id="step3" style="display:none">
      <div id="step3Loading" style="text-align:center;padding:30px">
        <div class="loading-spinner" style="margin:0 auto 12px"></div>
        <div style="color:var(--accent);font-size:.82em;font-weight:600">載入站位中...</div>
        <div style="color:var(--dim);font-size:.72em;margin-top:4px">同時查詢九巴同城巴</div>
      </div>
      <div id="step3Content" style="display:none">
        <p style="font-size:.8em;margin-bottom:8px">
          <b id="sDirLabel" style="color:var(--accent)"></b> · <span id="sRouteLabel2"></span>
        </p>
        <div id="sStatus3" style="font-size:.72em;color:var(--red);margin-bottom:6px"></div>
        <input id="sFilter" placeholder="篩選站名…（例如：鰂魚涌、英皇道）" style="margin-bottom:8px">
        <div id="stopList" style="max-height:45vh;overflow-y:auto"></div>
        <div class="actions"><button class="btn-ghost" onclick="goStep(2)">← 重新揀方向</button></div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ── THEME ──
function getSystemTheme(){return window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
function toggleTheme(){
  var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  applyTheme(n);localStorage.setItem('eta-theme',n);
}
(function(){
  var s=localStorage.getItem('eta-theme'),t=s||getSystemTheme();applyTheme(t);
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(e){if(!localStorage.getItem('eta-theme'))applyTheme(e.matches?'dark':'light')});
})();

// ── STATE ──
var refreshTimer=null,cdTimer=null,cdVal=10,paused=false;
var BK='citybus_eta_bk_v7';
var memoryBK=[];
var bmEditMode=false;

// ── TOAST ──
function showToast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(function(){e.classList.remove('show')},2200);}

// ── BOOKMARKS ──
function getBK(){try{if(!storageOK())return memoryBK;var r=localStorage.getItem(BK);return r?JSON.parse(r):[];}catch{return memoryBK;}}
function saveBK(l){try{if(!storageOK()){memoryBK=l;return;}localStorage.setItem(BK,JSON.stringify(l));}catch{memoryBK=l;}}
function storageOK(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch{return false;}}

function renderBK(){
  var el=document.getElementById('bmList');
  var bk=getBK();
  if(!bk.length){el.innerHTML='<div style="color:var(--dim);font-size:.7em;padding:4px 0">未有收藏 · 按搜尋加入</div>';return;}
  el.innerHTML=bk.map(function(it,i){
    var opCls=it.co.indexOf('KMB')>=0?'kmb':'ctb';
    var opLabel=it.co.indexOf('KMB')>=0?'九巴':'城巴';
    var delBtn=bmEditMode?'<button onclick="event.stopPropagation();delBK('+i+')" style="background:none;border:none;color:var(--red);font-size:.9em;cursor:pointer;padding:0 3px;font-family:inherit">✕</button>':'';
    return '<div class="bm-chip" data-r="'+it.route+'" data-s="'+it.stop_id+'" data-co="'+it.co+'" data-idx="'+i+'"><span class="badge '+opCls+'">'+opLabel+'</span><span>'+(it.custom_name||it.name_tc||it.stop_id)+' '+it.route+'</span>'+delBtn+'</div>';
  }).join('');
  if(!bmEditMode){
    el.querySelectorAll('.bm-chip').forEach(function(c){c.onclick=function(){
      document.getElementById('routeNo').value=c.dataset.r;
      document.getElementById('stopId').value=c.dataset.s;
      openEta(c.dataset.co);
    };});
  }
}

function toggleEdit(){
  bmEditMode=!bmEditMode;
  var btn=document.getElementById('bmEditBtn');
  btn.textContent=bmEditMode?'完成':'管理';
  btn.classList.toggle('active',bmEditMode);
  renderBK();
}

function delBK(idx){
  var bk=getBK();
  if(idx>=0&&idx<bk.length){
    var name=bk[idx].custom_name||bk[idx].name_tc||bk[idx].stop_id;
    bk.splice(idx,1);saveBK(bk);renderBK();showToast('已刪除 '+name);
  }
}

function addBK(it){
  var bk=getBK();
  if(bk.some(function(b){return b.route===it.route&&b.stop_id===it.stop_id&&b.co===it.co})){showToast('已存在');return false;}
  saveBK([it].concat(bk).sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)}));
  renderBK();showToast('已收藏');return true;
}

// ── TIMER ──
function startCD(){cdVal=10;if(cdTimer)clearInterval(cdTimer);var r=document.getElementById('rd');r.classList.remove('paused');cdTimer=setInterval(function(){cdVal--;if(cdVal<0){document.getElementById('tl').textContent='0';return}document.getElementById('tl').textContent=cdVal+'s'},1000)}
function clearAll(){if(refreshTimer){clearTimeout(refreshTimer);refreshTimer=null;}if(cdTimer){clearInterval(cdTimer);cdTimer=null;}}
function togglePause(){paused=!paused;var b=document.getElementById('tpBtn'),r=document.getElementById('rd');if(paused){b.textContent='繼續';b.classList.add('paused');r.classList.add('paused');document.getElementById('tl').textContent='--';clearAll()}else{b.textContent='暫停';b.classList.remove('paused');r.classList.remove('paused');startCD();refreshTimer=setTimeout(function(){openEta(null,null,true)},10000)}}

// ── ETA ──
async function openEta(forceCo,partnerStop,silent){
  var route=document.getElementById('routeNo').value.trim().toUpperCase();
  var stopInput=document.getElementById('stopId').value.trim();
  var stopParts=stopInput.split('+');
  var stopId=stopParts[0];
  var partner=partnerStop||(stopParts[1]||null);
  var statusEl=document.getElementById('status');var listEl=document.getElementById('etaList');var errEl=document.getElementById('error');
  clearAll();errEl.textContent='';
  if(!route||!stopId){errEl.textContent='請輸入路線同 Stop ID';return;}
  document.getElementById('checkBtn').disabled=true;
  if(!silent){document.getElementById('loading').style.display='block';document.getElementById('app').style.display='none';statusEl.innerHTML='<span class="status-dot"></span>查詢中…'}

  try{
    var allEtas=[],co=forceCo||detectCO(route,stopId);
    if(co==='CTB'||co==='ALL'){try{var r1=await fetch('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/'+stopId+'/'+route,{cache:'no-store'});var d1=await r1.json();(d1.data||[]).forEach(function(i){i._co='CTB';allEtas.push(i);});}catch(e){}}
    if(co==='KMB'||co==='ALL'){try{var r2=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/eta/'+stopId+'/'+route+'/1',{cache:'no-store'});var d2=await r2.json();(d2.data||[]).forEach(function(i){i._co='KMB';allEtas.push(i);});}catch(e){}}
    if(partner){var partnerCo=co==='KMB'?'CTB':'KMB';
      if(partnerCo==='CTB'){try{var r3=await fetch('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/'+partner+'/'+route,{cache:'no-store'});var d3=await r3.json();(d3.data||[]).forEach(function(i){i._co='CTB';allEtas.push(i);});}catch(e){}}
      else{try{var r4=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/eta/'+partner+'/'+route+'/1',{cache:'no-store'});var d4=await r4.json();(d4.data||[]).forEach(function(i){i._co='KMB';allEtas.push(i);});}catch(e){}}
    }
    var filtered=allEtas.filter(function(i){return i&&i.eta});
    if(searchState.dir){filtered=filtered.filter(function(i){return !i.dir||i.dir===searchState.dir;})}
    var items=filtered.sort(function(a,b){return new Date(a.eta)-new Date(b.eta)});
    if(!items.length){statusEl.innerHTML='<span class="status-dot"></span>'+route+' 暫時冇 ETA';if(!silent){document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block'}startCD();refreshTimer=setTimeout(function(){openEta(co,partner,null,true)},10000);return;}

    var ops=[].concat.apply([],items.map(function(i){return i._co})).filter(function(v,i,a){return a.indexOf(v)===i});
    var opLabel=ops.map(function(o){return o==='KMB'?'<span class="op-badge kmb">九巴</span>':'<span class="op-badge ctb">城巴</span>'}).join(' ');
    var first=items[0];
    statusEl.innerHTML='<span class="status-dot"></span>'+route+' → '+(first.dest_tc||'')+' '+opLabel+' · 自動更新';

    listEl.innerHTML='';
    items.slice(0,5).forEach(function(item,idx){
      var mins=fmtMins(item.eta);
      var isUrgent=mins==='即到'||(typeof mins==='number'&&mins<=2);
      var opCls=item._co==='KMB'?'kmb':'ctb';
      var opShort=item._co==='KMB'?'九巴':'城巴';
      var pct=typeof mins==='number'?Math.max(5,Math.min(100,100-mins*10)):50;
      var div=document.createElement('div');
      div.className='eta-card'+(idx===0?' first':'');
      div.style.animationDelay=(idx*0.06)+'s';
      div.innerHTML='\
        <div class="eta-row">\
          <div class="eta-left">\
            <div class="eta-time">'+fmtTime(item.eta)+'</div>\
            <div class="eta-dest"><span class="op-badge '+opCls+'">'+opShort+'</span> → '+(item.dest_tc||'')+'</div>\
          </div>\
          <div class="eta-right">\
            <div class="eta-mins '+(isUrgent?'urgent':'')+'">'+mins+'</div>\
            <div class="eta-mins-label">'+(mins==='即到'?'':'分鐘')+'</div>\
          </div>\
        </div>\
        '+(item.rmk_tc?'<div class="eta-remark">📢 '+item.rmk_tc+'</div>':'')+'\n        <div class="eta-progress"><div class="eta-progress-fill" style="width:'+pct+'%"></div></div>\
      ';
      listEl.appendChild(div);
    });

    if(!silent){document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block'}
    startCD();refreshTimer=setTimeout(function(){openEta(co,partner,null,true)},10000);
  }catch(e){if(!silent){errEl.textContent='查詢失敗：'+e.message;statusEl.textContent='';document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block'}else{var lastCo=forceCo||(partner?partner.length>6?'CTB':'KMB':null);startCD();refreshTimer=setTimeout(function(){openEta(lastCo,partner,null,true)},10000)}}
  finally{document.getElementById('checkBtn').disabled=false;}
}

function detectCO(route,stopId){
  if(/^[0-9A-F]{16}$/i.test(stopId))return'KMB';
  if(/^\d{6}$/.test(stopId))return'CTB';
  return'ALL';
}
function fmtTime(eta){var t=new Date(eta);if(isNaN(t))return'??';return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');}
function fmtMins(eta){var t=new Date(eta);if(isNaN(t))return'';var m=Math.max(0,Math.round((t.getTime()-Date.now())/60000));return m===0?'即到':m;}

// ── SEARCH MODAL ──
var searchState={route:'',co:'',dir:'',dirCode:'',stops:[],mergedStops:[]};

function openSearch(){document.getElementById('searchModal').style.display='flex';goStep(1);}
function closeSearch(){document.getElementById('searchModal').style.display='none';}

function goStep(n){
  document.getElementById('step1').style.display=n===1?'block':'none';
  document.getElementById('step2').style.display=n===2?'block':'none';
  document.getElementById('step3').style.display=n===3?'block':'none';
  var titles={'1':'🔍 搜尋巴士路線','2':'📍 揀方向','3':'🚏 揀站位'};
  document.getElementById('sTitle').textContent=titles[n]||'搜尋';
}

var _kmbRouteStopCache=null,_kmbRouteCache=null,_kmbCacheTs=0,CACHE_TTL=3600000;
var KMB_RS_KEY='kmb_rs_cache_v1',KMB_R_KEY='kmb_r_cache_v1',KMB_TS_KEY='kmb_rs_ts_v1',KMB_STOP_KEY='kmb_stop_cache_v1',KMB_STOP_TS_KEY='kmb_stop_ts_v1';
function loadKMBCache(){
  try{if(!storageOK())return null;var ts=parseInt(localStorage.getItem(KMB_TS_KEY)||'0',10);if(!ts||(Date.now()-ts)>=CACHE_TTL)return null;var rs=localStorage.getItem(KMB_RS_KEY),r=localStorage.getItem(KMB_R_KEY);if(!rs||!r)return null;return{routeStop:JSON.parse(rs),route:JSON.parse(r),ts:ts};}catch(e){return null;}
}
function saveKMBCache(rs,r){
  try{if(!storageOK())return;localStorage.setItem(KMB_RS_KEY,JSON.stringify(rs));localStorage.setItem(KMB_R_KEY,JSON.stringify(r));localStorage.setItem(KMB_TS_KEY,String(Date.now()));}catch(e){}
}
(function(){var c=loadKMBCache();if(c){_kmbRouteStopCache={data:c.routeStop};_kmbRouteCache={data:c.route};_kmbCacheTs=c.ts;}})();

async function findRoute(){
  var route=document.getElementById('sRoute').value.trim().toUpperCase();
  var s1=document.getElementById('sStatus1');
  if(!route){s1.textContent='請輸入路線';return;}
  searchState.route=route;
  s1.innerHTML='<div class="loading-spinner" style="margin:0 auto;width:20px;height:20px;border-width:2px"></div>';

  var dirs=[],errors=[],kmbRS=[];
  var now=Date.now();

  if(_kmbRouteStopCache&&_kmbRouteCache&&(now-_kmbCacheTs)<CACHE_TTL){
    kmbRS=(_kmbRouteStopCache.data||[]).filter(function(s){return s.route===route});
    if(kmbRS.length){
      var seen={};
      (_kmbRouteCache.data||[]).forEach(function(r){
        if(r.route===route){var key=r.bound+'_'+(r.service_type||'1');if(!seen[key]){seen[key]=true;dirs.push({co:'KMB',dir:r.bound,dest:r.bound==='O'?(r.dest_tc||'往外'):(r.orig_tc||r.dest_tc||'返程'),service_type:r.service_type||'1'});}}
      });
    }
  }else{
    try{var r=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop',{cache:'no-store'});if(r.ok){var d=await r.json();_kmbRouteStopCache=d;kmbRS=(d.data||[]).filter(function(s){return s.route===route});if(kmbRS.length){try{var rr=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route',{cache:'no-store'});if(rr.ok){var rd=await rr.json();_kmbRouteCache=rd;}}catch(e){errors.push('KMB route: '+e.message)}}_kmbCacheTs=now;saveKMBCache(d.data,(_kmbRouteCache&&_kmbRouteCache.data)||[]);if(_kmbRouteCache){var seen={};(_kmbRouteCache.data||[]).forEach(function(r){if(r.route===route){var key=r.bound+'_'+(r.service_type||'1');if(!seen[key]){seen[key]=true;dirs.push({co:'KMB',dir:r.bound,dest:r.bound==='O'?(r.dest_tc||'往外'):(r.orig_tc||r.dest_tc||'返程'),service_type:r.service_type||'1'});}}});}}}catch(e){errors.push('KMB: '+e.message)}
  }

  try{var r1=await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/CTB/'+route,{cache:'no-store'});if(r1.ok){var d1=await r1.json();if(d1.data){var info=d1.data,seenDir={};dirs.forEach(function(x){seenDir[x.co+'_'+x.dir]=true;});if(!seenDir.CTB_O)dirs.push({co:'CTB',dir:'O',dest:info.dest_tc||'往外'});if(!seenDir.CTB_I)dirs.push({co:'CTB',dir:'I',dest:info.orig_tc||info.dest_tc||'返程'});}}}catch(e){errors.push('CTB: '+e.message)}

  s1.textContent='';
  if(!dirs.length){s1.textContent='搵唔到路線 '+route+(errors.length?' ('+errors.join(', ')+')':'');return;}

  searchState.co=dirs[0].co;
  var dirEl=document.getElementById('dirList');dirEl.innerHTML='';
  dirs.forEach(function(d){
    var opCls=d.co==='KMB'?'kmb':'ctb';
    var opLabel=d.co==='KMB'?'九巴':'城巴';
    var dirLabel=d.dir==='O'?'往':'返';
    var div=document.createElement('div');
    div.className='dir-card';
    div.innerHTML='<span class="dir-arrow">'+(d.dir==='O'?'➡️':'⬅️')+'</span><div class="dir-info"><div class="dir-label">'+dirLabel+' '+d.dest+'</div><div class="dir-sub"><span class="op-badge '+opCls+'">'+opLabel+'</span></div></div><span style="color:var(--dim);font-size:.75em">→</span>';
    div.onclick=function(){pickDir(d)};
    dirEl.appendChild(div);
  });
  goStep(2);
}

async function pickDir(d){
  searchState.co=d.co;searchState.dir=d.dir;searchState.dirCode=d.dir==='O'?'outbound':'inbound';
  var loadingEl=document.getElementById('step3Loading'),contentEl=document.getElementById('step3Content');
  var labelEl=document.getElementById('sDirLabel');
  var sStatus3=document.getElementById('sStatus3');
  document.getElementById('sDirLabel').textContent=(d.dir==='O'?'往 ':'返 ')+d.dest;
  document.getElementById('sRouteLabel2').textContent=searchState.route;
  goStep(3);
  loadingEl.style.display='block';
  contentEl.style.display='none';
  if(sStatus3)sStatus3.textContent='';

  try{
    var stops=[],stopMap={};
    var now=Date.now();
    var rsData=_kmbRouteStopCache;
    if(!rsData||(now-_kmbCacheTs)>=CACHE_TTL){
      var lc=loadKMBCache();
      if(lc){rsData={data:lc.routeStop};_kmbRouteStopCache=rsData;_kmbCacheTs=lc.ts;}
    }
    if(!rsData||!rsData.data){
      var rsRes=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop',{cache:'no-store'});
      if(!rsRes.ok)throw new Error('KMB route-stop HTTP '+rsRes.status);
      rsData=await rsRes.json();
      _kmbRouteStopCache=rsData;
      saveKMBCache(rsData.data,(_kmbRouteCache&&_kmbRouteCache.data)||[]);
      _kmbCacheTs=now;
    }
    var kmbStops=(rsData.data||[]).filter(function(s){return s.route===searchState.route&&s.bound===d.dir});

    var stopTs=parseInt((function(){try{return localStorage.getItem(KMB_STOP_TS_KEY)||'0';}catch(e){return '0';}})(),10);
    var sData=null;
    if((now-stopTs)<CACHE_TTL){
      try{var cached=localStorage.getItem(KMB_STOP_KEY);if(cached){sData={data:JSON.parse(cached)};}}catch(e){}
    }
    if(!sData){
      var sRes=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop',{cache:'no-store'});
      if(!sRes.ok)throw new Error('KMB stop HTTP '+sRes.status);
      sData=await sRes.json();
      try{if(storageOK()){localStorage.setItem(KMB_STOP_KEY,JSON.stringify(sData.data||[]));localStorage.setItem(KMB_STOP_TS_KEY,String(now));}}catch(e){}
    }
    (sData.data||[]).forEach(function(s){stopMap[s.stop]=s});
    kmbStops.forEach(function(s){var info=stopMap[s.stop]||{};stops.push({stop_id:s.stop,name_tc:info.name_tc||'',name_en:info.name_en||'',seq:parseInt(s.seq)||0,co:'KMB',lat:parseFloat(info.lat||0),lng:parseFloat(info.long||0)});});

    var dirParam=d.dir==='O'?'outbound':'inbound';
    var cRsRes=await fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/'+searchState.route+'/'+dirParam,{cache:'no-store'});
    if(!cRsRes.ok)throw new Error('CTB route-stop HTTP '+cRsRes.status);
    var cRsData=await cRsRes.json();
    for(var _i=0;_i<(cRsData.data||[]).length;_i++){var s=cRsData.data[_i];try{var sr=await fetch('https://rt.data.gov.hk/v2/transport/citybus/stop/'+s.stop,{cache:'no-store'});if(!sr.ok)continue;var sd=await sr.json();var info=sd.data||{};stops.push({stop_id:s.stop,name_tc:info.name_tc||'',name_en:info.name_en||'',seq:parseInt(s.seq)||0,co:'CTB',lat:parseFloat(info.lat||0),lng:parseFloat(info.long||0)});}catch(e){}}

    stops.sort(function(a,b){return a.seq-b.seq});
    var merged=[],used={};
    stops.forEach(function(s){
      if(used[s.stop_id])return;used[s.stop_id]=true;
      var group=[s];
      stops.forEach(function(s2){if(used[s2.stop_id]||s2.co===s.co)return;var matched=false;if(s.lat&&s.lng&&s2.lat&&s2.lng){var dist=Math.sqrt(Math.pow(s.lat-s2.lat,2)+Math.pow(s.lng-s2.lng,2));if(dist<0.003)matched=true;}if(!matched&&s.name_tc&&s2.name_tc){var n1=s.name_tc.replace(/[(\uff08].*?[)\uff09]/g,'').trim();var n2=s2.name_tc.replace(/[(\uff08].*?[)\uff09]/g,'').trim();if(n1===n2||(n1.length>2&&n2.includes(n1))||(n2.length>2&&n1.includes(n2)))matched=true;}if(!matched&&s.name_en&&s2.name_en){var e1=s.name_en.toLowerCase().split(/[\(,]/)[0].trim();var e2=s2.name_en.toLowerCase().split(/[\(,]/)[0].trim();if(e1===e2&&e1.length>3)matched=true;}if(matched){group.push(s2);used[s2.stop_id]=true;}});
      var bestName=s.name_tc||s.name_en||'',bestEn=s.name_en||'';
      group.forEach(function(g){if(g.name_tc&&g.name_tc.length>bestName.length)bestName=g.name_tc;if(g.name_en&&g.name_en.length>bestEn.length)bestEn=g.name_en;});
      merged.push({stops:group,name_tc:bestName,name_en:bestEn,seq:s.seq});
    });
    searchState.mergedStops=merged;
    contentEl.style.display='block';
    renderStops();
  }catch(e){
    if(sStatus3)sStatus3.textContent='載入失敗：'+(e.message||e);
    labelEl.textContent=(d.dir==='O'?'往 ':'返 ')+d.dest+' · 載入失敗';
  }finally{
    loadingEl.style.display='none';
  }
}

function renderStops(){
  var filter=document.getElementById('sFilter').value.trim().toLowerCase();
  var listEl=document.getElementById('stopList');listEl.innerHTML='';
  var filtered=searchState.mergedStops||[];
  if(filter)filtered=filtered.filter(function(s){return (s.name_tc||'').toLowerCase().includes(filter)||(s.name_en||'').toLowerCase().includes(filter)||(s.stops[0]||{}).stop_id.toLowerCase().includes(filter)});

  if(!filtered.length){listEl.innerHTML='<div style="color:var(--dim);font-size:.8em;text-align:center;padding:20px">搵唔到站</div>';return;}

  filtered.forEach(function(g){
    var ops=[];g.stops.forEach(function(s){if(ops.indexOf(s.co)<0)ops.push(s.co)});
    var badges=ops.map(function(o){return '<span class="op-badge '+(o==='KMB'?'kmb':'ctb')+'">'+(o==='KMB'?'九巴':'城巴')+'</span>'}).join(' ');
    var stopIds=g.stops.map(function(s){return s.stop_id}).join('+');
    var div=document.createElement('div');
    div.className='stop-card';
    div.innerHTML='<div class="stop-title">'+(g.seq?g.seq+'. ':'')+(g.name_tc||g.name_en)+'</div><div class="stop-sub">'+badges+' '+(g.name_en||'')+'</div><div class="stop-actions"><button onclick="pickAndSearch(\''+stopIds+'\',\''+(g.name_tc||'').replace(/'/g,"\\'")+'\')">查 ETA</button><button class="sec" onclick="addBK({route:searchState.route,stop_id:\''+stopIds+'\',name_tc:\''+(g.name_tc||'').replace(/'/g,"\\'")+'\',name_en:\''+(g.name_en||'').replace(/'/g,"\\'")+'\',co:\''+ops.join('+')+'\',custom_name:\'\',pinned:false});showToast(\'已收藏\')">收藏</button></div>';
    listEl.appendChild(div);
  });
}

function pickAndSearch(stopId,name,co){
  document.getElementById('routeNo').value=searchState.route;
  document.getElementById('stopId').value=stopId;
  closeSearch();
  var otherCo=co==='KMB'?'CTB':'KMB';
  openEtaWithPartner(stopId,co,otherCo);
}

async function openEtaWithPartner(stopId,co,otherCo){
  var partnerStop=null;
  try{
    var myInfo=null;
    if(co==='KMB'){var res=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop/'+stopId,{cache:'no-store'});var d=await res.json();myInfo=d.data||{};}
    else{var res=await fetch('https://rt.data.gov.hk/v2/transport/citybus/stop/'+stopId,{cache:'no-store'});var d=await res.json();myInfo=d.data||{};}
    var myLat=parseFloat(myInfo.lat||0),myLng=parseFloat(myInfo.long||myInfo.lng||0);
    if(myLat&&myLng){
      var route=searchState.route;
      if(otherCo==='KMB'){
        var rsRes=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop',{cache:'no-store'});var rsData=await rsRes.json();
        var dirCode=searchState.dir==='O'?'O':'I';var kmbStops=(rsData.data||[]).filter(function(s){return s.route===route&&s.bound===dirCode});
        var allStops=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop',{cache:'no-store'});var allStopsD=await allStops.json();
        var smap={};(allStopsD.data||[]).forEach(function(s){smap[s.stop]=s});
        var bestDist=Infinity;
        kmbStops.forEach(function(s){var info=smap[s.stop]||{};var lat=parseFloat(info.lat||0),lng=parseFloat(info.long||0);if(lat&&lng){var dist=Math.sqrt(Math.pow(lat-myLat,2)+Math.pow(lng-myLng,2));if(dist<bestDist){bestDist=dist;partnerStop=s.stop;}}});
      }else{
        var dirParam=searchState.dir==='O'?'outbound':'inbound';
        var rsRes=await fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/'+route+'/'+dirParam,{cache:'no-store'});var rsData=await rsRes.json();
        var bestDist=Infinity;
        for(var _j=0;_j<(rsData.data||[]).length;_j++){var s=rsData.data[_j];try{var sr=await fetch('https://rt.data.gov.hk/v2/transport/citybus/stop/'+s.stop,{cache:'no-store'});var sd=await sr.json();var info=sd.data||{};var lat=parseFloat(info.lat||0),lng=parseFloat(info.long||0);if(lat&&lng){var dist=Math.sqrt(Math.pow(lat-myLat,2)+Math.pow(lng-myLng,2));if(dist<bestDist){bestDist=dist;partnerStop=s.stop;}}}catch(e){}}
      }
      if(bestDist>0.003)partnerStop=null;
    }
  }catch(e){}
  if(partnerStop){document.getElementById('stopId').value=stopId+'+'+partnerStop;}
  openEta(co,partnerStop);
}

var bms=[];
function toggleChat(){var p=document.getElementById("chatPanel");p.style.display=p.style.display==="flex"?"none":"flex";if(p.style.display==="flex")document.getElementById("chatInput").focus()}
function addCm(r,t){var c=document.getElementById("chatMsgs"),d=document.createElement("div");d.className="chat-msg "+r;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight}
function sendChat(){var i=document.getElementById("chatInput"),t=i.value.trim();if(!t)return;i.value="";addCm("user",t);bms.push({role:"user",content:t});var ld=document.createElement("div");ld.className="chat-typing";ld.innerHTML="<span></span><span></span><span></span>";var c=document.getElementById("chatMsgs");c.appendChild(ld);c.scrollTop=c.scrollHeight;fetch("/busbot-api/message",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:bms})}).then(function(r){return r.json()}).then(function(d){ld.remove();if(d.ok){addCm("bot",d.reply);bms.push({role:"assistant",content:d.reply})}else addCm("bot","錯誤："+d.error)}).catch(function(e){ld.remove();addCm("bot","網絡錯誤")})}
