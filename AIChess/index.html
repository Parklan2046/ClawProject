<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chess - 象棋競技場</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0c0a09 0%, #1c1917 50%, #0c0a09 100%);
  color: #fafafa;
  min-height: 100vh;
}
.header {
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 20px;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, #dc2626, #f59e0b);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}
.logo-text h1 {
  font-size: 24px;
  background: linear-gradient(90deg, #f87171, #fbbf24);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.logo-text p { color: #a8a29e; font-size: 13px; }

.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 30px;
}

.board-container {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 20px;
  min-height: 500px;
}
.board-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.board-title h2 { font-size: 18px; }

/* Turn Indicator */
.turn-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.3s;
}
.turn-indicator.red {
  background: rgba(220, 38, 38, 0.2);
  border: 2px solid rgba(220, 38, 38, 0.5);
  color: #f87171;
}
.turn-indicator.black {
  background: rgba(60, 60, 60, 0.3);
  border: 2px solid rgba(100, 100, 100, 0.5);
  color: #a1a1aa;
}
.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #dc2626;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.2); }
}

/* 2D Board */
.xiangqi-board {
  width: 100%;
  max-width: 450px;
  margin: 0 auto;
  aspect-ratio: 9/10;
  background: #f5deb3;
  border: 3px solid #8b4513;
  border-radius: 4px;
  position: relative;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  grid-template-rows: repeat(10, 1fr);
}
.square {
  border: 0.5px solid rgba(139, 69, 19, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
}
.square:hover { background: rgba(255,200,100,0.2); }
.square.selected { background: rgba(251, 191, 36, 0.4); }
.square.last-move { background: rgba(34, 197, 94, 0.3); }
.square.valid-move { background: rgba(59, 130, 246, 0.3); }
.square.capture { background: rgba(239, 68, 68, 0.3); }

.piece {
  width: 75%;
  aspect-ratio: 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: clamp(14px, 3vw, 20px);
  cursor: pointer;
  transition: all 0.3s;
  user-select: none;
}
.piece:hover { transform: scale(1.15); }
.piece.red {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  color: #fef2f2;
  border: 2px solid #fbbf24;
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
}
.piece.black {
  background: linear-gradient(135deg, #1f1f1f, #0a0a0a);
  color: #d4d4d8;
  border: 2px solid #525252;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}

.river {
  grid-column: 1 / -1;
  background: linear-gradient(90deg, transparent 30%, rgba(135, 206, 235, 0.3) 50%, transparent 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #8b4513;
  font-weight: bold;
}

.sidebar { display: flex; flex-direction: column; gap: 20px; }
.panel {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 16px;
}
.panel h3 {
  font-size: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-config { display: flex; flex-direction: column; gap: 10px; }
.player-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
}
.player-row.red { border-left: 3px solid #dc2626; }
.player-row.black { border-left: 3px solid #525252; }
.player-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.player-icon.red { background: #dc2626; }
.player-icon.black { background: #1f1f1f; border: 1px solid #525252; }
.player-info { flex: 1; }
.player-info .name { font-weight: 600; font-size: 14px; }
.player-info .model { font-size: 12px; color: #a8a29e; }
select {
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
}

.btn-primary {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #000;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.9; }

.history-list {
  max-height: 200px;
  overflow-y: auto;
  font-size: 13px;
  font-family: monospace;
}
.history-item {
  display: flex;
  gap: 10px;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.history-item .num { color: #a8a29e; width: 30px; }
.history-item .red-move { color: #f87171; flex: 1; }
.history-item .black-move { color: #a8a29e; flex: 1; }

.footer {
  text-align: center;
  padding: 30px;
  color: #78716c;
  font-size: 13px;
  border-top: 1px solid rgba(255,255,255,0.05);
}

@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .xiangqi-board { max-width: 350px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">♟</div>
      <div class="logo-text">
        <h1>AI Chess 競技場</h1>
        <p>中國象棋 · AI 對決</p>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="board-container">
    <div class="board-title">
      <h2>🎮 對局棋盤</h2>
      <div class="turn-indicator red" id="turnIndicator">
        <span class="dot"></span>
        <span id="turnText">🔴 紅方回合</span>
      </div>
    </div>
    <div class="xiangqi-board" id="board"></div>
  </div>

  <div class="sidebar">
    <div class="panel">
      <h3>⚔️ 對戰配置</h3>
      <div class="player-config">
        <div class="player-row red">
          <div class="player-icon red">♟</div>
          <div class="player-info">
            <div class="name">紅方</div>
            <div class="model" id="redModel">人類</div>
          </div>
          <select id="redSelect">
            <option value="human">人類</option>
            <option value="deepseek">DeepSeek</option>
            <option value="minimax">MiniMax</option>
            <option value="qwen">Qwen</option>
            <option value="moonshot">Moonshot</option>
          </select>
        </div>
        <div class="player-row black">
          <div class="player-icon black">♟</div>
          <div class="player-info">
            <div class="name">黑方</div>
            <div class="model" id="blackModel">人類</div>
          </div>
          <select id="blackSelect">
            <option value="human">人類</option>
            <option value="deepseek">DeepSeek</option>
            <option value="minimax">MiniMax</option>
            <option value="qwen">Qwen</option>
            <option value="moonshot">Moonshot</option>
          </select>
        </div>
        <button class="btn-primary" id="startBtn" onclick="startGame()">開始對局</button>
      </div>
    </div>

    <div class="panel">
      <h3>📜 棋譜</h3>
      <div class="history-list" id="historyList">
        <div style="color:#78716c; text-align:center; padding:20px;">尚無棋步</div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <p>AI Chess 競技場 · 讓 AI 在棋盤上決高下</p>
  <p style="margin-top:5px; font-size:11px;">v3 - 完整規則引擎</p>
</footer>

<script>
// ====== XIANGQI ENGINE (Ported from TypeScript) ======
const PIECES = {
  r: '俥', n: '傌', b: '相', a: '仕', k: '帥', c: '炮', p: '兵',
  R: '車', N: '馬', B: '象', A: '士', K: '將', C: '砲', P: '卒'
};

const INITIAL_BOARD = [
  ['r','n','b','a','k','a','b','n','r'],
  ['','','','','','','','',''],
  ['','c','','','','','','c',''],
  ['p','','p','','p','','p','','p'],
  ['','','','','','','','',''],
  ['','','','','','','','',''],
  ['P','','P','','P','','P','','P'],
  ['','C','','','','','','C',''],
  ['','','','','','','','',''],
  ['R','N','B','A','K','A','B','N','R']
];

function isRedPiece(p) { return p >= 'A' && p <= 'Z'; }
function inBounds(r, f) { return r >= 0 && r < 10 && f >= 0 && f < 9; }
function inRedPalace(r, f) { return r >= 0 && r <= 2 && f >= 3 && f <= 5; }
function inBlackPalace(r, f) { return r >= 7 && r <= 9 && f >= 3 && f <= 5; }
function inOwnHalf(r, isRed) { return isRed ? r <= 4 : r >= 5; }

function findKing(board, isRed) {
  const target = isRed ? 'K' : 'k';
  for (let r = 0; r < 10; r++) {
    for (let f = 0; f < 9; f++) {
      if (board[r][f] === target) return [r, f];
    }
  }
  return null;
}

function sq(r1, f1, r2, f2) {
  return String.fromCharCode(97 + f1) + r1 + String.fromCharCode(97 + f2) + r2;
}

function pseudoMovesForPiece(board, r, f) {
  const piece = board[r][f];
  if (!piece) return [];
  const isRed = isRedPiece(piece);
  const t = piece.toLowerCase();
  const moves = [];

  const tryAdd = (nr, nf) => {
    if (!inBounds(nr, nf)) return;
    const target = board[nr][nf];
    if (target === '' || isRedPiece(target) !== isRed) {
      moves.push(sq(r, f, nr, nf));
    }
  };

  if (t === 'r') {
    for (let i = r + 1; i < 10; i++) {
      if (board[i][f] === '') moves.push(sq(r, f, i, f));
      else { if (isRedPiece(board[i][f]) !== isRed) moves.push(sq(r, f, i, f)); break; }
    }
    for (let i = r - 1; i >= 0; i--) {
      if (board[i][f] === '') moves.push(sq(r, f, i, f));
      else { if (isRedPiece(board[i][f]) !== isRed) moves.push(sq(r, f, i, f)); break; }
    }
    for (let i = f + 1; i < 9; i++) {
      if (board[r][i] === '') moves.push(sq(r, f, r, i));
      else { if (isRedPiece(board[r][i]) !== isRed) moves.push(sq(r, f, r, i)); break; }
    }
    for (let i = f - 1; i >= 0; i--) {
      if (board[r][i] === '') moves.push(sq(r, f, r, i));
      else { if (isRedPiece(board[r][i]) !== isRed) moves.push(sq(r, f, r, i)); break; }
    }
  } else if (t === 'c') {
    for (let i = r + 1; i < 10; i++) {
      if (board[i][f] === '') moves.push(sq(r, f, i, f));
      else {
        for (let j = i + 1; j < 10; j++) {
          if (board[j][f] !== '') {
            if (isRedPiece(board[j][f]) !== isRed) moves.push(sq(r, f, j, f));
            break;
          }
        }
        break;
      }
    }
    for (let i = r - 1; i >= 0; i--) {
      if (board[i][f] === '') moves.push(sq(r, f, i, f));
      else {
        for (let j = i - 1; j >= 0; j--) {
          if (board[j][f] !== '') {
            if (isRedPiece(board[j][f]) !== isRed) moves.push(sq(r, f, j, f));
            break;
          }
        }
        break;
      }
    }
    for (let i = f + 1; i < 9; i++) {
      if (board[r][i] === '') moves.push(sq(r, f, r, i));
      else {
        for (let j = i + 1; j < 9; j++) {
          if (board[r][j] !== '') {
            if (isRedPiece(board[r][j]) !== isRed) moves.push(sq(r, f, r, j));
            break;
          }
        }
        break;
      }
    }
    for (let i = f - 1; i >= 0; i--) {
      if (board[r][i] === '') moves.push(sq(r, f, r, i));
      else {
        for (let j = i - 1; j >= 0; j--) {
          if (board[r][j] !== '') {
            if (isRedPiece(board[r][j]) !== isRed) moves.push(sq(r, f, r, j));
            break;
          }
        }
        break;
      }
    }
  } else if (t === 'n') {
    const candidates = [
      [r - 2, f - 1, r - 1, f], [r - 2, f + 1, r - 1, f],
      [r + 2, f - 1, r + 1, f], [r + 2, f + 1, r + 1, f],
      [r - 1, f - 2, r, f - 1], [r + 1, f - 2, r, f - 1],
      [r - 1, f + 2, r, f + 1], [r + 1, f + 2, r, f + 1],
    ];
    for (const [nr, nf, lr, lf] of candidates) {
      if (!inBounds(nr, nf)) continue;
      if (board[lr][lf] !== '') continue;
      const target = board[nr][nf];
      if (target === '' || isRedPiece(target) !== isRed) moves.push(sq(r, f, nr, nf));
    }
  } else if (t === 'b') {
    const deltas = [[2, 2], [2, -2], [-2, 2], [-2, -2]];
    for (const [dr, df] of deltas) {
      const nr = r + dr, nf = f + df;
      const eyeR = r + dr / 2, eyeF = f + df / 2;
      if (!inBounds(nr, nf)) continue;
      if (!inOwnHalf(nr, isRed)) continue;
      if (board[eyeR][eyeF] !== '') continue;
      const target = board[nr][nf];
      if (target === '' || isRedPiece(target) !== isRed) moves.push(sq(r, f, nr, nf));
    }
  } else if (t === 'a') {
    const inPalace = isRed ? inRedPalace : inBlackPalace;
    if (!inPalace(r, f)) return moves;
    for (const [dr, df] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
      const nr = r + dr, nf = f + df;
      if (!inBounds(nr, nf)) continue;
      if (!inPalace(nr, nf)) continue;
      const target = board[nr][nf];
      if (target === '' || isRedPiece(target) !== isRed) moves.push(sq(r, f, nr, nf));
    }
  } else if (t === 'k') {
    const inPalace = isRed ? inRedPalace : inBlackPalace;
    if (!inPalace(r, f)) return moves;
    for (const [dr, df] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nr = r + dr, nf = f + df;
      if (!inBounds(nr, nf)) continue;
      if (!inPalace(nr, nf)) continue;
      const target = board[nr][nf];
      if (target === '' || isRedPiece(target) !== isRed) moves.push(sq(r, f, nr, nf));
    }
  } else if (t === 'p') {
    const forward = isRed ? -1 : 1;
    const nr = r + forward;
    if (inBounds(nr, f)) {
      const target = board[nr][f];
      if (target === '' || isRedPiece(target) !== isRed) moves.push(sq(r, f, nr, f));
    }
    const crossed = isRed ? r <= 4 : r >= 5;
    if (crossed) {
      if (f > 0) {
        const target = board[r][f - 1];
        if (target === '' || isRedPiece(target) !== isRed) moves.push(sq(r, f, r, f - 1));
      }
      if (f < 8) {
        const target = board[r][f + 1];
        if (target === '' || isRedPiece(target) !== isRed) moves.push(sq(r, f, r, f + 1));
      }
    }
  }

  return moves;
}

function isSquareAttacked(board, r, f, byRed) {
  for (let rr = 0; rr < 10; rr++) {
    for (let ff = 0; ff < 9; ff++) {
      const p = board[rr][ff];
      if (!p) continue;
      const pIsRed = isRedPiece(p);
      if (pIsRed !== byRed) continue;
      const t = p.toLowerCase();
      const dr = r - rr, df = f - ff;
      const adr = Math.abs(dr), adf = Math.abs(df);

      if (t === 'p') {
        const forward = byRed ? -1 : 1;
        if (dr === forward && df === 0) return true;
        const crossed = byRed ? rr <= 4 : rr >= 5;
        if (crossed && dr === 0 && adf === 1) return true;
      } else if (t === 'n') {
        if ((adr === 1 && adf === 2) || (adr === 2 && adf === 1)) {
          if (adr === 2) {
            const legR = rr + (dr > 0 ? 1 : -1);
            if (board[legR][ff] === '') return true;
          } else {
            const legF = ff + (df > 0 ? 1 : -1);
            if (board[rr][legF] === '') return true;
          }
        }
      } else if (t === 'r' || t === 'c') {
        if (dr === 0 && df !== 0) {
          const step = df > 0 ? 1 : -1;
          let screens = 0;
          for (let i = ff + step; i !== f; i += step) {
            if (board[rr][i] !== '') screens++;
          }
          if (t === 'r') { if (screens === 0) return true; }
          else { if (screens === 1) return true; }
        } else if (df === 0 && dr !== 0) {
          const step = dr > 0 ? 1 : -1;
          let screens = 0;
          for (let i = rr + step; i !== r; i += step) {
            if (board[i][ff] !== '') screens++;
          }
          if (t === 'r') { if (screens === 0) return true; }
          else { if (screens === 1) return true; }
        }
      } else if (t === 'b') {
        if (adr === 2 && adf === 2) {
          const eyeR = rr + dr / 2, eyeF = ff + df / 2;
          if (board[eyeR][eyeF] === '' && inOwnHalf(eyeR, byRed)) return true;
        }
      } else if (t === 'a') {
        if (adr === 1 && adf === 1) {
          if (byRed ? inRedPalace(rr, ff) : inBlackPalace(rr, ff)) return true;
        }
      } else if (t === 'k') {
        if (adr + adf === 1) {
          if (byRed ? inRedPalace(rr, ff) : inBlackPalace(rr, ff)) return true;
        }
      }
    }
  }

  // 飛將檢查
  const redKing = findKing(board, true);
  const blackKing = findKing(board, false);
  if (redKing && blackKing && redKing[1] === blackKing[1]) {
    const lo = Math.min(redKing[0], blackKing[0]) + 1;
    const hi = Math.max(redKing[0], blackKing[0]);
    let blocked = false;
    for (let i = lo; i < hi; i++) {
      if (board[i][redKing[1]] !== '') { blocked = true; break; }
    }
    if (!blocked) {
      if (byRed && (r === blackKing[0] && f === blackKing[1])) return true;
      if (!byRed && (r === redKing[0] && f === redKing[1])) return true;
    }
  }

  return false;
}

function isInCheck(board, turn) {
  const isRed = turn === 'w';
  const k = findKing(board, isRed);
  if (!k) return false;
  return isSquareAttacked(board, k[0], k[1], !isRed);
}

function generateLegalMoves(board, turn) {
  const isRed = turn === 'w';
  const moves = [];
  for (let r = 0; r < 10; r++) {
    for (let f = 0; f < 9; f++) {
      const p = board[r][f];
      if (!p) continue;
      if (isRedPiece(p) !== isRed) continue;
      const pms = pseudoMovesForPiece(board, r, f);
      for (const iccs of pms) {
        const fr = parseInt(iccs[1], 10);
        const ff = iccs.charCodeAt(0) - 97;
        const tr = parseInt(iccs[3], 10);
        const tf = iccs.charCodeAt(2) - 97;
        const captured = board[tr][tf];
        board[tr][tf] = board[fr][ff];
        board[fr][ff] = '';
        const inCheckAfter = isInCheck(board, turn);
        board[fr][ff] = board[tr][tf];
        board[tr][tf] = captured;
        if (!inCheckAfter) moves.push(iccs);
      }
    }
  }
  return moves;
}

// ====== UI CODE ======
let board = [];
let selectedSquare = null;
let history = [];
let gameActive = false;
let currentTurn = 'red';
let validMoves = [];

function initBoard() {
  board = INITIAL_BOARD.map(row => [...row]);
  renderBoard();
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let rank = 0; rank < 10; rank++) {
    for (let file = 0; file < 9; file++) {
      const square = document.createElement('div');
      square.className = 'square';
      square.dataset.rank = rank;
      square.dataset.file = file;
      if (rank === 4 || rank === 5) {
        if (file === 0) {
          const river = document.createElement('div');
          river.className = 'river';
          river.textContent = rank === 4 ? '楚 河' : '漢 界';
          square.appendChild(river);
        }
      }
      const piece = board[rank][file];
      if (piece) {
        const pieceEl = document.createElement('div');
        pieceEl.className = `piece ${piece === piece.toUpperCase() ? 'red' : 'black'}`;
        pieceEl.textContent = PIECES[piece] || piece;
        pieceEl.onclick = (e) => { e.stopPropagation(); handlePieceClick(rank, file, piece); };
        square.appendChild(pieceEl);
      }
      square.onclick = () => handleSquareClick(rank, file);
      boardEl.appendChild(square);
    }
  }
}

function handlePieceClick(rank, file, piece) {
  const isRed = piece === piece.toUpperCase();
  if (currentTurn === 'red' && !isRed) {
    if (selectedSquare) tryMove(selectedSquare.rank, selectedSquare.file, rank, file);
    return;
  }
  if (currentTurn === 'black' && isRed) {
    if (selectedSquare) tryMove(selectedSquare.rank, selectedSquare.file, rank, file);
    return;
  }
  if (selectedSquare && selectedSquare.rank === rank && selectedSquare.file === file) {
    selectedSquare = null;
    validMoves = [];
  } else {
    selectedSquare = { rank, file };
    validMoves = pseudoMovesForPiece(board, rank, file);
  }
  renderBoard();
  highlightValidMoves();
}

function highlightValidMoves() {
  if (!selectedSquare) return;
  const boardEl = document.getElementById('board');
  const squares = boardEl.querySelectorAll('.square');
  validMoves.forEach((iccs) => {
    const toR = parseInt(iccs[3], 10);
    const toF = iccs.charCodeAt(2) - 97;
    const index = toR * 9 + toF;
    if (squares[index]) {
      squares[index].classList.add(board[toR][toF] ? 'capture' : 'valid-move');
    }
  });
}

function handleSquareClick(rank, file) {
  if (!selectedSquare) return;
  const isValid = validMoves.some((iccs) => {
    return parseInt(iccs[3], 10) === rank && iccs.charCodeAt(2) - 97 === file;
  });
  if (isValid) {
    tryMove(selectedSquare.rank, selectedSquare.file, rank, file);
  } else {
    selectedSquare = null;
    validMoves = [];
    renderBoard();
  }
}

function tryMove(fromRank, fromFile, toRank, toFile) {
  const iccs = sq(fromRank, fromFile, toRank, toFile);
  const allLegal = generateLegalMoves(board, currentTurn === 'red' ? 'w' : 'b');
  if (!allLegal.includes(iccs)) {
    selectedSquare = null; validMoves = []; renderBoard(); return;
  }
  const piece = board[fromRank][fromFile];
  const captured = board[toRank][toFile];
  board[toRank][toFile] = piece;
  board[fromRank][fromFile] = '';
  history.push({ move: iccs, turn: currentTurn, piece, captured: captured || undefined });
  selectedSquare = null;
  validMoves = [];
  currentTurn = currentTurn === 'red' ? 'black' : 'red';
  updateTurnIndicator();
  renderBoard();
  renderHistory();
  checkGameEnd();
}

function updateTurnIndicator() {
  const indicator = document.getElementById('turnIndicator');
  const turnText = document.getElementById('turnText');
  const isRed = currentTurn === 'red';
  indicator.className = `turn-indicator ${isRed ? 'red' : 'black'}`;
  turnText.textContent = isRed ? '🔴 紅方回合' : '⚫ 黑方回合';
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div style="color:#78716c; text-align:center; padding:20px;">尚無棋步</div>';
    return;
  }
  let html = '';
  for (let i = 0; i < history.length; i += 2) {
    const num = Math.floor(i / 2) + 1;
    const red = history[i];
    const black = history[i + 1];
    html += `<div class="history-item"><span class="num">${num}.</span><span class="red-move">${red ? red.move + (red.captured ? '×' : '') : ''}</span><span class="black-move">${black ? black.move + (black.captured ? '×' : '') : ''}</span></div>`;
  }
  list.innerHTML = html;
}

function checkGameEnd() {
  const nextTurn = currentTurn === 'red' ? 'w' : 'b';
  const moves = generateLegalMoves(board, nextTurn);
  const inCheckNow = isInCheck(board, nextTurn);
  if (moves.length === 0) {
    if (inCheckNow) {
      showGameStatus(currentTurn, currentTurn === 'red' ? '紅方勝利！將死' : '黑方勝利！將死');
    } else {
      showGameStatus(null, '和棋 - 困斃');
    }
    gameActive = false;
  }
}

function showGameStatus(winner, message) {
  alert(message);
}

function startGame() {
  gameActive = true;
  history = [];
  currentTurn = 'red';
  initBoard();
  updateTurnIndicator();
  renderHistory();
}

window.onload = () => {
  initBoard();
  updateTurnIndicator();
};
</script>

</body>
</html>
