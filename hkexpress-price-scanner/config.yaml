# HKExpress Price Scanner Configuration

routes:
  - from: HKG
    to: NRT
    name: "HKG → Tokyo (Narita)"
  - from: HKG
    to: KIX
    name: "HKG → Osaka (Kansai)"
  - from: HKG
    to: ICN
    name: "HKG → Seoul (Incheon)"
  - from: HKG
    to: BKK
    name: "HKG → Bangkok"
  - from: HKG
    to: TPE
    name: "HKG → Taipei"

scanner:
  headless: true
  days_ahead: 7           # Per-scan date count (practical limit)
  max_retries: 2
  request_delay_sec: 3    # Delay between searches to be polite

database:
  path: "/opt/hkexpress-scanner/prices.db"

scheduler:
  interval_hours: 6       # Scan every 6 hours
  jitter_minutes: 15      # Random delay to avoid detection

notifications:
  telegram:
    enabled: true
    chat_id: "811104510"  # Your Telegram ID
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    from_addr: ""
    to_addr: ""
    password: ""

# Price drop thresholds (HKD) — notify if price falls below
thresholds:
  "HKG-NRT": 800
  "HKG-KIX": 700
  "HKG-ICN": 900
  "HKG-BKK": 600
  "HKG-TPE": 500

report:
  output_path: "/var/www/on9claw/hkexpress/index.html"
