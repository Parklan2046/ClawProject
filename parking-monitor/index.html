<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香園圍停車場 · 即時車位</title>
<style>
:root {
  --bg:#080912; --card:#111224; --card2:#161832;
  --accent:#4de8ff; --accent2:#7c5cff; --text:#e8e6f0; --dim:#6b6990;
  --green:#00e396; --yellow:#ffb627; --red:#ff4d6a; --orange:#ff884d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Header */
.header{background:linear-gradient(180deg,#111224 0%,var(--bg) 100%);padding:32px 20px 24px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
.header h1{font-size:1.8em;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{color:var(--dim);font-size:.88em}
.header .sub b{color:var(--accent)}

/* Stats bar */
.stats-bar{display:flex;justify-content:center;gap:24px;padding:20px;max-width:700px;margin:0 auto;flex-wrap:wrap}
.stat-item{text-align:center;min-width:70px}
.stat-icon{font-size:1.5em;margin-bottom:2px}
.stat-val{font-size:1.6em;font-weight:800;line-height:1.1}
.stat-label{font-size:.7em;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}

/* Controls */
.controls{display:flex;justify-content:center;align-items:center;gap:8px;padding:0 20px 20px;flex-wrap:wrap}
.controls select,.controls input,.controls button{
  background:var(--card2);color:var(--text);border:1px solid rgba(255,255,255,.08);
  padding:10px 14px;border-radius:12px;font-size:.88em;cursor:pointer;outline:none;
  transition:border-color .2s;
}
.controls select:hover,.controls input:hover{border-color:rgba(255,255,255,.15)}
.controls input[type="date"]{color-scheme:dark}
.controls button{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;font-weight:700;color:#fff;letter-spacing:.02em;
}
.sep{color:var(--dim);font-size:.85em}

/* Grid */
.grid{max-width:800px;margin:0 auto;padding:0 16px}
.day-card{
  background:var(--card);border:1px solid rgba(255,255,255,.05);
  border-radius:16px;padding:20px 24px;margin-bottom:10px;
  transition:border-color .2s,transform .15s;
}
.day-card:hover{border-color:rgba(255,255,255,.1)}
.day-card.today{border-color:rgba(77,232,255,.2);background:linear-gradient(135deg,rgba(77,232,255,.04),rgba(124,92,255,.03),var(--card))}

.day-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.day-icon{font-size:1.4em;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.day-icon.open{background:rgba(0,227,150,.12)}
.day-icon.available{background:rgba(77,232,255,.1)}
.day-icon.limited{background:rgba(255,182,39,.12)}
.day-icon.full{background:rgba(255,77,106,.1)}

.day-info{flex:1;min-width:0}
.day-info .date{font-weight:700;font-size:1.05em}
.day-info .weekday{font-size:.78em;color:var(--dim);margin-top:2px}
.day-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:700;letter-spacing:.5px}
.day-badge.open{background:rgba(0,227,150,.15);color:var(--green)}
.day-badge.available{background:rgba(77,232,255,.12);color:var(--accent)}
.day-badge.limited{background:rgba(255,182,39,.15);color:var(--yellow)}
.day-badge.full{background:rgba(255,77,106,.15);color:var(--red)}

/* Availability bar */
.avail-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:14px}
.avail-fill{height:100%;border-radius:3px;transition:width .5s}
.avail-fill.open{background:linear-gradient(90deg,var(--green),#00cc7a)}
.avail-fill.available{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.avail-fill.limited{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.avail-fill.full{background:linear-gradient(90deg,var(--red),#ff2d55)}

/* Time windows */
.windows{display:flex;flex-wrap:wrap;gap:6px}
.win{
  background:rgba(0,227,150,.06);border:1px solid rgba(0,227,150,.15);
  border-radius:10px;padding:7px 14px;font-size:.84em;
  cursor:pointer;transition:all .15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.win:hover{background:rgba(0,227,150,.14);border-color:rgba(0,227,150,.3);transform:translateY(-1px)}
.win .win-time{font-weight:700;color:var(--green)}
.win .win-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.win.full-day{background:rgba(77,232,255,.08);border-color:rgba(77,232,255,.18)}
.win.full-day .win-time{color:var(--accent)}
.win.full-day .win-dot{background:var(--accent)}

.no-windows{color:var(--dim);font-size:.82em;padding:4px 0}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:28px;max-width:400px;width:100%;color-scheme:dark}
.modal h2{font-size:1.15em;margin-bottom:16px;color:var(--accent)}
.modal .info{background:rgba(255,255,255,.03);padding:16px;border-radius:14px;margin-bottom:20px;font-size:.88em;line-height:2}
.modal .info b{color:var(--text)}
.modal .hint{color:var(--yellow);font-size:.78em;margin-bottom:18px;line-height:1.6}
.modal .actions{display:flex;gap:8px}
.modal .actions a,.modal .actions button{padding:12px 18px;border-radius:12px;font-size:.88em;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;flex:1;transition:all .15s}
.btn-go{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.btn-go:hover{opacity:.9;transform:translateY(-1px)}
.btn-copy{background:rgba(255,255,255,.04);color:var(--text);border:1px solid rgba(255,255,255,.08)}
.btn-copy:hover{background:rgba(255,255,255,.08)}
.btn-close{background:transparent;color:var(--dim);border:1px solid rgba(255,255,255,.05)}
.btn-close:hover{color:var(--text)}

/* Notes */
.notes{max-width:800px;margin:24px auto 0;padding:0 16px 40px}
.notes-inner{background:var(--card);border-radius:14px;padding:18px 22px;border:1px solid rgba(255,255,255,.04)}
.notes h3{font-size:.9em;color:var(--accent);margin-bottom:10px}
.notes ol{padding-left:18px;color:var(--dim);font-size:.78em;line-height:2}
.notes ol b{color:var(--text)}

.footer{text-align:center;color:var(--dim);font-size:.72em;padding:20px;border-top:1px solid rgba(255,255,255,.03)}
.footer a{color:var(--accent);text-decoration:none}

.loading{text-align:center;padding:60px 20px}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--dim);font-size:.85em}

@media(max-width:500px){
  .header h1{font-size:1.4em}
  .day-card{padding:14px 16px}
  .stats-bar{gap:12px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🅿️ <span>香園圍邊境停車場</span></h1>
  <p class="sub">Heung Yuen Wai Border Parking · 可預約時段 <b>06:00–22:00</b></p>
</div>

<div class="stats-bar" id="statsBar" style="display:none">
  <div class="stat-item"><div class="stat-icon">🟢</div><div class="stat-val" style="color:var(--green)" id="statOpen">-</div><div class="stat-label">全線開放</div></div>
  <div class="stat-item"><div class="stat-icon">🔵</div><div class="stat-val" style="color:var(--accent)" id="statAvail">-</div><div class="stat-label">大部份開</div></div>
  <div class="stat-item"><div class="stat-icon">🟡</div><div class="stat-val" style="color:var(--yellow)" id="statLimited">-</div><div class="stat-label">少量時段</div></div>
  <div class="stat-item"><div class="stat-icon">🔴</div><div class="stat-val" style="color:var(--red)" id="statFull">-</div><div class="stat-label">已滿</div></div>
</div>

<div class="controls">
  <select id="carType" onchange="refresh()">
    <option value="private">🚗 私家車</option>
    <option value="goods">🚛 客貨車</option>
    <option value="motorcycle">🏍️ 電單車</option>
    <option value="disabled_blue">♿ 傷殘人士 (藍證)</option>
    <option value="disabled_grey">♿ 接載殘疾 (灰證)</option>
  </select>
  <input type="date" id="dateFrom" onchange="refresh()">
  <span class="sep">→</span>
  <input type="date" id="dateTo" onchange="refresh()">
  <button onclick="refresh()">🔄 查詢</button>
</div>

<div id="loading" class="loading"><div class="spinner"></div><p>載入車位資訊...</p></div>
<div id="grid" class="grid" style="display:none"></div>

<div class="notes">
  <div class="notes-inner">
    <h3>📋 預約須知</h3>
    <ol>
      <li>泊車收費以<b>每小時</b>計算，不足一小時亦作一小時收費</li>
      <li>可於入場前 <b>30分鐘至7天</b> 預約 · 最少 <b>2小時</b></li>
      <li>私家車/電單車最長<b>7天</b> · 客貨車最長<b>3天</b></li>
      <li>更改或取消：入場前2小時 · 行政費 <b>HK$100</b></li>
    </ol>
  </div>
</div>

<div class="footer">Parklan Clawhub · <a href="/">← Back</a></div>

<script>
const STATUS={open:{icon:'🟢',label:'全線開放',cls:'open',pct:100},available:{icon:'🔵',label:'大部份可訂',cls:'available',pct:75},limited:{icon:'🟡',label:'少量時段',cls:'limited',pct:35},full:{icon:'🔴',label:'無時段',cls:'full',pct:0},error:{icon:'⚫',label:'錯誤',cls:'full',pct:0}};
const VT={private:{name:'私家車',icon:'🚗'},goods:{name:'客貨車',icon:'🚛'},motorcycle:{name:'電單車',icon:'🏍️'},disabled_blue:{name:'傷殘人士(藍證)',icon:'♿'},disabled_grey:{name:'接載殘疾(灰證)',icon:'♿'}};

function initDates(){
  const hkt=new Date(Date.now()+8*3600000);
  document.getElementById('dateFrom').value=hkt.toISOString().split('T')[0];
  document.getElementById('dateTo').value=new Date(hkt.getTime()+6*86400000).toISOString().split('T')[0];
}
initDates();

async function refresh(){
  const ld=document.getElementById('loading'), g=document.getElementById('grid'), sb=document.getElementById('statsBar');
  ld.style.display='block';g.style.display='none';sb.style.display='none';
  const ct=document.getElementById('carType').value;
  const from=document.getElementById('dateFrom').value, to=document.getElementById('dateTo').value;
  const r=await fetch(`/parking/api/availability?type=${ct}&from=${from}&to=${to}`);
  const d=await r.json();
  ld.style.display='none';g.style.display='block';
  if(!d.ok){g.innerHTML=`<div class="loading"><p>❌ ${d.error}</p></div>`;return}
  render(d);
}

function render(d){
  const todayStr=new Date(Date.now()+8*3600000).toISOString().split('T')[0];
  window._ct=d.car_type_key; window._vn=d.vehicle;

  // Stats
  const days=d.days.filter(x=>x.status!=='error');
  document.getElementById('statOpen').textContent=days.filter(x=>x.status==='open').length;
  document.getElementById('statAvail').textContent=days.filter(x=>x.status==='available').length;
  document.getElementById('statLimited').textContent=days.filter(x=>x.status==='limited').length;
  document.getElementById('statFull').textContent=days.filter(x=>x.status==='full').length;
  document.getElementById('statsBar').style.display='flex';

  document.getElementById('grid').innerHTML=d.days.map(day=>{
    const isToday=day.date.includes(todayStr.replace(/-/g,'/'));
    const st=STATUS[day.status]||STATUS.error;
    const ws=day.windows||[];

    // Availability % for the bar
    const pct=day.total_slots>0?Math.round(day.available_count/day.total_slots*100):0;

    let wh='';
    if(day.status==='error') wh=`<div class="no-windows">⚠️ ${day.error||'無法載入'}</div>`;
    else if(ws.length===0) wh='<div class="no-windows">❌ 全日無可預約時段</div>';
    else if(day.full_day_available) wh=`<div class="win full-day" onclick="openDialog('${day.date}','06:00','22:00',${day.quota})"><span class="win-dot"></span><span class="win-time">06:00–22:00 全線開放</span> <span style="color:var(--dim);font-size:.75em">${day.quota}位</span></div>`;
    else wh='<div class="windows">'+ws.map(w=>`<div class="win" onclick="openDialog('${day.date}','${w.start}','${w.end}',${w.spaces})"><span class="win-dot"></span><span class="win-time">${w.start}–${w.end}</span> <span style="color:var(--dim);font-size:.75em">${w.spaces}位</span></div>`).join('')+'</div>';

    return `<div class="day-card${isToday?' today':''}">
      <div class="day-head">
        <div class="day-icon ${st.cls}">${st.icon}</div>
        <div class="day-info">
          <div class="date">${day.day_label} ${isToday?'<span style="font-size:.7em;color:var(--accent);margin-left:4px">今天</span>':''}</div>
          <div class="weekday">${day.day_name} · ${day.available_count}/${day.total_slots} 時段可用</div>
        </div>
        <div class="day-badge ${st.cls}">${st.label}</div>
      </div>
      <div class="avail-bar"><div class="avail-fill ${st.cls}" style="width:${pct}%"></div></div>
      ${wh}
    </div>`;
  }).join('');
}

function openDialog(date,ws,we,sp){
  const ct=window._ct||'private', v=VT[ct]||VT.private;
  const p=date.split('/');
  const dd=`${p[0]}年${parseInt(p[1])}月${parseInt(p[2])}日`;
  const [sh,sm]=ws.split(':').map(Number),[eh,em]=we.split(':').map(Number);
  const h=eh+em/60-(sh+sm/60);
  const copyText=`${v.name} | ${dd} | ${ws}–${we}`;

  const ov=document.createElement('div');
  ov.className='modal-overlay';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="modal">
    <h2>📋 前往官方網站預約</h2>
    <div class="info">
      <b>${v.icon} ${v.name}</b><br>
      📅 ${dd}<br>
      🕐 ${ws} – ${we} (${h.toFixed(1)}小時)<br>
      🅿️ 剩餘 ≥${sp} 個車位
    </div>
    <div class="hint">✅ 已複製到剪貼簿<br>在官方網站選擇 <b>${v.name}</b>，再揀時段 <b>${ws}–${we}</b></div>
    <div class="actions">
      <a class="btn-go" href="https://hywparking.com.hk/car-park/carParkBooking?lang=zh_TW" target="_blank">🔗 前往官方預約</a>
      <button class="btn-copy" onclick="navigator.clipboard.writeText('${copyText}');this.textContent='✅'">📋</button>
      <button class="btn-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  navigator.clipboard.writeText(copyText).catch(()=>{});
}

document.addEventListener('DOMContentLoaded',refresh);
</script>
</body>
</html>
