<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香園圍停車場監察</title>
<style>
:root {
  --bg:#0f0f1a;--card:#1a1a2e;--accent:#4de8ff;--text:#eaeaea;--dim:#8888aa;
  --green:#00d68f;--yellow:#ffaa00;--red:#e94560;--input-bg:rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;min-height:100vh}
h1{text-align:center;font-size:1.5em;margin-bottom:4px;color:var(--accent)}
.subtitle{text-align:center;color:var(--dim);margin-bottom:20px;font-size:.85em}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.controls select,.controls input,.controls button{background:var(--card);color:var(--text);border:1px solid rgba(255,255,255,.1);padding:10px 14px;border-radius:10px;font-size:.88em;cursor:pointer}
.controls input[type="date"]{color-scheme:dark}
.controls button{background:linear-gradient(135deg,var(--accent),#0077b6);border:none;font-weight:700;color:#000}
.controls button:hover{opacity:.85}
.loading{text-align:center;padding:40px;color:var(--dim)}
.grid{max-width:900px;margin:0 auto}
.day-card{background:var(--card);border-radius:12px;padding:16px 20px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06);display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.day-left{text-align:center}
.day-name{font-size:.78em;color:var(--dim);text-transform:uppercase}
.day-date{font-size:1.2em;font-weight:700}
.day-label{font-size:.72em;color:var(--dim)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
.badge-open{background:rgba(0,214,143,.15);color:var(--green)}
.badge-available{background:rgba(77,232,255,.12);color:var(--accent)}
.badge-limited{background:rgba(255,170,0,.15);color:var(--yellow)}
.badge-full{background:rgba(233,69,96,.15);color:var(--red)}
.badge-error{background:rgba(136,136,170,.15);color:var(--dim)}
.windows{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.window-block{background:rgba(0,214,143,.08);border:1px solid rgba(0,214,143,.2);border-radius:8px;padding:5px 10px;font-size:.82em;white-space:nowrap;cursor:pointer;transition:all .15s}
.window-block:hover{background:rgba(0,214,143,.18);border-color:rgba(0,214,143,.4);transform:translateY(-1px)}
.full-day{background:rgba(77,232,255,.08);border:1px solid rgba(77,232,255,.2);border-radius:8px;padding:5px 12px;font-size:.85em;cursor:pointer}
.full-day:hover{background:rgba(77,232,255,.15)}
.full-day .time{font-weight:700;color:var(--accent)}
.no-windows{color:var(--dim);font-size:.82em}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{color:var(--accent);margin-bottom:12px;font-size:1.1em}
.modal .step{display:none}
.modal .step.active{display:block}
.modal .info{color:var(--dim);font-size:.82em;margin-bottom:16px;line-height:1.7}
.modal .info b{color:var(--text)}
.modal label{display:block;font-size:.82em;color:var(--dim);margin-bottom:4px;margin-top:14px}
.modal label:first-child{margin-top:0}
.modal input,.modal select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:var(--input-bg);color:var(--text);font-size:.9em;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .row{display:flex;gap:10px}
.modal .row>*{flex:1}
.modal .error{color:var(--red);font-size:.78em;margin-top:4px;display:none}
.modal .price-display{background:rgba(77,232,255,.08);border:1px solid rgba(77,232,255,.15);border-radius:10px;padding:14px;text-align:center;margin-top:12px}
.modal .price-display .amount{font-size:1.5em;font-weight:700;color:var(--accent)}
.modal .price-display .detail{font-size:.78em;color:var(--dim);margin-top:2px}
.modal .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal .actions button{padding:10px 20px;border-radius:10px;border:none;font-size:.88em;font-weight:700;cursor:pointer;flex:1;min-width:100px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0077b6);color:#000}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)!important}
.btn-secondary:hover{background:rgba(255,255,255,.1)}
.btn-danger{background:rgba(233,69,96,.15);color:var(--red);border:1px solid rgba(233,69,96,.2)!important}
.btn-success{background:rgba(0,214,143,.2);color:var(--green)}

.notes{max-width:900px;margin:24px auto 0;padding:16px 20px;background:var(--card);border-radius:12px;border:1px solid rgba(255,255,255,.06);font-size:.78em;color:var(--dim)}
.notes h3{color:var(--accent);font-size:.95em;margin-bottom:8px}
.notes ol{padding-left:20px;line-height:1.8}
.last-updated{text-align:center;color:var(--dim);font-size:.72em;margin-top:12px}
.footer{text-align:center;color:var(--dim);font-size:.72em;margin-top:20px}
.footer a{color:var(--accent);text-decoration:none}
.sms-timer{color:var(--yellow);font-size:.8em;margin-top:6px}
.phone-prefix{background:var(--card);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:10px 0 0 10px;padding:10px 12px;font-size:.9em;white-space:nowrap;border-right:none}
.phone-input{border-radius:0 10px 10px 0!important}
</style>
</head>
<body>

<h1>🅿️ 香園圍邊境停車場</h1>
<p class="subtitle">Heung Yuen Wai Border Parking · 可預約時段 (06:00 – 22:00)</p>

<div class="controls">
  <select id="carType" onchange="refresh()">
    <option value="private">私家車</option>
    <option value="goods">客貨車 (二號停車場)</option>
    <option value="motorcycle">電單車</option>
    <option value="disabled_blue">傷殘人士 (藍證)</option>
    <option value="disabled_grey">接載殘疾人士 (灰證)</option>
  </select>
  <input type="date" id="dateFrom" onchange="refresh()">
  <span style="color:var(--dim)">至</span>
  <input type="date" id="dateTo" onchange="refresh()">
  <button onclick="refresh()">🔄 查詢</button>
</div>

<div id="loading" class="loading">載入中...</div>
<div id="grid" class="grid" style="display:none"></div>
<div id="updated" class="last-updated" style="display:none"></div>

<div class="notes">
  <h3>📋 預約須知</h3>
  <ol>
    <li>泊車收費以每一小時計算，不足一小時亦作一小時收費</li>
    <li>可於入場前 <b>30分鐘至7天</b> 預約車位</li>
    <li>私家車/電單車：最短<b>2小時</b>，最長<b>168小時 (7天)</b> · 客貨車：最短<b>2小時</b>，最長<b>72小時 (3天)</b></li>
    <li>可在預約入場時間最少<b>2小時前</b>更改或取消 · 行政費 HK$100</li>
    <li>預約時須繳付全部費用 · 同一車輛不能預約連續兩個泊車時段</li>
  </ol>
</div>

<div class="footer">Parklan Clawhub · <a href="/">← Back</a></div>

<script>
const CAR_TYPES = {
  private:{zone:'1',id:1,code:1,name:'私家車',maxDays:7},
  goods:{zone:'2',id:4,code:4,name:'客貨車',maxDays:3},
  motorcycle:{zone:'1',id:3,code:2,name:'電單車',maxDays:7},
  disabled_blue:{zone:'1',id:6,code:3,name:'傷殘人士(藍證)',maxDays:7},
  disabled_grey:{zone:'1',id:5,code:3,name:'接載殘疾人士(灰證)',maxDays:7},
};

const STATUS_MAP = {
  open:{cls:'badge-open',label:'全日可訂'},
  available:{cls:'badge-available',label:'大部份可訂'},
  limited:{cls:'badge-limited',label:'少量時段'},
  full:{cls:'badge-full',label:'已滿'},
  error:{cls:'badge-error',label:'無法載入'},
};

function initDates(){
  const hkt=new Date(Date.now()+8*3600000);
  document.getElementById('dateFrom').value=hkt.toISOString().split('T')[0];
  document.getElementById('dateTo').value=new Date(hkt.getTime()+6*86400000).toISOString().split('T')[0];
}
initDates();

async function refresh(){
  document.getElementById('loading').style.display='block';
  document.getElementById('grid').style.display='none';
  document.getElementById('updated').style.display='none';
  const carType=document.getElementById('carType').value;
  const from=document.getElementById('dateFrom').value;
  const to=document.getElementById('dateTo').value;
  const resp=await fetch(`/parking/api/availability?type=${carType}&from=${from}&to=${to}`);
  const data=await resp.json();
  document.getElementById('loading').style.display='none';
  document.getElementById('grid').style.display='block';
  if(!data.ok){document.getElementById('grid').innerHTML=`<p class="loading">❌ ${data.error}</p>`;return}
  renderGrid(data);
}

function renderGrid(data){
  const grid=document.getElementById('grid');
  const todayStr=new Date(Date.now()+8*3600000).toISOString().split('T')[0];
  window._carType=data.car_type_key;
  window._vehicleName=data.vehicle;
  grid.innerHTML=data.days.map(day=>{
    const isToday=day.date.includes(todayStr.replace(/-/g,'/'));
    const st=STATUS_MAP[day.status]||STATUS_MAP.error;
    const ws=day.windows||[];
    let wh='';
    if(day.status==='error') wh=`<div class="no-windows">⚠️ ${day.error||'無法載入'}</div>`;
    else if(ws.length===0) wh='<div class="no-windows">❌ 無可預約時段</div>';
    else if(day.full_day_available) wh=`<div class="full-day" onclick="openBooking('${day.date}','06:00','22:00',${day.quota})"><span class="time">06:00 – 22:00 全線開放</span> <span class="spaces">${day.quota} 個車位</span></div>`;
    else wh='<div class="windows">'+ws.map(w=>`<div class="window-block" onclick="openBooking('${day.date}','${w.start}','${w.end}',${w.spaces})"><span class="time">${w.start} – ${w.end}</span> <span class="spaces">· ${w.spaces} 位</span></div>`).join('')+'</div>';
    return `<div class="day-card" style="${isToday?'border-color:rgba(77,232,255,.25)':''}"><div class="day-left"><div class="day-name">${day.day_name}${isToday?' ⬅':''}</div><div class="day-date">${day.day_label}</div></div><div class="day-right"><span class="badge ${st.cls}">${st.label}</span>${wh}</div></div>`;
  }).join('');
  document.getElementById('updated').style.display='block';
  document.getElementById('updated').textContent=`最後更新: ${new Date(Date.now()+8*3600000).toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong'})} HKT`;
}

// ====== BOOKING DIALOG ======
let bookingState={};

function timeOptions(earliest,latest){
  const sh=parseInt(earliest.split(':')[0]), sm=parseInt(earliest.split(':')[1]);
  const eh=parseInt(latest.split(':')[0]), em=parseInt(latest.split(':')[1]);
  let opts='';
  for(let h=sh;h<=eh;h++){
    for(let m=(h===sh?sm:0);m<60;m+=30){
      if(h===eh&&m>em)break;
      const t=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      opts+=`<option value="${t}">${t}</option>`;
    }
  }
  return opts;
}

async function openBooking(date,winStart,winEnd,spaces){
  const ct=CAR_TYPES[window._carType||'private'];
  const parts=date.split('/');
  const displayDate=`${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`;

  bookingState={date,winStart,winEnd,spaces,ct,displayDate,step:1};

  const ov=document.createElement('div');
  ov.id='booking-dialog';
  ov.className='modal-overlay';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`
    <div class="modal">
      <h2>📋 預約車位</h2>
      <div class="info"><b>${ct.name}</b> · ${displayDate} · 可訂範圍 ${winStart}–${winEnd} (最少${spaces}位)</div>
      <div id="step1" class="step active">
        <label>入場時間</label>
        <select id="enterTime">${timeOptions(winStart,winEnd)}</select>
        <label>離場時間 (最少2小時)</label>
        <select id="leaveTime">${timeOptions(winStart,winEnd)}</select>
        <div id="timeError" class="error">⚠️ 最少2小時，離場必須遲過入場</div>
        <div class="actions">
          <button class="btn-secondary" onclick="document.getElementById('booking-dialog').remove()">取消</button>
          <button class="btn-primary" onclick="goStep2()">下一步 →</button>
        </div>
      </div>
      <div id="step2" class="step">
        <div id="priceDisplay" class="price-display" style="display:none">
          <div class="detail">預約費用</div>
          <div class="amount" id="priceAmount">計算中...</div>
          <div class="detail" id="priceDetail"></div>
        </div>
        <label>車牌號碼*</label>
        <input id="carPlate" placeholder="例: XX1234">
        <label>手提電話號碼*</label>
        <div class="row"><span class="phone-prefix">+852</span><input id="phone" class="phone-input" placeholder="98765432"></div>
        <label>電郵 (可選)</label>
        <input id="email" placeholder="your@email.com">
        <label>八達通卡號碼* (入場用)</label>
        <input id="octopus" placeholder="八達通卡號碼 (9位數字)">
        <div class="actions">
          <button class="btn-secondary" onclick="goStep1()">← 返回</button>
          <button class="btn-primary" onclick="sendSMS()">📱 發送驗證碼</button>
        </div>
      </div>
      <div id="step3" class="step">
        <label>驗證碼* (已發送至 +852 <span id="smsPhone"></span>)</label>
        <input id="verifyCode" placeholder="6位數字驗證碼">
        <div class="sms-timer" id="smsTimer"></div>
        <div id="bookError" class="error">⚠️ <span id="bookErrorMsg"></span></div>
        <div class="actions">
          <button class="btn-secondary" onclick="goStep2()">← 修改資料</button>
          <button class="btn-primary" id="btnSubmit" onclick="submitBooking()">💳 確認預約及付款</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);

  // Init leave time to start+2h
  const startVal=document.getElementById('enterTime').value;
  const sh=parseInt(startVal.split(':')[0]);
  const leaveH=Math.min(sh+2,22);
  const leaveVal=`${String(leaveH).padStart(2,'0')}:00`;
  document.getElementById('leaveTime').value=leaveVal;
}

async function goStep2(){
  const enter=document.getElementById('enterTime').value;
  const leave=document.getElementById('leaveTime').value;
  const[eh,em]=enter.split(':').map(Number);
  const[lh,lm]=leave.split(':').map(Number);
  const dur=(lh+lm/60)-(eh+em/60);

  if(dur<2){
    document.getElementById('timeError').style.display='block';
    return;
  }
  document.getElementById('timeError').style.display='none';
  bookingState.enterTime=enter;
  bookingState.leaveTime=leave;
  bookingState.duration=dur;

  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');

  // Calculate price
  try{
    const r=await fetch('/parking/api/calc',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        zone:bookingState.ct.zone,
        cartype:bookingState.ct.code,
        in:`${bookingState.date.replace(/\//g,'-')} ${enter}`,
        out:`${bookingState.date.replace(/\//g,'-')} ${leave}`
      })
    });
    const d=await r.json();
    document.getElementById('priceDisplay').style.display='block';
    if(d.success){
      bookingState.amount=d.data?.totalAmount||d.data?.amount||0;
      document.getElementById('priceAmount').textContent=`HK$${parseFloat(bookingState.amount).toFixed(0)}`;
      document.getElementById('priceDetail').textContent=`${dur.toFixed(1)}小時 · 每小時計算`;
    }else{
      document.getElementById('priceAmount').textContent='計算失敗';
      document.getElementById('priceDetail').textContent=d.message||'';
    }
  }catch(e){
    document.getElementById('priceDisplay').style.display='block';
    document.getElementById('priceAmount').textContent='計算失敗';
  }
}

function goStep1(){
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
}

async function sendSMS(){
  const phone=document.getElementById('phone').value.trim();
  if(!phone||phone.length<8){alert('請輸入正確電話號碼');return}
  const fullPhone='852'+phone;
  try{
    const r=await fetch('/parking/api/sendsms',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:fullPhone})
    });
    const d=await r.json();
    if(d.success){
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step3').classList.add('active');
      document.getElementById('smsPhone').textContent=phone;
      startSMSTimer();
    }else{
      alert(d.message||'發送失敗，請重試');
    }
  }catch(e){alert('發送失敗: '+e.message)}
}

function goStep2(){
  document.getElementById('step3').classList.remove('active');
  document.getElementById('step2').classList.add('active');
}

function startSMSTimer(){
  let s=120;
  const el=document.getElementById('smsTimer');
  const iv=setInterval(()=>{
    el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} 後可重發`;
    if(s--<=0){clearInterval(iv);el.textContent='可重新發送驗證碼'}
  },1000);
}

async function submitBooking(){
  const verifyCode=document.getElementById('verifyCode').value.trim();
  const carPlate=document.getElementById('carPlate').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const email=document.getElementById('email').value.trim();
  const octopus=document.getElementById('octopus').value.trim();

  if(!verifyCode){showBookError('請輸入驗證碼');return}
  if(!carPlate){showBookError('請輸入車牌號碼');return}
  if(!phone||phone.length<8){showBookError('請輸入正確電話號碼');return}
  if(!octopus){showBookError('請輸入八達通卡號碼');return}

  document.getElementById('btnSubmit').disabled=true;
  document.getElementById('btnSubmit').textContent='提交中...';

  try{
    const r=await fetch('/parking/api/book',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        zoneCode:bookingState.ct.zone,
        carTypeId:bookingState.ct.id,
        carTypeCode:bookingState.ct.code,
        enterTime:`${bookingState.date.replace(/\//g,'-')} ${bookingState.enterTime}`,
        leaveTime:`${bookingState.date.replace(/\//g,'-')} ${bookingState.leaveTime}`,
        phone:'852'+phone,
        verifyCode,
        amount:bookingState.amount||0,
        email,
        cardNumber:octopus,
        entryMethod:1,
        carPlate
      })
    });
    const d=await r.json();
    if(d.success){
      // Redirect to payment
      const orderNo=d.data?.orderNo||d.orderNo||'';
      if(orderNo){
        window.open(`https://hywparking.com.hk/car-park/carParkBooking?lang=zh_TW&order=${orderNo}`, '_blank');
      }
      document.getElementById('booking-dialog').remove();
      alert('✅ 預約已建立！請在新頁面完成付款。');
    }else{
      showBookError(d.message||'預約失敗');
      document.getElementById('btnSubmit').disabled=false;
      document.getElementById('btnSubmit').textContent='💳 確認預約及付款';
    }
  }catch(e){
    showBookError('網絡錯誤: '+e.message);
    document.getElementById('btnSubmit').disabled=false;
    document.getElementById('btnSubmit').textContent='💳 確認預約及付款';
  }
}

function showBookError(msg){
  document.getElementById('bookError').style.display='block';
  document.getElementById('bookErrorMsg').textContent=msg;
}

document.addEventListener('DOMContentLoaded',refresh);
</script>
</body>
</html>
