<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香園圍停車場監察</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--accent:#4de8ff;--text:#eaeaea;--dim:#8888aa;--green:#00d68f;--yellow:#ffaa00;--red:#e94560}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;min-height:100vh}
h1{text-align:center;font-size:1.5em;margin-bottom:4px;color:var(--accent)}
.subtitle{text-align:center;color:var(--dim);margin-bottom:20px;font-size:.85em}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.controls select,.controls input,.controls button{background:var(--card);color:var(--text);border:1px solid rgba(255,255,255,.1);padding:10px 14px;border-radius:10px;font-size:.88em;cursor:pointer}
.controls input[type="date"]{color-scheme:dark}
.controls button{background:linear-gradient(135deg,var(--accent),#0077b6);border:none;font-weight:700;color:#000}
.controls button:hover{opacity:.85}
.loading{text-align:center;padding:40px;color:var(--dim)}
.grid{max-width:900px;margin:0 auto}
.day-card{background:var(--card);border-radius:12px;padding:16px 20px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06);display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.day-left{text-align:center}
.day-name{font-size:.78em;color:var(--dim);text-transform:uppercase}
.day-date{font-size:1.2em;font-weight:700}
.day-label{font-size:.72em;color:var(--dim)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
.badge-open{background:rgba(0,214,143,.15);color:var(--green)}
.badge-available{background:rgba(77,232,255,.12);color:var(--accent)}
.badge-limited{background:rgba(255,170,0,.15);color:var(--yellow)}
.badge-full{background:rgba(233,69,96,.15);color:var(--red)}
.windows{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.window-block{background:rgba(0,214,143,.08);border:1px solid rgba(0,214,143,.2);border-radius:8px;padding:5px 10px;font-size:.82em;white-space:nowrap;cursor:pointer;transition:all .15s}
.window-block:hover{background:rgba(0,214,143,.18);border-color:rgba(0,214,143,.4);transform:translateY(-1px)}
.full-day{background:rgba(77,232,255,.08);border:1px solid rgba(77,232,255,.2);border-radius:8px;padding:5px 12px;font-size:.85em;cursor:pointer}
.full-day:hover{background:rgba(77,232,255,.15)}
.full-day .time{font-weight:700;color:var(--accent)}
.no-windows{color:var(--dim);font-size:.82em}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;color-scheme:dark}
.modal{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;max-width:400px;width:100%}
.modal h2{color:var(--accent);margin-bottom:12px;font-size:1.1em}
.modal .info{color:var(--dim);font-size:.85em;margin-bottom:20px;line-height:1.8;background:rgba(255,255,255,.03);padding:14px;border-radius:10px}
.modal .info b{color:var(--text)}
.modal .actions{display:flex;gap:10px}
.modal .actions button,.modal .actions a{padding:12px 20px;border-radius:10px;border:none;font-size:.9em;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;flex:1}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0077b6);color:#000}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)!important}

.notes{max-width:900px;margin:24px auto 0;padding:16px 20px;background:var(--card);border-radius:12px;border:1px solid rgba(255,255,255,.06);font-size:.78em;color:var(--dim)}
.notes h3{color:var(--accent);font-size:.95em;margin-bottom:8px}
.notes ol{padding-left:20px;line-height:1.8}
.last-updated{text-align:center;color:var(--dim);font-size:.72em;margin-top:12px}
.footer{text-align:center;color:var(--dim);font-size:.72em;margin-top:20px}
.footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<h1>🅿️ 香園圍邊境停車場</h1>
<p class="subtitle">Heung Yuen Wai Border Parking · 可預約時段 (06:00 – 22:00)</p>

<div class="controls">
  <select id="carType" onchange="refresh()">
    <option value="private">私家車</option>
    <option value="goods">客貨車 (二號停車場)</option>
    <option value="motorcycle">電單車</option>
    <option value="disabled_blue">傷殘人士 (藍證)</option>
    <option value="disabled_grey">接載殘疾人士 (灰證)</option>
  </select>
  <input type="date" id="dateFrom" onchange="refresh()">
  <span style="color:var(--dim)">至</span>
  <input type="date" id="dateTo" onchange="refresh()">
  <button onclick="refresh()">🔄 查詢</button>
</div>

<div id="loading" class="loading">載入中...</div>
<div id="grid" class="grid" style="display:none"></div>
<div id="updated" class="last-updated" style="display:none"></div>

<div class="notes">
  <h3>📋 預約須知</h3>
  <ol>
    <li>泊車收費以每一小時計算，不足一小時亦作一小時收費</li>
    <li>可於入場前 <b>30分鐘至7天</b> 預約車位 · 最短<b>2小時</b></li>
    <li>私家車/電單車最長<b>7天</b> · 客貨車最長<b>3天</b></li>
    <li>更改或取消：入場前2小時 · 行政費 HK$100</li>
  </ol>
</div>
<div class="footer">Parklan Clawhub · <a href="/">← Back</a></div>

<script>
const STATUS_MAP={open:{cls:'badge-open',label:'全日可訂'},available:{cls:'badge-available',label:'大部份可訂'},limited:{cls:'badge-limited',label:'少量時段'},full:{cls:'badge-full',label:'已滿'},error:{cls:'badge-error',label:'無法載入'}};

const CAR_TYPE_NAMES={private:'私家車',goods:'客貨車',motorcycle:'電單車',disabled_blue:'傷殘人士(藍證)',disabled_grey:'接載殘疾人士(灰證)'};
const CAR_TYPE_RADIOS={private:'bookRadio00',goods:'bookRadio10',motorcycle:'bookRadio02',disabled_blue:'bookRadio03',disabled_grey:'bookRadio01'};

function initDates(){
  const hkt=new Date(Date.now()+8*3600000);
  document.getElementById('dateFrom').value=hkt.toISOString().split('T')[0];
  document.getElementById('dateTo').value=new Date(hkt.getTime()+6*86400000).toISOString().split('T')[0];
}
initDates();

async function refresh(){
  document.getElementById('loading').style.display='block';
  document.getElementById('grid').style.display='none';
  document.getElementById('updated').style.display='none';
  const carType=document.getElementById('carType').value;
  const from=document.getElementById('dateFrom').value;
  const to=document.getElementById('dateTo').value;
  const resp=await fetch(`/parking/api/availability?type=${carType}&from=${from}&to=${to}`);
  const data=await resp.json();
  document.getElementById('loading').style.display='none';
  document.getElementById('grid').style.display='block';
  if(!data.ok){document.getElementById('grid').innerHTML=`<p class="loading">❌ ${data.error}</p>`;return}
  renderGrid(data);
}

function renderGrid(data){
  const grid=document.getElementById('grid');
  const todayStr=new Date(Date.now()+8*3600000).toISOString().split('T')[0];
  window._carType=data.car_type_key;
  window._vehicleName=data.vehicle;
  grid.innerHTML=data.days.map(day=>{
    const isToday=day.date.includes(todayStr.replace(/-/g,'/'));
    const st=STATUS_MAP[day.status]||STATUS_MAP.error;
    const ws=day.windows||[];
    let wh='';
    if(day.status==='error') wh=`<div class="no-windows">⚠️ ${day.error||'無法載入'}</div>`;
    else if(ws.length===0) wh='<div class="no-windows">❌ 無可預約時段</div>';
    else if(day.full_day_available) wh=`<div class="full-day" onclick="openDialog('${day.date}','06:00','22:00',${day.quota})"><span class="time">06:00 – 22:00 全線開放</span> <span class="spaces">${day.quota} 個車位</span></div>`;
    else wh='<div class="windows">'+ws.map(w=>`<div class="window-block" onclick="openDialog('${day.date}','${w.start}','${w.end}',${w.spaces})"><span class="time">${w.start} – ${w.end}</span> <span class="spaces">· ${w.spaces} 位</span></div>`).join('')+'</div>';
    return `<div class="day-card" style="${isToday?'border-color:rgba(77,232,255,.25)':''}"><div class="day-left"><div class="day-name">${day.day_name}${isToday?' ⬅':''}</div><div class="day-date">${day.day_label}</div></div><div class="day-right"><span class="badge ${st.cls}">${st.label}</span>${wh}</div></div>`;
  }).join('');
  document.getElementById('updated').style.display='block';
  document.getElementById('updated').textContent=`最後更新: ${new Date(Date.now()+8*3600000).toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong'})} HKT`;
}

function openDialog(date,winStart,winEnd,spaces){
  const ct=window._carType||'private';
  const ctn=CAR_TYPE_NAMES[ct]||'私家車';
  const radio=CAR_TYPE_RADIOS[ct]||'bookRadio00';
  const parts=date.split('/');
  const displayDate=`${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`;
  const[sh,sm]=winStart.split(':').map(Number);
  const[eh,em]=winEnd.split(':').map(Number);
  const hours=eh+em/60-(sh+sm/60);

  const ov=document.createElement('div');
  ov.id='booking-dialog';
  ov.className='modal-overlay';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`
    <div class="modal">
      <h2>📋 預約詳情</h2>
      <div class="info">
        <b>車輛類別：</b>${ctn}<br>
        <b>日期：</b>${displayDate}<br>
        <b>時段：</b>${winStart} – ${winEnd} (${hours.toFixed(1)}小時)<br>
        <b>剩餘車位：</b>至少 ${spaces} 個
      </div>
      <p style="color:var(--yellow);font-size:.78em;margin-bottom:16px">點擊下方按鈕前往官方網站，請自行選擇 <b>${ctn}</b> 及時段 <b>${winStart}–${winEnd}</b></p>
      <div class="actions">
        <a class="btn-primary" href="/parking/book?type=${ct}&date=${date}&start=${winStart}&end=${winEnd}" target="_blank">🔗 前往官方預約</a>
        <button class="btn-secondary" onclick="document.getElementById('booking-dialog').remove()">關閉</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
}

document.addEventListener('DOMContentLoaded',refresh);
</script>
</body>
</html>
