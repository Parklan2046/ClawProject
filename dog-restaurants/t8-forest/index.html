<style>
:root{--bg:#EFF3E6;--bg-2:#F5F7F0;--bg-deep:#E5ECD9;--primary:#4A7C59;--primary-deep:#356044;--primary-soft:#7BA98A;--primary-tint:#E2EEE2;--wood:#A0826D;--wood-deep:#85695A;--leaf:#B5C97A;--leaf-deep:#9CB25E;--amber:#E8B86D;--amber-deep:#D49C4E;--cream:#FBF8F0;--berry:#D87B7B;--text:#33382B;--text-muted:#5F6650;--text-faint:#8E9481;--border:#D6E0CB;--border-strong:#BFCFB1;--shadow-xs:0 1px 2px rgba(74,124,89,.06);--shadow-sm:0 2px 8px rgba(74,124,89,.08);--shadow-md:0 4px 16px rgba(74,124,89,.10);--shadow-lg:0 10px 30px rgba(74,124,89,.16);--shadow-leaf:0 6px 20px rgba(74,124,89,.20);--focus-ring:0 0 0 3px rgba(74,124,89,.30);--r-sm:10px;--r-md:16px;--r-lg:20px;--r-xl:26px;--r-pill:999px;--ease-bounce:cubic-bezier(.34,1.56,.64,1);--dur:220ms;--font-display:"Baloo 2","PingFang HK","Microsoft JhengHei",sans-serif;--font-body:"Nunito","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;--bg-muted:#F5F0E8;--text-faint:#999;--text-muted:#666;--radius-pill:999px;--dur-fast:.1s;--ease-soft:ease-out;--ease-bounce:cubic-bezier(0.34,1.56,0.64,1);--focus-ring:0 0 0 3px var(--blue);--primary:var(--pink);--primary-deep:var(--pink-deep);--primary-tint:#FFE0EC;--accent-coral-soft:#FFE0D6;--accent-coral-deep:#E66A1C;}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}

.card{position:relative;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:18px 18px 16px;display:flex;flex-direction:column;gap:9px;transition:transform var(--dur) var(--ease-bounce),box-shadow var(--dur),border-color var(--dur);cursor:pointer;content-visibility:auto;contain-intrinsic-size:0 200px;overflow:hidden;}

.card-licence{font-size:11.5px;color:var(--text-faint);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
const I18N={'zh-HK':{htmlLang:'zh-HK',pageTitle:'狗狗友好餐廳 HK｜香港可帶狗食肆一覽',metaDesc:'香港 946 間獲准許狗隻進入的食肆，按地區搜尋，附 Google 地圖。',brand:'狗狗友好餐廳 HK',brandSub:'香港可帶狗食肆一覽',heroEyebrow:'歡迎狗狗嘅好去處',heroTitle:'搵間歡迎狗狗嘅餐廳啦',heroLead:'全港 946 間獲准許狗隻進入嘅食肆，喺呢片森林入面慢慢搵。',searchPlaceholder:'搜尋餐廳名稱、地區或地址…',filterAll:'全港',sortLabel:'排序',sortByDistrict:'按地區',sortByName:'按名稱',resultCount:'共 {n} 間餐廳',resultCountFiltered:'篩選結果：{n} 間',cardLicence:'牌照',openInMaps:'在地圖查看',getDirections:'獲取路線',noResultsTitle:'呢片林暫時搵唔到符合嘅餐廳',noResultsBody:'試下其他關鍵字或地區啦',noResultsReset:'清除所有篩選',showMore:'顯示更多',mapTitleDefault:'餐廳位置',selectToView:'點選一間餐廳喺地圖查看',tabList:'餐廳列表',tabMap:'地圖',footerNote:'資料來源：食物環境衞生署 — 獲准許狗隻進入的食肆名單',footerDisclaimer:'餐廳允許狗隻的安排或會變更，建議前往前先致電確認。',surpriseMe:'驚喜隨機',nearMe:'附近',sortByDistance:'按距離',copyAddress:'複製地址',copied:'已複製！',saved:'已收藏',removed:'已取消收藏',share:'分享',filterSaved:'已收藏'},en:{htmlLang:'en',pageTitle:'Dog-Friendly Restaurants HK | 946 Spots',metaDesc:'946 licensed dog-friendly restaurants across Hong Kong.',brand:'Dog Eats HK',brandSub:'Hong Kong dog-friendly restaurants',heroEyebrow:'Pup-welcome spots',heroTitle:'Find a pup-friendly table',heroLead:'946 licensed dog-friendly eateries across HK, hidden in this little forest.',searchPlaceholder:'Search name, district or address…',filterAll:'All HK',sortLabel:'Sort',sortByDistrict:'By district',sortByName:'By name',resultCount:'{n} restaurants',resultCountFiltered:'Showing {n} of {total}',cardLicence:'Licence',copyAddress:'Copy address',copied:'Copied!',surpriseMe:'Surprise me',saved:'Saved',removed:'Removed',share:'Share',nearMe:'Near me',sortByDistance:'By distance',filterSaved:'Saved',openInMaps:'View on map',getDirections:'Get directions',noResultsTitle:'No treats in this part of the woods yet',noResultsBody:'Try a different name or district',noResultsReset:'Clear all filters',showMore:'Show more',mapTitleDefault:'Location',selectToView:'Select a restaurant to view on map',tabList:'List',tabMap:'Map',footerNote:'Source: FEHD — List of food premises permitted to admit dogs',footerDisclaimer:'Dog-admission policies may change; please call ahead to confirm.'}};
const DISTRICT_ZH_TO_EN={'中西區':'Central & Western','南區':'Southern','東區':'Eastern','元朗區':'Yuen Long','沙田區':'Sha Tin','觀塘區':'Kwun Tong','黃大仙區':'Wong Tai Sin','油尖區':'Yau Tsim','旺角區':'Mong Kok','離島區':'Islands','九龍城區':'Kowloon City','葵青區':'Kwai Tsing','灣仔區':'Wan Chai','深水埗區':'Sham Shui Po','西貢區':'Sai Kung','大埔區':'Tai Po','荃灣區':'Tsuen Wan','屯門區':'Tuen Mun','北區':'North'};
let currentLocale=localStorage.getItem('dog-locale')||'zh-HK';
function t(key,vars){let s=(I18N[currentLocale]&&I18N[currentLocale][key])||I18N['zh-HK'][key]||key;if(vars)for(const[k,v]of Object.entries(vars))s=s.replaceAll('{'+k+'}',v);return s;}
function getLocale(){return currentLocale;}
function setLocale(loc){currentLocale=(loc==='en')?'en':'zh-HK';localStorage.setItem('dog-locale',currentLocale);applyLocale();}
function districtName(zh){return(getLocale()==='en')?(DISTRICT_ZH_TO_EN[zh]||zh):zh;}
function districtColorClass(d){return'dc-'+(DOG_DATA.d.indexOf(d)%6);}
function applyLocale(){document.documentElement.lang=t('htmlLang');document.title=t('pageTitle');document.querySelector('meta[name="description"]').setAttribute('content',t('metaDesc'));document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));document.getElementById('langZh').classList.toggle('active',currentLocale==='zh-HK');document.getElementById('langEn').classList.toggle('active',currentLocale==='en');renderChips();renderCards();if(selectedIdx>=0)updateMapInfo(selectedIdx);}
const LOWER=s=>(s||'').toLowerCase();
const RESTAURANTS=DOG_DATA.r.map((row,i)=>{let en,zh,districtZh,districtEn,addressZh,addressEn,licence,lat,lng;if(row.length>=7){[en,zh,districtZh,districtEn,addressZh,addressEn,licence,lat,lng]=row;lat=lat||null;lng=lng||null;}else{[en,zh,districtZh,addressZh,licence]=row;districtEn=DISTRICT_ZH_TO_EN[districtZh]||'';addressEn='';lat=null;lng=null;}return{idx:i,en,zh,districtZh,districtEn,addressZh,addressEn,licence,lat,lng,district:districtZh,address:addressZh,haystack:`${LOWER(en)} ${LOWER(zh)} ${LOWER(districtZh)} ${LOWER(districtEn)} ${LOWER(addressZh)} ${LOWER(addressEn)} ${LOWER(licence)}`};});
const districtCounts={};RESTAURANTS.forEach(r=>districtCounts[r.district]=(districtCounts[r.district]||0)+1);
let state={q:'',district:'all',sort:'district',limit:60,filterFav:false};let selectedIdx=-1;
function computeFiltered(){const q=LOWER(state.q.trim());let out=RESTAURANTS;if(state.district!=='all')out=out.filter(r=>r.district===state.district);if(state.filterFav)out=out.filter(r=>isFav(r.idx));if(q){const terms=q.split(/\s+/).filter(Boolean);out=out.filter(r=>terms.every(t=>r.haystack.includes(t)));}if(state.sort==='distance'&&userLoc){out=[...out].sort((a,b)=>{const da=a.lat!=null?haversine(userLoc.lat,userLoc.lng,a.lat,a.lng):Infinity;const db=b.lat!=null?haversine(userLoc.lat,userLoc.lng,b.lat,b.lng):Infinity;return da-db;});}else if(state.sort==='name'){out=[...out].sort((a,b)=>(getLocale()==='en'?a.en:a.zh).localeCompare(getLocale()==='en'?b.en:b.zh,getLocale()));}else{out=[...out].sort((a,b)=>a.district===b.district?a.zh.localeCompare(b.zh,'zh-HK'):a.district.localeCompare(b.district,'zh-HK'));}return out;}
const PAW_ICO='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16" rx="5" ry="4"/><circle cx="5.5" cy="11" r="2.2"/><circle cx="12" cy="8" r="2.3"/><circle cx="18.5" cy="11" r="2.2"/></svg>';
const LEAF_CORNER='<svg class="card-leaf" viewBox="0 0 24 24" fill="#7BA98A"><path d="M12 2C18 5 21 13 12 22 3 13 6 5 12 2Z"/><path d="M12 5v15" stroke="#FBF8F0" stroke-width="1" opacity=".7"/></svg>';
function renderChips(){const rail=document.getElementById('chipsRail');const chips=[`<button class="chip ${state.district==='all'?'active':''}" onclick="setDistrict('all')">${PAW_ICO}${t('filterAll')} <span class="chip-count">${RESTAURANTS.length}</span></button>`];for(const zh of DOG_DATA.d){const count=districtCounts[zh]||0;chips.push(`<button class="chip ${state.district===zh?'active':''}" onclick="setDistrict('${zh}')">${PAW_ICO}${districtName(zh)} <span class="chip-count">${count}</span></button>`);}rail.innerHTML=chips.join('');}
function escapeHtml(s){return(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function cardHTML(r){const name=getLocale()==='en'?r.en:r.zh;const otherName=getLocale()==='en'?r.zh:r.en;const isActive=r.idx===selectedIdx;const fav=isFav(r.idx);let distHTML='';if(state.sort==='distance'&&userLoc&&r.lat!=null){const d=haversine(userLoc.lat,userLoc.lng,r.lat,r.lng);const dt=d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km';distHTML=`<span class="card-dist">📏 ${dt}</span>`;}return `<article class="card ${isActive?'active':''}" data-idx="${r.idx}" tabindex="0" onclick="selectCard(${r.idx})">${LEAF_CORNER}<div class="card-head"><div><div class="card-name">${escapeHtml(name)}</div><div class="card-name-alt">${escapeHtml(otherName)}</div></div></div><span class="card-district ${districtColorClass(r.district)}">${escapeHtml(rDistrict(r))}</span>${distHTML}<div class="card-address">${escapeHtml(rAddress(r))}</div><div class="card-footer"><button class="card-heart ${fav?'fav-active':''}" type="button" aria-label="${t('saved')}" aria-pressed="${fav}" title="${t('saved')}" onclick="event.stopPropagation();toggleFav(${r.idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button><span class="card-licence" title="${t('cardLicence')}: ${escapeHtml(r.licence)}">${t('cardLicence')}: ${escapeHtml(r.licence)}</span><div class="card-actions"><button class="card-icon-btn" type="button" aria-label="${t('share')}" title="${t('share')}" onclick="event.stopPropagation();shareCard(${r.idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button><button class="card-icon-btn" type="button" aria-label="${t('copyAddress')}" title="${t('copyAddress')}" onclick="event.stopPropagation();copyAddress(${r.idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button><a class="card-map-btn" href="${mapExternalUrl(r)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${t('openInMaps')}</a></div></div></article>`;}
function renderCards(){const filtered=computeFiltered();const grid=document.getElementById('grid');const countEl=document.getElementById('resultCount');countEl.innerHTML=t(state.q||state.district!=='all'?'resultCountFiltered':'resultCount',{n:filtered.length,total:RESTAURANTS.length});if(filtered.length===0){grid.innerHTML=`<div class="empty-state"><h3>${t('noResultsTitle')}</h3><p>${t('noResultsBody')}</p><button onclick="clearAll()">${t('noResultsReset')}</button></div>`;return;}const visible=filtered.slice(0,state.limit);let html=visible.map(r=>cardHTML(r)).join('');if(filtered.length>state.limit){html+=`<div class="show-more-wrap"><button class="show-more" onclick="state.limit+=60;renderCards()">${t('showMore')} (${filtered.length-state.limit})</button></div>`;}grid.innerHTML=html;}
function mapEmbedUrl(idx){const r=RESTAURANTS[idx];let q;if(r.lat!=null&&r.lng!=null){q=r.lat+','+r.lng;}else{q=rAddress(r)+' '+r.zh+' Hong Kong';}return `https://www.google.com/maps?q=${encodeURIComponent(q)}&hl=${getLocale()==='en'?'en':'zh-TW'}&output=embed`;}
function mapExternalUrl(r){let q;if(r.lat!=null&&r.lng!=null){q=r.lat+','+r.lng;}else{q=rAddress(r)+' '+r.zh+' Hong Kong';}return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}&hl=${getLocale()==='en'?'en':'zh-TW'}`;}
function directionsUrl(idx){const r=RESTAURANTS[idx];let q;if(r.lat!=null&&r.lng!=null){q=r.lat+','+r.lng;}else{q=rAddress(r)+' '+r.zh+' Hong Kong';}return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}&travelmode=walking`;}
function selectCard(idx){selectedIdx=idx;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',+c.dataset.idx===idx));showMap(idx);}
function showMap(idx){const iframe=document.getElementById('mapEmbed');const placeholder=document.getElementById('mapPlaceholder');const actions=document.getElementById('mapActions');iframe.src=mapEmbedUrl(idx);iframe.hidden=false;placeholder.hidden=true;actions.hidden=false;document.getElementById('mapExternalLink').href=mapExternalUrl(RESTAURANTS[idx]);document.getElementById('directionsLink').href=directionsUrl(idx);updateMapInfo(idx);if(window.innerWidth<=1023)document.getElementById('mapPanel').classList.add('show');}
function updateMapInfo(idx){const r=RESTAURANTS[idx];const name=getLocale()==='en'?r.en:r.zh;document.getElementById('mapTitle').textContent=name;document.getElementById('mapSub').textContent=rDistrict(r)+' · '+rAddress(r).substring(0,40);}
function closeMap(){document.getElementById('mapPanel').classList.remove('show');}
function setDistrict(d){state.district=d;state.limit=60;renderChips();renderCards();}
function clearSearch(){state.q='';document.getElementById('search').value='';document.getElementById('searchClear').hidden=true;state.limit=60;renderCards();}
function clearAll(){state.q='';state.district='all';state.limit=60;document.getElementById('search').value='';document.getElementById('searchClear').hidden=true;renderChips();renderCards();}
function switchTab(tab){const main=document.getElementById('main');document.getElementById('tabList').classList.toggle('active',tab==='list');document.getElementById('tabMap').classList.toggle('active',tab==='map');main.classList.remove('list-only','map-only');main.classList.add(tab==='list'?'list-only':'map-only');if(tab==='map'&&selectedIdx>=0)showMap(selectedIdx);}
const debounce=(fn,ms)=>{let timer;return(...a)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...a),ms);};};
document.getElementById('search').addEventListener('input',debounce(e=>{state.q=e.target.value;document.getElementById('searchClear').hidden=!state.q;state.limit=60;renderCards();},150));
document.getElementById('grid').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))selectCard(+e.target.dataset.idx);});
let toastTimer;function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}el.textContent=msg;el.className='toast show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='toast';},2000);}
function surpriseMe(){const pool=computeFiltered().length?computeFiltered():RESTAURANTS;const r=pool[Math.floor(Math.random()*pool.length)];state.limit=Math.max(state.limit,r.idx+1);renderCards();selectCard(r.idx);toast(t('surpriseMe')+' 🎲');}
async function shareCard(idx){const r=RESTAURANTS[idx];const name=getLocale()==='en'?r.en:r.zh;const url=location.origin+location.pathname+'?r='+r.idx;if(navigator.share){try{await navigator.share({title:name,text:rDistrict(r)+' · '+rAddress(r),url});}catch(e){}}else{try{await navigator.clipboard.writeText(url);toast(t('share')+' ✅');}catch(e){}}}
const FAV_KEY='dog-favs';
function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY))||[];}catch(e){return[];}}
function isFav(idx){return getFavs().includes(idx);}
function toggleFav(idx){let favs=getFavs();const wasFav=favs.includes(idx);if(wasFav){favs=favs.filter(f=>f!==idx);toast(t('removed'));}else{favs.push(idx);toast(t('saved'));}localStorage.setItem(FAV_KEY,JSON.stringify(favs));renderChips();if(state.filterFav){renderCards();}else{document.querySelectorAll('.card[data-idx="'+idx+'"] .card-heart').forEach(btn=>{btn.classList.toggle('fav-active',!wasFav);btn.setAttribute('aria-pressed',!wasFav);});}}
function copyAddress(idx){const r=RESTAURANTS[idx];if(navigator.clipboard){navigator.clipboard.writeText(rAddress(r)).then(()=>toast(t('copied'))).catch(()=>{});}else{const ta=document.createElement('textarea');ta.value=rAddress(r);document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'));}catch(e){}document.body.removeChild(ta);}}
function rDistrict(r){return getLocale()==='en'?(r.districtEn||DISTRICT_ZH_TO_EN[r.districtZh]||r.districtZh||r.district||''):(r.districtZh||r.district||'');}
function rAddress(r){return getLocale()==='en'?(r.addressEn||r.addressZh||r.address||''):(r.addressZh||r.address||'');}
function haversine(lat1,lng1,lat2,lng2){const R=6371,toRad=d=>d*Math.PI/180;const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
let userLoc=null;
function nearMe(){if(!navigator.geolocation){toast(t('nearMe')+' ❌');return;}toast(t('nearMe')+' …');navigator.geolocation.getCurrentPosition(pos=>{userLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};state.sort='distance';document.getElementById('sortSelect').value='distance';state.limit=60;renderCards();},()=>{toast(t('nearMe')+' ❌');});}

function checkUrlParams(){const params=new URLSearchParams(location.search);const d=params.get('district');const q=params.get('q');if(d&&DOG_DATA.d.includes(d))state.district=d;if(q){state.q=q;document.getElementById('search').value=q;document.getElementById('searchClear').hidden=false;}const lang=params.get('lang');if(lang==='en'||lang==='zh-HK')currentLocale=lang;const rIdx=params.get('r');if(rIdx!==null){const ri=parseInt(rIdx);if(ri>=0&&ri<RESTAURANTS.length)selectedIdx=ri;}}
/* dog SVGs */

function svgCorgi(){return `<svg viewBox="0 0 190 130"><g class="wagtail"><path d="M30 56Q8 50 12 30" stroke="#E8B86D" stroke-width="11" fill="none" stroke-linecap="round"/></g><ellipse cx="95" cy="74" rx="58" ry="27" fill="#E8B86D"/><path d="M46 64Q95 44 150 66L146 78Q95 60 50 80Z" fill="#A9845F"/><circle cx="152" cy="54" r="24" fill="#E8B86D"/><ellipse cx="170" cy="62" rx="13" ry="10" fill="#FBF3E2"/><circle cx="155" cy="52" r="3" fill="#33382B"/></svg>`;}
function svgSleeping(){return `<svg viewBox="0 0 170 120"><path d="M85 96C30 96 18 70 24 52C30 36 60 30 90 34C130 38 150 56 146 78C142 94 120 96 85 96Z" fill="#A9845F"/><circle cx="44" cy="62" r="18" fill="#E8B86D"/><ellipse cx="34" cy="64" rx="3" ry="2.2" fill="#33382B"/><text x="116" y="34" font-size="20" fill="#4A7C59" font-weight="700">z</text><text x="128" y="24" font-size="14" fill="#7BA98A" font-weight="700">z</text></svg>`;}
function svgSittingSide(){return `<svg viewBox="0 0 170 150"><ellipse cx="58" cy="112" rx="22" ry="24" fill="#7BA98A"/><ellipse cx="85" cy="100" rx="34" ry="34" fill="#5B8E6C"/><circle cx="120" cy="62" r="26" fill="#5B8E6C"/><ellipse cx="138" cy="72" rx="12" ry="9" fill="#E2EEE2"/><circle cx="124" cy="60" r="3.4" fill="#26321F"/></svg>`;}
function svgPup(){return `<svg viewBox="0 0 150 140"><ellipse cx="75" cy="92" rx="34" ry="30" fill="#E8B86D"/><circle cx="75" cy="52" r="26" fill="#E8B86D"/><ellipse cx="75" cy="62" rx="15" ry="13" fill="#FBF3E2"/><circle cx="66" cy="54" r="3.4" fill="#33382B"/><circle cx="84" cy="54" r="3.4" fill="#33382B"/></svg>`;}
function svgJumping(){return `<svg viewBox="0 0 160 150"><path d="M110 70Q146 56 150 30" stroke="#B5C97A" stroke-width="9" fill="none" stroke-linecap="round"/><ellipse cx="78" cy="78" rx="44" ry="26" fill="#B5C97A"/><circle cx="118" cy="56" r="22" fill="#B5C97A"/><ellipse cx="134" cy="63" rx="11" ry="8" fill="#E2EEE2"/><circle cx="121" cy="54" r="3" fill="#26321F"/></svg>`;}
const BG_DOGS=[{f:svgShiba,left:'2%',top:'18%',w:185,start:0.00,end:0.34,base:.08,cls:'breathe'},{f:svgCorgi,left:'70%',top:'14%',w:200,start:0.18,end:0.52,base:.07,cls:'wag'},{f:svgSleeping,left:'82%',top:'44%',w:175,start:0.40,end:0.74,base:.07,cls:'breathe'},{f:svgSittingSide,left:'4%',top:'52%',w:180,start:0.55,end:0.86,base:.08,cls:'breathe'},{f:svgPup,left:'40%',top:'30%',w:150,start:0.10,end:0.46,base:.06,cls:'breathe'},{f:svgJumping,left:'30%',top:'66%',w:170,start:0.66,end:0.98,base:.07,cls:'breathe'}];
function buildBgDogs(){const wrap=document.getElementById('bgDogs');wrap.innerHTML=BG_DOGS.map(d=>`<div class="bg-dog ${d.cls}" style="left:${d.left};top:${d.top};width:${d.w}px;--base:${d.base};" data-start="${d.start}" data-end="${d.end}">${d.f()}</div>`).join('');}
const LEAF_SHAPES=['<path d="M12 2C18 5 21 13 12 22 3 13 6 5 12 2Z" fill="#9CB25E"/><path d="M12 5v15" stroke="#FBF8F0" stroke-width="1" opacity=".5"/>','<path d="M12 2C18 5 21 13 12 22 3 13 6 5 12 2Z" fill="#D49C4E"/>','<path d="M12 2C18 5 21 13 12 22 3 13 6 5 12 2Z" fill="#E8B86D"/>','<path d="M12 2C18 5 21 13 12 22 3 13 6 5 12 2Z" fill="#7BA98A"/>'];
function buildLeaves(n){const wrap=document.getElementById('leaves');let html='';for(let i=0;i<n;i++){const left=Math.random()*100;const size=14+Math.random()*16;const dur=11+Math.random()*10;const delay=-Math.random()*dur;const shape=LEAF_SHAPES[i%LEAF_SHAPES.length];html+=`<div class="leaf" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"><svg viewBox="0 0 24 24">${shape}</svg></div>`;}wrap.innerHTML=html;}
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;const totopBtn=document.getElementById('totop');let ticking=false;
function onScroll(){const maxScroll=(document.documentElement.scrollHeight-window.innerHeight)||1;const frac=Math.min(1,Math.max(0,window.scrollY/maxScroll));if(!reduceMotion){document.querySelectorAll('.bg-dog').forEach(d=>{const s=parseFloat(d.dataset.start),e=parseFloat(d.dataset.end);const mid=(s+e)/2,half=Math.max(0.0001,(e-s)/2);let op=1-Math.abs(frac-mid)/half;d.style.setProperty('--vis',Math.max(0,Math.min(1,op)).toFixed(3));});}totopBtn.classList.toggle('show',window.scrollY>520);ticking=false;}
window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(onScroll);ticking=true;}},{passive:true});
window.addEventListener('DOMContentLoaded',()=>{buildBgDogs();buildLeaves(reduceMotion?0:14);checkUrlParams();applyLocale();if(selectedIdx>=0)showMap(selectedIdx);onScroll();window.addEventListener('resize',onScroll,{passive:true});});
</script>
</body></html>
