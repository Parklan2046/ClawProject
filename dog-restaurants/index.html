<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title data-i18n="pageTitle">狗狗友好餐廳 HK</title>
<meta name="description" data-i18n="metaDesc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   🐾 DOG-FRIENDLY RESTAURANTS HK · CUTE FLOWERY DESIGN
   ═══════════════════════════════════════════════════════════ */
:root {
  --primary: #7BA888;
  --primary-deep: #5B8E6C;
  --primary-soft: #B8D4C0;
  --primary-tint: #E8F1EA;
  --accent-coral: #F4A6A0;
  --accent-coral-deep: #E8807A;
  --accent-coral-soft: #FBD9D5;
  --accent-rose: #E8B4BC;
  --accent-rose-soft: #F7E2E5;
  --accent-lav: #B8A9D9;
  --accent-lav-soft: #EDE7F6;
  --accent-honey: #F2C879;
  --accent-honey-soft: #FBEAC9;
  --bg: #FBF7F1;
  --bg-card: #FFFFFF;
  --bg-elevated: #FFFDFA;
  --bg-muted: #F4EFE6;
  --text: #4A443C;
  --text-muted: #8A8276;
  --text-faint: #B5AE9F;
  --border: #EAE2D4;
  --border-strong: #D9CFBC;
  --map-bg: #F0EBE0;
  --shadow-xs: 0 1px 2px rgba(74,68,60,0.05);
  --shadow-sm: 0 2px 8px rgba(74,68,60,0.06);
  --shadow-md: 0 4px 16px rgba(74,68,60,0.08);
  --shadow-lg: 0 8px 28px rgba(74,68,60,0.12);
  --shadow-coral: 0 6px 20px rgba(232,128,122,0.28);
  --shadow-sage: 0 6px 20px rgba(91,142,108,0.25);
  --focus-ring: 0 0 0 3px rgba(123,168,136,0.40);
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --radius-pill: 999px;
  --ease-bounce: cubic-bezier(0.34,1.56,0.64,1);
  --ease-soft: cubic-bezier(0.22,1,0.36,1);
  --dur-fast: 150ms;
  --dur: 220ms;
  --font-display: "Quicksand","PingFang HK","Microsoft JhengHei",sans-serif;
  --font-body: "Nunito","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  font-family:var(--font-body);
  color:var(--text);
  background:var(--bg);
  background-image:url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%237BA888' fill-opacity='0.05'%3E%3Cellipse cx='30' cy='40' rx='9' ry='7'/%3E%3Cellipse cx='18' cy='28' rx='3.5' ry='4.5'/%3E%3Cellipse cx='30' cy='24' rx='3.5' ry='4.8'/%3E%3Cellipse cx='42' cy='28' rx='3.5' ry='4.5'/%3E%3Cellipse cx='48' cy='38' rx='3' ry='4'/%3E%3C/g%3E%3C/svg%3E");
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}

/* ── HEADER ── */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,0.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:var(--shadow-xs);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1400px;margin:0 auto;
  display:flex;align-items:center;gap:16px;
  padding:12px 24px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand-mark{width:40px;height:40px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-name{
  font-family:var(--font-display);font-weight:700;font-size:18px;
  color:var(--primary-deep);
}
.brand-sub{font-size:11px;color:var(--text-muted);font-weight:600}

.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}

/* ── i18n TOGGLE ── */
.lang-toggle{
  display:flex;background:var(--bg-muted);
  border-radius:var(--radius-pill);padding:3px;
  border:1px solid var(--border);
}
.lang-toggle button{
  border:none;background:transparent;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:13px;
  padding:6px 14px;border-radius:var(--radius-pill);
  color:var(--text-muted);transition:all var(--dur) var(--ease-bounce);
}
.lang-toggle button.active{
  background:var(--bg-card);color:var(--primary-deep);
  box-shadow:var(--shadow-xs);
}

/* ── HERO ── */
.hero{
  max-width:1400px;margin:0 auto;
  padding:36px 24px 20px;
  position:relative;overflow:hidden;
}
.hero-blob{position:absolute;border-radius:50%;filter:blur(2px);z-index:0;pointer-events:none}
.hero-blob-1{width:220px;height:220px;top:-40px;right:-60px;background:var(--accent-rose);opacity:.25;animation:drift1 22s ease-in-out infinite alternate}
.hero-blob-2{width:180px;height:180px;bottom:-30px;left:-40px;background:var(--accent-lav);opacity:.2;animation:drift2 18s ease-in-out infinite alternate}
.hero-blob-3{width:140px;height:140px;top:60px;left:55%;background:var(--primary-soft);opacity:.2;animation:drift1 26s ease-in-out infinite alternate-reverse}
@keyframes drift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-20px) scale(1.1)}}
@keyframes drift2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-20px,15px) scale(1.08)}}

.hero-content{position:relative;z-index:1;text-align:center}
.hero h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(28px,5vw,42px);line-height:1.15;
  color:var(--text);margin-bottom:8px;
}
.hero h1 .paw{display:inline-block;animation:wag 2s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.hero p.lead{
  font-size:16px;color:var(--text-muted);font-weight:600;
  max-width:520px;margin:0 auto 24px;line-height:1.5;
}

/* ── SEARCH BAR ── */
.search-wrap{max-width:560px;margin:0 auto}
.search-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--bg-card);
  border:2px solid var(--border);
  border-radius:var(--radius-pill);
  padding:8px 8px 8px 20px;
  box-shadow:var(--shadow-sm);
  transition:border-color var(--dur),box-shadow var(--dur),transform var(--dur);
}
.search-bar:focus-within{
  border-color:var(--primary);
  box-shadow:var(--focus-ring),var(--shadow-sm);
  transform:translateY(-1px);
}
.search-bar svg{flex-shrink:0;color:var(--primary-deep)}
.search-bar input{
  font:600 16px/1.5 var(--font-body);
  color:var(--text);border:none;background:transparent;
  flex:1;outline:none;min-width:0;
}
.search-bar input::placeholder{color:var(--text-faint)}
.search-clear{
  border:none;background:var(--bg-muted);cursor:pointer;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);transition:all var(--dur-fast);
  flex-shrink:0;
}
.search-clear:hover{background:var(--accent-coral-soft);color:var(--accent-coral-deep)}

/* ── FILTER CHIPS ── */
.filter-section{
  max-width:1400px;margin:0 auto;
  padding:0 24px 16px;
}
.chips-rail{
  display:flex;gap:8px;overflow-x:auto;
  padding:4px 0 8px;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.chips-rail::-webkit-scrollbar{height:4px}
.chips-rail::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px}
.chip{
  border-radius:var(--radius-pill);
  padding:7px 16px;
  font:700 13px/1 var(--font-body);
  background:var(--bg-card);color:var(--text-muted);
  border:1.5px solid var(--border);
  cursor:pointer;white-space:nowrap;
  transition:all .18s var(--ease-bounce);
  flex-shrink:0;display:inline-flex;align-items:center;gap:4px;
}
.chip:hover{transform:translateY(-2px);border-color:var(--primary-soft)}
.chip.active{
  background:var(--primary);color:#fff;border-color:var(--primary-deep);
  box-shadow:var(--shadow-sage);
}
.chip .chip-count{font-size:11px;opacity:.7;font-weight:600}

/* ── TOOLBAR ── */
.toolbar{
  max-width:1400px;margin:0 auto;
  padding:0 24px 12px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
}
.result-count{font-size:14px;font-weight:700;color:var(--text)}
.result-count .emoji{margin-right:4px}
.sort-wrap{display:flex;align-items:center;gap:8px}
.sort-wrap label{font-size:13px;font-weight:600;color:var(--text-muted)}
.sort-select{
  font:700 13px var(--font-body);color:var(--primary-deep);
  background:var(--bg-card);border:1.5px solid var(--primary-soft);
  border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;
}

/* ── MOBILE TAB TOGGLE ── */
.mobile-toggle{
  display:none;
  max-width:1400px;margin:0 auto;
  padding:0 24px 12px;
}
.mobile-toggle button{
  flex:1;padding:10px;border:none;cursor:pointer;
  font:700 14px var(--font-body);
  background:var(--bg-card);color:var(--text-muted);
  border:1.5px solid var(--border);transition:all var(--dur);
}
.mobile-toggle button:first-child{border-radius:var(--radius-md) 0 0 var(--radius-md)}
.mobile-toggle button:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0}
.mobile-toggle button.active{background:var(--primary);color:#fff;border-color:var(--primary-deep)}

/* ── MAIN LAYOUT ── */
.main{
  max-width:1400px;margin:0 auto;
  padding:0 24px 48px;
  display:grid;
  grid-template-columns:1fr 420px;
  gap:20px;
  align-items:start;
}

/* ── CARD GRID ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}
.card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);
  padding:20px;
  display:flex;flex-direction:column;gap:10px;
  transition:transform var(--dur) var(--ease-bounce),box-shadow var(--dur),border-color var(--dur);
  cursor:pointer;
  content-visibility:auto;
  contain-intrinsic-size:0 180px;
}
.card:hover,.card.active{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lg);
  border-color:var(--primary-soft);
}
.card.active{border-color:var(--primary);box-shadow:var(--shadow-lg),0 0 0 2px var(--primary-soft)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-name{
  font:700 17px/1.3 var(--font-body);
  color:var(--text);
}
.card-name-alt{
  font-size:13px;font-weight:600;color:var(--text-muted);
  line-height:1.3;
}
.card-district{
  display:inline-flex;align-items:center;gap:4px;
  font:700 12px/1 var(--font-body);
  padding:4px 10px;border-radius:var(--radius-pill);
  width:fit-content;
}
.card-address{
  font-size:14px;font-weight:600;color:var(--text-muted);
  line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:auto;padding-top:8px;
  border-top:1px solid var(--border);
}
.card-licence{font-size:12px;color:var(--text-faint);font-weight:600}
.card-map-btn{
  font:700 12px var(--font-body);text-decoration:none;
  color:var(--primary-deep);
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:var(--radius-sm);
  transition:all var(--dur-fast);
}
.card-map-btn:hover{background:var(--primary-tint)}

/* district chip colors */
.dc-0{background:var(--accent-rose-soft);color:var(--accent-coral-deep)}
.dc-1{background:var(--accent-lav-soft);color:#7E6BB0}
.dc-2{background:var(--accent-coral-soft);color:var(--accent-coral-deep)}
.dc-3{background:var(--primary-tint);color:var(--primary-deep)}
.dc-4{background:var(--accent-honey-soft);color:#B5851F}
.dc-5{background:var(--bg-muted);color:var(--text-muted)}

/* ── MAP PANEL ── */
.map-panel{
  position:sticky;top:80px;
  background:var(--map-bg);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-md);
  overflow:hidden;
  min-height:480px;
  display:flex;flex-direction:column;
}
.map-header{
  padding:14px 16px;
  background:var(--bg-card);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.map-header-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.map-title{font:700 14px var(--font-body);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-sub{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-close{
  border:none;background:var(--bg-muted);cursor:pointer;
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:none;align-items:center;justify-content:center;color:var(--text-muted);
}
.map-body{flex:1;position:relative;min-height:400px}
.map-embed{
  width:100%;height:100%;border:0;position:absolute;inset:0;
  filter:saturate(.82) brightness(1.03);
}
.map-placeholder{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:40px;
  background:var(--map-bg);
}
.map-placeholder svg{width:64px;height:64px;opacity:.4}
.map-placeholder p{font-size:14px;font-weight:600;color:var(--text-muted);line-height:1.5;max-width:260px}
.map-actions{
  padding:10px 16px;
  background:var(--bg-card);
  border-top:1px solid var(--border);
  display:flex;gap:8px;
}
.map-actions a{
  flex:1;text-align:center;text-decoration:none;
  font:700 13px var(--font-body);
  padding:8px 12px;border-radius:var(--radius-sm);
  transition:all var(--dur-fast);
}
.map-actions .btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-deep));
  color:#fff;box-shadow:var(--shadow-sage);
}
.map-actions .btn-primary:hover{transform:translateY(-1px)}
.map-actions .btn-ghost{
  background:transparent;color:var(--primary-deep);
  border:1.5px solid var(--primary-soft);
}

/* ── EMPTY STATE ── */
.empty-state{
  grid-column:1/-1;
  text-align:center;padding:48px 20px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.empty-state svg{width:80px;height:80px;opacity:.5}
.empty-state h3{font:700 18px var(--font-display);color:var(--text)}
.empty-state p{font-size:15px;color:var(--text-muted);max-width:360px;line-height:1.5}
.empty-state button{
  font:700 14px var(--font-body);border:none;cursor:pointer;
  background:var(--primary);color:#fff;
  padding:10px 24px;border-radius:var(--radius-md);
  box-shadow:var(--shadow-sage);transition:transform var(--dur-fast);
}
.empty-state button:hover{transform:translateY(-2px)}

/* ── SHOW MORE ── */
.show-more-wrap{
  grid-column:1/-1;
  text-align:center;padding:16px 0;
}
.show-more{
  font:700 14px var(--font-body);border:none;cursor:pointer;
  background:var(--bg-card);color:var(--primary-deep);
  border:1.5px solid var(--primary-soft);
  padding:10px 32px;border-radius:var(--radius-pill);
  box-shadow:var(--shadow-sm);transition:all var(--dur);
}
.show-more:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}

/* ── FOOTER ── */
.footer{
  max-width:1400px;margin:0 auto;
  padding:32px 24px;
  border-top:1px solid var(--border);
  text-align:center;
}
.footer-flower{margin-bottom:12px}
.footer p{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:4px}
.footer .disclaimer{font-size:12px;color:var(--text-faint);max-width:560px;margin:8px auto 0}

/* ── RESPONSIVE ── */
@media(max-width:1023px){
  .main{grid-template-columns:1fr}
  .map-panel{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:200;
    border-radius:var(--radius-xl) var(--radius-xl) 0 0;
    max-height:70vh;box-shadow:0 -8px 32px rgba(74,68,60,0.2);
    transform:translateY(100%);transition:transform var(--dur) var(--ease-bounce);
  }
  .map-panel.show{transform:translateY(0)}
  .map-close{display:flex}
  .map-body{min-height:300px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
}
@media(max-width:767px){
  .header-inner{padding:10px 16px;gap:8px}
  .brand-sub{display:none}
  .hero{padding:24px 16px 16px}
  .filter-section,.toolbar{padding:0 16px 12px}
  .mobile-toggle{display:flex}
  .main{padding:0 16px 48px}
  .main.list-only .map-panel{display:none}
  .main.map-only .grid,.main.map-only .toolbar,.main.map-only .filter-section,.main.map-only .show-more-wrap{display:none}
  .main.map-only .map-panel{display:flex;position:relative;transform:none;max-height:none}
  .grid{grid-template-columns:1fr}
  .footer{padding:24px 16px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

</header>

<!-- ═══ HERO ═══ -->
<section class="hero">
  <div class="hero-blob hero-blob-1"></div>
  <div class="hero-blob hero-blob-2"></div>
  <div class="hero-blob hero-blob-3"></div>
  <div class="hero-content">

    <div class="search-wrap">
      <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" data-i18n-ph="searchPlaceholder" placeholder="搜尋餐廳名稱、地區或地址…" autocomplete="off">
        <button class="search-clear" id="searchClear" hidden onclick="clearSearch()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>

<script src="data.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   🌸 i18n SYSTEM
   ═══════════════════════════════════════════════════════════ */
const I18N = {
  'zh-HK': {
    htmlLang:'zh-HK',

  },
  'en': {

    brand:'Dog Eats HK',
    brandSub:'Hong Kong dog-friendly restaurants',
    heroTitle:'Find a pup-friendly table',
    heroLead:'946 licensed dog-friendly eateries across HK · Search · Filter · Navigate',

    cardLicence:'Licence',copyAddress:'Copy address',copied:'Copied!',surpriseMe:'Surprise me',saved:'Saved',removed:'Removed',share:'Share',nearMe:'Near me',sortByDistance:'By distance',filterSaved:'Saved',
    openInMaps:'View on map',

    copyAddress:'Copy address',

    footerDisclaimer:'Dog-admission policies may change; please call ahead to confirm.'
  }
};

const DISTRICT_ZH_TO_EN = {
  '中西區':'Central & Western','南區':'Southern','東區':'Eastern','元朗區':'Yuen Long',
  '沙田區':'Sha Tin','觀塘區':'Kwun Tong','黃大仙區':'Wong Tai Sin','油尖區':'Yau Tsim',
  '旺角區':'Mong Kok','離島區':'Islands','九龍城區':'Kowloon City','葵青區':'Kwai Tsing',
  '灣仔區':'Wan Chai','深水埗區':'Sham Shui Po','西貢區':'Sai Kung','大埔區':'Tai Po',
  '荃灣區':'Tsuen Wan','屯門區':'Tuen Mun','北區':'North'
};

let currentLocale = localStorage.getItem('dog-locale') || 'zh-HK';

function t(key, vars) {
  let s = (I18N[currentLocale] && I18N[currentLocale][key]) || I18N['zh-HK'][key] || key;
  if (vars) for (const [k,v] of Object.entries(vars)) s = s.replaceAll('{'+k+'}', v);
  return s;
}
function getLocale() { return currentLocale; }
function setLocale(loc) {
  currentLocale = (loc === 'en') ? 'en' : 'zh-HK';
  localStorage.setItem('dog-locale', currentLocale);
  applyLocale();
}
function districtName(zh) {
  return (getLocale() === 'en') ? (DISTRICT_ZH_TO_EN[zh] || zh) : zh;
}
function districtColorClass(district) {
  const i = DOG_DATA.d.indexOf(district);
  return 'dc-' + (i % 6);
}

function applyLocale() {
  document.documentElement.lang = t('htmlLang');
  document.title = t('pageTitle');
  document.querySelector('meta[name="description"]').setAttribute('content', t('metaDesc'));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    if (el.tagName === 'OPTION') el.textContent = t(el.dataset.i18n);
    else el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.getElementById('langZh').classList.toggle('active', currentLocale === 'zh-HK');
  document.getElementById('langEn').classList.toggle('active', currentLocale === 'en');
  document.getElementById('sortSelect').querySelectorAll('option').forEach(o => o.textContent = t(o.dataset.i18n));
  renderChips();
  renderCards();
  if (selectedIdx >= 0) updateMapInfo(selectedIdx);
}

/* ═══════════════════════════════════════════════════════════
   🔍 SEARCH + FILTER LOGIC
   ═══════════════════════════════════════════════════════════ */
const LOWER = s => (s || '').toLowerCase();
const DISTRICT_EN = {};
for (const [k,v] of Object.entries(DISTRICT_ZH_TO_EN)) DISTRICT_EN[v] = k;

const RESTAURANTS=DOG_DATA.r.map((row,i)=>{let en,zh,districtZh,districtEn,addressZh,addressEn,licence,lat,lng;if(row.length>=7){[en,zh,districtZh,districtEn,addressZh,addressEn,licence,lat,lng]=row;lat=lat||null;lng=lng||null;}else{[en,zh,districtZh,addressZh,licence]=row;districtEn=DISTRICT_ZH_TO_EN[districtZh]||'';addressEn='';lat=null;lng=null;}return{idx:i,en,zh,districtZh,districtEn,addressZh,addressEn,licence,lat,lng,district:districtZh,address:addressZh,haystack:`${LOWER(en)} ${LOWER(zh)} ${LOWER(districtZh)} ${LOWER(districtEn)} ${LOWER(addressZh)} ${LOWER(addressEn)} ${LOWER(licence)}`};});

const districtCounts = {};
RESTAURANTS.forEach(r => districtCounts[r.district] = (districtCounts[r.district]||0)+1);

let state = { q:'', district:'all', sort:'district', limit:60, filterFav:false };
let selectedIdx = -1;

function computeFiltered() {
  const q = LOWER(state.q.trim());
  let out = RESTAURANTS;
  if (state.district !== 'all') out = out.filter(r => r.district === state.district);
  if (state.filterFav) out = out.filter(r => isFav(r.idx));
  if (q) {
    const terms = q.split(/\s+/).filter(Boolean);
    out = out.filter(r => terms.every(t => r.haystack.includes(t)));
  }
  if (state.sort === 'distance' && userLoc) {
    out = [...out].sort((a,b) => {
      const da = a.lat != null ? haversine(userLoc.lat, userLoc.lng, a.lat, a.lng) : Infinity;
      const db = b.lat != null ? haversine(userLoc.lat, userLoc.lng, b.lat, b.lng) : Infinity;
      return da - db;
    });
  } else if (state.sort === 'name') {
    out = [...out].sort((a,b) =>
      (getLocale()==='en'?a.en:a.zh).localeCompare(getLocale()==='en'?b.en:b.zh, getLocale()));
  } else {
    out = [...out].sort((a,b) =>
      a.district === b.district
        ? a.zh.localeCompare(b.zh,'zh-HK')
        : a.district.localeCompare(b.district,'zh-HK'));
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════
   🎨 RENDERING
   ═══════════════════════════════════════════════════════════ */
function renderChips() {
  const rail = document.getElementById('chipsRail');
  const chips = [
    `<button class="chip ${state.district==='all'?'active':''}" onclick="setDistrict('all')">${t('filterAll')} <span class="chip-count">${RESTAURANTS.length}</span></button>`
  ];
  for (const zh of DOG_DATA.d) {
    const count = districtCounts[zh] || 0;
    chips.push(
      `<button class="chip ${state.district===zh?'active':''}" onclick="setDistrict('${zh}')">${districtName(zh)} <span class="chip-count">${count}</span></button>`
    );
  }
  rail.innerHTML = chips.join('');
}

function escapeHtml(s) {
  return (s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

function cardHTML(r) {
  const name = getLocale()==='en' ? r.en : r.zh;
  const otherName = getLocale()==='en' ? r.zh : r.en;
  const isActive = r.idx === selectedIdx;
  const fav = isFav(r.idx);
  return `
  <article class="card ${isActive?'active':''}" data-idx="${r.idx}" tabindex="0" onclick="selectCard(${r.idx})">
    <div class="card-head">
      <div style="min-width:0;flex:1">
        <div class="card-name">${escapeHtml(name)}</div>
        <div class="card-name-alt">${escapeHtml(otherName)}</div>
      </div>
    </div>
    <span class="card-district ${districtColorClass(r.district)}">📍 ${escapeHtml(rDistrict(r))}</span>
    <div class="card-address">${escapeHtml(rAddress(r))}</div>
    <div class="card-footer">
      <span class="card-licence">${t('cardLicence')}: ${escapeHtml(r.licence)}</span>
      <div class="card-actions">
        <button class="card-icon-btn ${fav?'fav-active':''}" title="${t('saved')}" onclick="event.stopPropagation();toggleFav(${r.idx})">${fav?'❤️':'🤍'}</button>
        <button class="card-icon-btn" title="${t('share')}" onclick="event.stopPropagation();shareCard(${r.idx})">📤</button>
        <button class="card-icon-btn" title="${t('copyAddress')}" onclick="event.stopPropagation();copyAddress(${r.idx})">📋</button>
        <a class="card-map-btn" href="${mapExternalUrl(r)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t('openInMaps')} →</a>
      </div>
    </div>
  </article>`;
}

function renderCards() {
  const filtered = computeFiltered();
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('resultCount');

  if (state.q || state.district !== 'all') {
    countEl.innerHTML = `🐶 ${t('resultCountFiltered',{n:filtered.length,total:RESTAURANTS.length})}`;
  } else {
    countEl.innerHTML = `🐶 ${t('resultCount',{n:filtered.length})}`;
  }

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="10" r="7" fill="#F4A6A0"/><circle cx="36.5" cy="19" r="7" fill="#E8B4BC"/>
          <circle cx="31.7" cy="34" r="7" fill="#B8A9D9"/><circle cx="16.3" cy="34" r="7" fill="#7BA888"/>
          <circle cx="11.5" cy="19" r="7" fill="#F2C879"/><circle cx="24" cy="22" r="6" fill="#FBF7F1"/>
        </svg>
        <h3>${t('noResultsTitle')}</h3>
        <p>${t('noResultsBody')}</p>
        <button onclick="clearAll()">${t('noResultsReset')}</button>
      </div>`;
    return;
  }

  const visible = filtered.slice(0, state.limit);
  let html = visible.map(r => cardHTML(r)).join('');
  if (filtered.length > state.limit) {
    html += `<div class="show-more-wrap"><button class="show-more" onclick="state.limit+=60;renderCards()">${t('showMore')} (${filtered.length - state.limit})</button></div>`;
  }
  grid.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════
   🗺️ MAP INTEGRATION (Google Maps embed — no API key)
   ═══════════════════════════════════════════════════════════ */
function mapEmbedUrl(idx) {
  const r = RESTAURANTS[idx];
  const query = `${r.address} ${r.zh} Hong Kong`;
  return `https://www.google.com/maps?q=${encodeURIComponent(query)}&hl=${getLocale()==='en'?'en':'zh-TW'}&output=embed`;
}
function mapExternalUrl(r) {
  const query = `${r.address} ${r.zh} Hong Kong`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}&hl=${getLocale()==='en'?'en':'zh-TW'}`;
}
function directionsUrl(idx) {
  const r = RESTAURANTS[idx];
  const dest = encodeURIComponent(`${r.address} ${r.zh} Hong Kong`);
  return `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking`;
}

function selectCard(idx) {
  selectedIdx = idx;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', +c.dataset.idx === idx));
  showMap(idx);
}

function showMap(idx) {
  const iframe = document.getElementById('mapEmbed');
  const placeholder = document.getElementById('mapPlaceholder');
  const actions = document.getElementById('mapActions');
  iframe.src = mapEmbedUrl(idx);
  iframe.hidden = false;
  placeholder.hidden = true;
  actions.hidden = false;
  document.getElementById('mapExternalLink').href = mapExternalUrl(RESTAURANTS[idx]);
  document.getElementById('directionsLink').href = directionsUrl(idx);
  updateMapInfo(idx);
  if (window.innerWidth <= 1023) {
    document.getElementById('mapPanel').classList.add('show');
  }
}

function updateMapInfo(idx) {
  const r = RESTAURANTS[idx];
  const name = getLocale()==='en' ? r.en : r.zh;
  document.getElementById('mapTitle').textContent = name;
  document.getElementById('mapSub').textContent = districtName(r.district) + ' · ' + r.address.substring(0,40);
}

function closeMap() {
  document.getElementById('mapPanel').classList.remove('show');
}

/* ═══════════════════════════════════════════════════════════
   🎛️ EVENT HANDLERS
   ═══════════════════════════════════════════════════════════ */
function setDistrict(d) {
  state.district = d;
  state.limit = 60;
  renderChips();
  renderCards();
}
function clearSearch() {
  state.q = '';
  document.getElementById('search').value = '';
  document.getElementById('searchClear').hidden = true;
  state.limit = 60;
  renderCards();
}
function clearAll() {
  state.q = '';
  state.district = 'all';
  state.limit = 60;
  document.getElementById('search').value = '';
  document.getElementById('searchClear').hidden = true;
  renderChips();
  renderCards();
}
function switchTab(tab) {
  const main = document.getElementById('main');
  document.getElementById('tabList').classList.toggle('active', tab==='list');
  document.getElementById('tabMap').classList.toggle('active', tab==='map');
  main.classList.remove('list-only','map-only');
  main.classList.add(tab === 'list' ? 'list-only' : 'map-only');
  if (tab === 'map' && selectedIdx >= 0) {
    showMap(selectedIdx);
  }
}

// search with debounce
const debounce = (fn, ms) => { let timer; return (...a) => { clearTimeout(timer); timer = setTimeout(()=>fn(...a), ms); }; };
document.getElementById('search').addEventListener('input', debounce(e => {
  state.q = e.target.value;
  document.getElementById('searchClear').hidden = !state.q;
  state.limit = 60;
  renderCards();
}, 150));

// keyboard support on cards
document.getElementById('grid').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('card')) {
    selectCard(+e.target.dataset.idx);
  }
});

let toastTimer;function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}el.textContent=msg;el.className='toast show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='toast';},2000);}
function surpriseMe(){const pool=computeFiltered().length?computeFiltered():RESTAURANTS;const r=pool[Math.floor(Math.random()*pool.length)];state.limit=Math.max(state.limit,r.idx+1);renderCards();selectCard(r.idx);toast(t('surpriseMe')+' 🎲');}
async function shareCard(idx){const r=RESTAURANTS[idx];const name=getLocale()==='en'?r.en:r.zh;const url=location.origin+location.pathname+'?r='+r.idx;if(navigator.share){try{await navigator.share({title:name,text:rDistrict(r)+' · '+rAddress(r),url});}catch(e){}}else{try{await navigator.clipboard.writeText(url);toast(t('share')+' ✅');}catch(e){}}}
const FAV_KEY='dog-favs';
function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY))||[];}catch(e){return[];}}
function isFav(idx){return getFavs().includes(idx);}
function toggleFav(idx){let favs=getFavs();if(favs.includes(idx)){favs=favs.filter(f=>f!==idx);toast(t('removed'));}else{favs.push(idx);toast(t('saved'));}localStorage.setItem(FAV_KEY,JSON.stringify(favs));renderChips();renderCards();}
function copyAddress(idx){const r=RESTAURANTS[idx];if(navigator.clipboard){navigator.clipboard.writeText(rAddress(r)).then(()=>toast(t('copied'))).catch(()=>{});}else{const ta=document.createElement('textarea');ta.value=rAddress(r);document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'));}catch(e){}document.body.removeChild(ta);}}
function rDistrict(r){return getLocale()==='en'?(r.districtEn||DISTRICT_ZH_TO_EN[r.districtZh]||r.districtZh||r.district||''):(r.districtZh||r.district||'');}
function rAddress(r){return getLocale()==='en'?(r.addressEn||r.addressZh||r.address||''):(r.addressZh||r.address||'');}
function haversine(lat1,lng1,lat2,lng2){const R=6371,toRad=d=>d*Math.PI/180;const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
let userLoc=null;
function nearMe(){if(!navigator.geolocation){toast(t('nearMe')+' ❌');return;}toast(t('nearMe')+' …');navigator.geolocation.getCurrentPosition(pos=>{userLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};state.sort='distance';document.getElementById('sortSelect').value='distance';state.limit=60;renderCards();},()=>{toast(t('nearMe')+' ❌');});}

// check URL params for initial filter
function checkUrlParams() {
  const params = new URLSearchParams(location.search);
  const d = params.get('district');
  const q = params.get('q');
  if (d && DOG_DATA.d.includes(d)) state.district = d;
  if (q) { state.q = q; document.getElementById('search').value = q; document.getElementById('searchClear').hidden = false; }
  const lang = params.get('lang');
  if (lang === 'en' || lang === 'zh-HK') currentLocale = lang;
  const r = params.get('r');
  if (r !== null) { const idx = parseInt(r); if (idx >= 0 && idx < RESTAURANTS.length) selectedIdx = idx; }
}

/* ═══════════════════════════════════════════════════════════
   🚀 INIT
   ═══════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  checkUrlParams();
  applyLocale();
});
</script>
