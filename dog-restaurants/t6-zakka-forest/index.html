function escapeHtml(s){return(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function cardHTML(r){const name=getLocale()==='en'?r.en:r.zh;const otherName=getLocale()==='en'?r.zh:r.en;const isActive=r.idx===selectedIdx;const fav=isFav(r.idx);let distHTML='';if(state.sort==='distance'&&userLoc&&r.lat!=null){const d=haversine(userLoc.lat,userLoc.lng,r.lat,r.lng);const dt=d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km';distHTML=`<span class="card-dist">${DIST_SVG}${dt}</span>`;}const tape=TAPE_CLASSES[r.idx%4];const no=String(r.idx+1).padStart(3,'0');return `<article class="card ${isActive?'active':''}" data-idx="${r.idx}" tabindex="0" onclick="selectCard(${r.idx})"><div class="card-tape ${tape}"></div><span class="card-no">${t('cardNo')} ${no}</span><div class="card-head"><div class="card-name">${escapeHtml(name)}</div><div class="card-name-alt">${escapeHtml(otherName)}</div></div><span class="card-district ${districtColorClass(r.district)}"><span class="dot"></span>${escapeHtml(rDistrict(r))}</span>${distHTML}<div class="card-address">${escapeHtml(rAddress(r))}</div><div class="card-footer"><button class="card-heart ${fav?'fav-active':''}" type="button" aria-label="${t('saved')}" aria-pressed="${fav}" title="${t('saved')}" onclick="event.stopPropagation();toggleFav(${r.idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button><span class="card-licence" title="${t('cardLicence')}: ${escapeHtml(r.licence)}">${t('cardLicence')}: ${escapeHtml(r.licence)}</span><div class="card-actions"><button class="card-icon-btn" type="button" aria-label="${t('share')}" title="${t('share')}" onclick="event.stopPropagation();shareCard(${r.idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button><button class="card-icon-btn" type="button" aria-label="${t('copyAddress')}" title="${t('copyAddress')}" onclick="event.stopPropagation();copyAddress(${r.idx})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button><a class="card-icon-btn" href="${mapExternalUrl(r)}" target="_blank" rel="noopener" aria-label="${t('openInMaps')}" title="${t('openInMaps')}" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></a></div></div></article>`;}
function renderCards(){const filtered=computeFiltered();const grid=document.getElementById('grid');const countEl=document.getElementById('resultCount');if(state.q||state.district!=='all'||state.filterFav){countEl.innerHTML=`${PAW_SVG} ${t('resultCountFiltered',{n:filtered.length,total:RESTAURANTS.length})}`;}else{countEl.innerHTML=`${PAW_SVG} ${t('resultCount',{n:filtered.length})}`;}if(filtered.length===0){grid.innerHTML=`<div class="empty-state"><h3>${t('noResultsTitle')}</h3><p>${t('noResultsBody')}</p><button onclick="clearAll()">${t('noResultsReset')}</button></div>`;return;}const visible=filtered.slice(0,state.limit);let html=visible.map(r=>cardHTML(r)).join('');if(filtered.length>state.limit){html+=`<div class="show-more-wrap"><button class="show-more" onclick="state.limit+=60;renderCards()">${t('showMore')} (${filtered.length-state.limit})</button></div>`;}grid.innerHTML=html;}
function mapEmbedUrl(idx){const r=RESTAURANTS[idx];let q;if(r.lat!=null&&r.lng!=null){q=r.lat+','+r.lng;}else{q=rAddress(r)+' '+r.zh+' Hong Kong';}return `https://www.google.com/maps?q=${encodeURIComponent(q)}&hl=${getLocale()==='en'?'en':'zh-TW'}&output=embed`;}
function mapExternalUrl(r){let q;if(r.lat!=null&&r.lng!=null){q=r.lat+','+r.lng;}else{q=rAddress(r)+' '+r.zh+' Hong Kong';}return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}&hl=${getLocale()==='en'?'en':'zh-TW'}`;}
function directionsUrl(idx){const r=RESTAURANTS[idx];let q;if(r.lat!=null&&r.lng!=null){q=r.lat+','+r.lng;}else{q=rAddress(r)+' '+r.zh+' Hong Kong';}return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}&travelmode=walking`;}
function selectCard(idx){selectedIdx=idx;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',+c.dataset.idx===idx));showMap(idx);}
function showMap(idx){const iframe=document.getElementById('mapEmbed');const placeholder=document.getElementById('mapPlaceholder');const actions=document.getElementById('mapActions');iframe.src=mapEmbedUrl(idx);iframe.hidden=false;placeholder.hidden=true;actions.hidden=false;document.getElementById('mapExternalLink').href=mapExternalUrl(RESTAURANTS[idx]);document.getElementById('directionsLink').href=directionsUrl(idx);updateMapInfo(idx);if(window.innerWidth<=1023)document.getElementById('mapPanel').classList.add('show');}
function updateMapInfo(idx){const r=RESTAURANTS[idx];const name=getLocale()==='en'?r.en:r.zh;document.getElementById('mapTitle').textContent=name;document.getElementById('mapSub').textContent=rDistrict(r)+' · '+rAddress(r).substring(0,40);}
function closeMap(){document.getElementById('mapPanel').classList.remove('show');}
function setDistrict(d){state.district=d;state.limit=60;renderChips();renderCards();}
function toggleFilterFav(){state.filterFav=!state.filterFav;state.limit=60;renderChips();renderCards();}
function clearSearch(){state.q='';document.getElementById('search').value='';document.getElementById('searchClear').hidden=true;state.limit=60;renderCards();}
function clearAll(){state.q='';state.district='all';state.filterFav=false;state.limit=60;document.getElementById('search').value='';document.getElementById('searchClear').hidden=true;renderChips();renderCards();}
function switchTab(tab){const main=document.getElementById('main');document.getElementById('tabList').classList.toggle('active',tab==='list');document.getElementById('tabMap').classList.toggle('active',tab==='map');main.classList.remove('list-only','map-only');main.classList.add(tab==='list'?'list-only':'map-only');if(tab==='map'){if(selectedIdx<0){const first=computeFiltered()[0];if(first)selectedIdx=first.idx;}showMap(selectedIdx);}}
const debounce=(fn,ms)=>{let timer;return(...a)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...a),ms);};};
document.getElementById('search').addEventListener('input',debounce(e=>{state.q=e.target.value;document.getElementById('searchClear').hidden=!state.q;state.limit=60;renderCards();},150));
document.getElementById('grid').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))selectCard(+e.target.dataset.idx);});
let toastTimer;function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}el.textContent=msg;el.className='toast show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='toast';},2000);}
function surpriseMe(){const pool=computeFiltered().length?computeFiltered():RESTAURANTS;const r=pool[Math.floor(Math.random()*pool.length)];state.limit=Math.max(state.limit,r.idx+1);renderCards();selectCard(r.idx);toast(t('surpriseMe')+'!');}
async function shareCard(idx){const r=RESTAURANTS[idx];const name=getLocale()==='en'?r.en:r.zh;const url=location.origin+location.pathname+'?r='+r.idx;if(navigator.share){try{await navigator.share({title:name,text:rDistrict(r)+' · '+rAddress(r),url});}catch(e){}}else{try{await navigator.clipboard.writeText(url);toast(t('share')+' OK');}catch(e){}}}
const FAV_KEY='dog-favs';
function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY))||[];}catch(e){return[];}}
function isFav(idx){return getFavs().includes(idx);}
function toggleFav(idx){let favs=getFavs();const wasFav=favs.includes(idx);if(wasFav){favs=favs.filter(f=>f!==idx);toast(t('removed'));}else{favs.push(idx);toast(t('saved'));}localStorage.setItem(FAV_KEY,JSON.stringify(favs));renderChips();if(state.filterFav){renderCards();}else{document.querySelectorAll('.card[data-idx="'+idx+'"] .card-heart').forEach(btn=>{btn.classList.toggle('fav-active',!wasFav);btn.setAttribute('aria-pressed',!wasFav);});}}
function copyAddress(idx){const r=RESTAURANTS[idx];if(navigator.clipboard){navigator.clipboard.writeText(rAddress(r)).then(()=>toast(t('copied'))).catch(()=>{});}else{const ta=document.createElement('textarea');ta.value=rAddress(r);document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'));}catch(e){}document.body.removeChild(ta);}}
function rDistrict(r){return getLocale()==='en'?(r.districtEn||DISTRICT_ZH_TO_EN[r.districtZh]||r.districtZh||r.district||''):(r.districtZh||r.district||'');}
function rAddress(r){return getLocale()==='en'?(r.addressEn||r.addressZh||r.address||''):(r.addressZh||r.address||'');}
function haversine(lat1,lng1,lat2,lng2){const R=6371,toRad=d=>d*Math.PI/180;const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
let userLoc=null;
function nearMe(){if(!navigator.geolocation){toast(t('nearMe')+' X');return;}toast(t('nearMe')+' ...');navigator.geolocation.getCurrentPosition(pos=>{userLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};state.sort='distance';document.getElementById('sortSelect').value='distance';state.limit=60;renderCards();},()=>{toast(t('nearMe')+' X');});}
function checkUrlParams(){const params=new URLSearchParams(location.search);const d=params.get('district');const q=params.get('q');if(d&&DOG_DATA.d.includes(d))state.district=d;if(q){state.q=q;document.getElementById('search').value=q;document.getElementById('searchClear').hidden=false;}const lang=params.get('lang');if(lang==='en'||lang==='zh-HK')currentLocale=lang;const rIdx=params.get('r');if(rIdx!==null){const ri=parseInt(rIdx);if(ri>=0&&ri<RESTAURANTS.length)selectedIdx=ri;}}
function svgShiba(){return `<svg viewBox="0 0 150 160"><ellipse cx="75" cy="150" rx="44" ry="7" fill="#5A5145" opacity=".08"/><ellipse cx="55" cy="120" rx="20" ry="14" fill="#D4A84B"/><ellipse cx="95" cy="120" rx="20" ry="14" fill="#D4A84B"/><path d="M75 138C40 138 34 110 34 84C34 60 50 44 75 44C100 44 116 60 116 84C116 110 110 138 75 138Z" fill="#E8B86D"/><ellipse cx="75" cy="120" rx="24" ry="26" fill="#FBF3E2"/><circle cx="75" cy="72" r="32" fill="#E8B86D"/><path d="M50 44L43 18L64 38Z" fill="#D4A84B"/><path d="M100 44L107 18L86 38Z" fill="#D4A84B"/><ellipse cx="75" cy="84" rx="19" ry="17" fill="#FBF3E2"/><circle cx="64" cy="74" r="4" fill="#5A5145"/><circle cx="86" cy="74" r="4" fill="#5A5145"/><ellipse cx="75" cy="85" rx="4" ry="3" fill="#5A5145"/></svg>`;}
function svgCorgi(){return `<svg viewBox="0 0 190 130"><g class="wagtail"><path d="M30 56Q8 50 12 30" stroke="#E8B86D" stroke-width="11" fill="none" stroke-linecap="round"/></g><ellipse cx="95" cy="74" rx="58" ry="27" fill="#E8B86D"/><path d="M46 64Q95 44 150 66L146 78Q95 60 50 80Z" fill="#B7C3A4"/><circle cx="152" cy="54" r="24" fill="#E8B86D"/><ellipse cx="170" cy="62" rx="13" ry="10" fill="#FBF3E2"/><circle cx="155" cy="52" r="3" fill="#5A5145"/></svg>`;}
function svgSleeping(){return `<svg viewBox="0 0 170 120"><path d="M85 96C30 96 18 70 24 52C30 36 60 30 90 34C130 38 150 56 146 78C142 94 120 96 85 96Z" fill="#B7C3A4"/><circle cx="44" cy="62" r="18" fill="#E8B86D"/><ellipse cx="34" cy="64" rx="3" ry="2.2" fill="#5A5145"/><text x="116" y="34" font-size="20" fill="#8B9D7E" font-weight="700">z</text><text x="128" y="24" font-size="14" fill="#B7C3A4" font-weight="700">z</text></svg>`;}
function svgSittingSide(){return `<svg viewBox="0 0 170 150"><ellipse cx="58" cy="112" rx="22" ry="24" fill="#B7C3A4"/><ellipse cx="85" cy="100" rx="34" ry="34" fill="#8B9D7E"/><circle cx="120" cy="62" r="26" fill="#8B9D7E"/><ellipse cx="138" cy="72" rx="12" ry="9" fill="#E8EDDE"/><circle cx="124" cy="60" r="3.4" fill="#5A5145"/></svg>`;}
function svgPup(){return `<svg viewBox="0 0 150 140"><ellipse cx="75" cy="92" rx="34" ry="30" fill="#E8B86D"/><circle cx="75" cy="52" r="26" fill="#E8B86D"/><ellipse cx="75" cy="62" rx="15" ry="13" fill="#FBF3E2"/><circle cx="66" cy="54" r="3.4" fill="#5A5145"/><circle cx="84" cy="54" r="3.4" fill="#5A5145"/></svg>`;}
function svgJumping(){return `<svg viewBox="0 0 160 150"><path d="M110 70Q146 56 150 30" stroke="#B7C3A4" stroke-width="9" fill="none" stroke-linecap="round"/><ellipse cx="78" cy="78" rx="44" ry="26" fill="#B7C3A4"/><circle cx="118" cy="56" r="22" fill="#B7C3A4"/><ellipse cx="134" cy="63" rx="11" ry="8" fill="#E8EDDE"/><circle cx="121" cy="54" r="3" fill="#5A5145"/></svg>`;}
const BG_DOGS=[{f:svgShiba,left:'2%',top:'18%',w:185,start:0.00,end:0.34,base:.12,cls:'breathe'},{f:svgCorgi,left:'70%',top:'14%',w:200,start:0.18,end:0.52,base:.11,cls:'wag'},{f:svgSleeping,left:'82%',top:'44%',w:175,start:0.40,end:0.74,base:.10,cls:'breathe'},{f:svgSittingSide,left:'4%',top:'52%',w:180,start:0.55,end:0.86,base:.12,cls:'breathe'},{f:svgPup,left:'40%',top:'30%',w:150,start:0.10,end:0.46,base:.10,cls:'breathe'},{f:svgJumping,left:'30%',top:'66%',w:170,start:0.66,end:0.98,base:.11,cls:'breathe'}];
function buildBgDogs(){const wrap=document.getElementById('bgDogs');wrap.innerHTML=BG_DOGS.map(d=>`<div class="bg-dog ${d.cls}" style="left:${d.left};top:${d.top};width:${d.w}px;--base:${d.base};" data-start="${d.start}" data-end="${d.end}">${d.f()}</div>`).join('');}
const LEAF_SHAPES=['<path d="M12 2C18 5 21 13 12 22 3 13 6 5 12 2Z" fill="#8B9D7E"/><path d="M12 5v15" stroke="#FAF7F2" stroke-width="1" opacity=".5"/>','<path d="M12 2C18 5 21 13 12 22 3 13 6 5 12 2Z" fill="#D4A84B"/>','<path d="M12 2C18 5 21 13 12 22 3 13 6 5 12 2Z" fill="#E8B86D"/>','<path d="M12 2C18 5 21 13 12 22 3 13 6 5 12 2Z" fill="#D4847C"/>'];
function buildLeaves(n){const wrap=document.getElementById('leaves');let html='';for(let i=0;i<n;i++){const left=Math.random()*100;const size=14+Math.random()*16;const dur=11+Math.random()*10;const delay=-Math.random()*dur;const shape=LEAF_SHAPES[i%LEAF_SHAPES.length];html+=`<div class="leaf" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"><svg viewBox="0 0 24 24">${shape}</svg></div>`;}wrap.innerHTML=html;}
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;const totopBtn=document.getElementById('totop');let ticking=false;
function onScroll(){const maxScroll=(document.documentElement.scrollHeight-window.innerHeight)||1;const frac=Math.min(1,Math.max(0,window.scrollY/maxScroll));if(!reduceMotion){document.querySelectorAll('.bg-dog').forEach(d=>{const s=parseFloat(d.dataset.start),e=parseFloat(d.dataset.end);const mid=(s+e)/2,half=Math.max(0.0001,(e-s)/2);let op=1-Math.abs(frac-mid)/half;d.style.setProperty('--vis',Math.max(0,Math.min(1,op)).toFixed(3));});}totopBtn.classList.toggle('show',window.scrollY>520);ticking=false;}
window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(onScroll);ticking=true;}},{passive:true});
window.addEventListener('DOMContentLoaded',()=>{buildBgDogs();buildLeaves(reduceMotion?0:14);checkUrlParams();applyLocale();if(selectedIdx>=0)showMap(selectedIdx);onScroll();window.addEventListener('resize',onScroll,{passive:true});});
</script>
</body></html>
