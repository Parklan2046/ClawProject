<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>香園圍停車場 · Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   Parking Cockpit · taste-skill DENSITY 8
   ═══════════════════════════════════════ */
:root {
  --bg:#09090b;--card:#131316;--card-hover:#1a1a20;--card2:#1f1f26;
  --accent:#22d3ee;--accent-dim:rgba(34,211,238,.08);--accent-glow:rgba(34,211,238,.15);
  --text:#fafafa;--text-secondary:#d4d4d8;--dim:#a1a1aa;
  --green:#22c55e;--green-dim:rgba(34,197,94,.10);
  --yellow:#eab308;--yellow-dim:rgba(234,179,8,.10);
  --red:#ef4444;--red-dim:rgba(239,68,68,.07);
  --border:rgba(255,255,255,.06);--border-active:rgba(34,211,238,.2);
  --radius:8px;--radius-lg:12px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;padding:12px 12px 96px;-webkit-font-smoothing:antialiased}
.page{max-width:560px;margin:0 auto}

/* ── COMPACT HEADER ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.topbar h1{font-size:1.1em;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.topbar select{background:var(--card);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:var(--radius);font-size:.72em;font-family:var(--font);cursor:pointer;outline:none}
.topbar select:focus{border-color:var(--accent)}

/* ── STATUS STRIP ── */
.status-strip{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;font-size:.68em;color:var(--dim);font-family:var(--font-mono);overflow:hidden;white-space:nowrap}
.status-strip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-strip .dot.good{background:var(--green);box-shadow:0 0 5px rgba(34,197,94,.4)}
.status-strip .dot.warn{background:var(--yellow);box-shadow:0 0 5px rgba(234,179,8,.3)}
.status-strip .dot.bad{background:var(--red)}
.status-strip .num{font-weight:700;color:var(--text)}
.status-strip .val{color:var(--text-secondary);font-weight:500}
.status-strip .sep{opacity:.3;margin:0 2px}
.status-strip .best{color:var(--accent);font-weight:600;overflow:hidden;text-overflow:ellipsis}

/* ── DAY ROWS ── */
.days-container{display:flex;flex-direction:column;gap:4px}
.day-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .15s var(--ease)}
.day-row:hover{border-color:rgba(255,255,255,.1)}
.day-row.expanded{border-color:var(--border-active);background:var(--card-hover)}
.day-row-summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none;transition:background .1s}
.day-row-summary:active{background:rgba(255,255,255,.02)}

.row-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.row-dot.good{background:var(--green)}
.row-dot.warn{background:var(--yellow)}
.row-dot.bad{background:var(--red)}

.row-label{font-size:.8em;font-weight:600;letter-spacing:-.01em;min-width:52px}
.row-date{font-size:.72em;color:var(--dim);font-family:var(--font-mono);min-width:42px}
.row-timeline{flex:1;display:flex;gap:1px;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.04);min-width:60px}
.row-timeline .rs{flex:1;min-width:0}
.row-timeline .rs.a{background:var(--green);opacity:.65}
.row-timeline .rs.f{background:var(--red);opacity:.12}

.row-count{font-size:.7em;font-family:var(--font-mono);color:var(--dim);min-width:60px;text-align:right}
.row-count b{color:var(--text);font-weight:600}
.row-count b.good{color:var(--green)}
.row-count b.warn{color:var(--yellow)}
.row-count b.bad{color:var(--red)}
.row-today-badge{font-size:.6em;font-weight:600;color:var(--accent);padding:2px 6px;border-radius:3px;background:var(--accent-dim);letter-spacing:.03em}
.row-chevron{color:var(--dim);font-size:.7em;transition:transform .2s var(--ease)}

/* ── EXPANDED WINDOWS ── */
.day-detail{display:none;border-top:1px solid var(--border);padding:10px 12px 12px 42px}
.day-row.expanded .day-detail{display:block}
.day-row.expanded .row-chevron{transform:rotate(90deg)}

.detail-timeline{display:flex;gap:1px;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.04);margin-bottom:10px}
.detail-timeline .dt{flex:1;min-width:0}
.detail-timeline .dt.a{background:var(--green);opacity:.6}
.detail-timeline .dt.f{background:var(--red);opacity:.1}

.win-cards{display:flex;flex-wrap:wrap;gap:5px}
.wc{background:var(--green-dim);border:1px solid rgba(34,197,94,.12);border-radius:6px;padding:7px 10px;font-size:.72em;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px}
.wc:hover{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.25);transform:translateY(-1px)}
.wc .wt{font-weight:600;font-family:var(--font-mono);color:var(--green);letter-spacing:.01em;white-space:nowrap}
.wc .ws{font-size:.85em;color:var(--dim)}
.wc .ws strong{color:var(--text);font-weight:600}
.wc .ws strong.u{color:var(--red)}.wc .ws strong.l{color:var(--yellow)}.wc .ws strong.o{color:var(--green)}
.wc.full{background:var(--accent-dim);border-color:rgba(34,211,238,.12)}
.wc.full .wt{color:var(--accent)}

.ov-inline{font-size:.68em;color:var(--green);padding:6px 0 0;display:flex;align-items:center;gap:4px}
.ov-inline .ov-badge{font-size:.85em;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--green-dim);color:var(--green)}

/* ── HELP / LOADING / FOOTER ── */
.help-row{display:flex;justify-content:flex-end;margin:8px 0}
.help-row button{background:var(--card);border:1px solid var(--border);color:var(--dim);padding:4px 10px;border-radius:6px;font-size:.66em;cursor:pointer;font-family:var(--font)}
.help-row button:hover{color:var(--text)}
.help-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;font-size:.68em;color:var(--dim);line-height:1.9;display:none;margin-bottom:8px}
.help-box b{color:var(--text);font-weight:600}
.loading-state{text-align:center;padding:40px;color:var(--dim)}
.loading-spinner{width:24px;height:24px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:.64em;color:var(--dim);font-family:var(--font-mono)}
.footer-row a{color:var(--accent);text-decoration:none}
.refresh-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;background:var(--accent);animation:refreshPulse 1s ease infinite}
@keyframes refreshPulse{0%,100%{opacity:1}50%{opacity:.3}}
.refresh-dot.paused{background:var(--yellow);animation:none}
.footer-row button{background:none;border:1px solid var(--border);color:var(--dim);padding:2px 8px;border-radius:4px;font-size:.9em;cursor:pointer;font-family:var(--font-mono)}
.footer-row button:hover{color:var(--text)}
.footer-row button.paused{color:var(--yellow);border-color:rgba(234,179,8,.25)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px)}
.modal{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-lg);padding:20px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-size:.9em;font-weight:600;margin-bottom:12px;letter-spacing:-.01em}
.modal .info{background:rgba(255,255,255,.03);padding:12px;border-radius:var(--radius);margin-bottom:12px;font-size:.78em;line-height:1.8}
.modal .info b{color:var(--text)}
.modal .hint{color:var(--yellow);font-size:.68em;margin-bottom:14px}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap}
.modal .actions a,.modal .actions button{padding:9px 16px;border-radius:var(--radius);font-size:.78em;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;font-family:var(--font);transition:all .15s}
.btn-go{flex:1;min-width:120px;background:var(--accent);color:#09090b;border:none}.btn-go:hover{background:#67e8f9}
.btn-copy{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn-copy:hover{background:rgba(255,255,255,.08)}
.btn-close{background:transparent;color:var(--dim);border:1px solid var(--border)}.btn-close:hover{color:var(--text)}

/* ── CHATBOT ── */
.busbot-toggle{position:fixed;bottom:16px;right:16px;z-index:50;width:44px;height:44px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.1);cursor:pointer;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.5);padding:0;background:var(--card);transition:border-color .15s}
.busbot-toggle:hover{border-color:var(--accent)}
.busbot-toggle:active{transform:scale(.93)}
.busbot-toggle img{width:100%;height:100%;object-fit:cover}
.busbot-panel{position:fixed;bottom:68px;right:16px;z-index:51;width:min(340px,calc(100vw - 24px));height:420px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-lg);display:none;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.6)}
.busbot-panel.open{display:flex}
.busbot-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card2)}
.busbot-head img{width:30px;height:30px;border-radius:var(--radius);object-fit:cover;border:1px solid rgba(255,255,255,.08)}
.busbot-head .close-btn{background:none;border:none;color:var(--dim);font-size:1em;cursor:pointer}.busbot-head .close-btn:hover{color:var(--text)}
.busbot-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:.78em;line-height:1.5}
.busbot-msg{max-width:85%;padding:8px 12px;border-radius:var(--radius);animation:bbFadeIn .25s var(--ease)}
.busbot-msg.bot{background:var(--card2);align-self:flex-start;border-bottom-left-radius:3px;border:1px solid var(--border)}
.busbot-msg.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:3px;color:#09090b;font-weight:500}
.busbot-input-row{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border);background:var(--card2)}
.busbot-input-row input{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:.78em;outline:none;font-family:var(--font)}
.busbot-input-row input:focus{border-color:var(--accent)}
.busbot-input-row button{background:var(--accent);border:none;border-radius:var(--radius);padding:8px 14px;color:#09090b;font-weight:600;cursor:pointer;font-size:.78em;font-family:var(--font)}
.busbot-input-row button:hover{background:#67e8f9}
.busbot-typing{display:flex;gap:4px;padding:8px 12px;align-self:flex-start}
.busbot-typing span{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bbBounce 1.4s infinite}
.busbot-typing span:nth-child(2){animation-delay:.2s}.busbot-typing span:nth-child(3){animation-delay:.4s}
@keyframes bbBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes bbFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:360px){.topbar h1{font-size:.95em}.row-label{min-width:40px;font-size:.72em}.row-timeline{min-width:40px}}
</style>
</head>
<body>

<div class="page">
  <!-- COMPACT HEADER -->
  <div class="topbar">
    <h1>香園圍邊境停車場</h1>
    <select id="carType" onchange="refresh()">
      <option value="private">私家車</option>
      <option value="goods">客貨車</option>
      <option value="motorcycle">電單車</option>
      <option value="disabled_blue">傷殘人士(藍)</option>
      <option value="disabled_grey">接載殘疾(灰)</option>
    </select>
  </div>

  <!-- LOADING -->
  <div id="loading" class="loading-state"><div class="loading-spinner"></div><p>載入中...</p></div>

  <!-- APP -->
  <div id="app" style="display:none">
    <!-- STATUS STRIP -->
    <div class="status-strip" id="statusStrip"></div>

    <!-- DAY ROWS -->
    <div class="days-container" id="daysContainer"></div>

    <!-- HELP -->
    <div class="help-row">
      <button onclick="var h=document.getElementById('helpBox');h.style.display=h.style.display==='block'?'none':'block';this.textContent=h.style.display==='block'?'收起':'說明'">說明</button>
    </div>
    <div id="helpBox" class="help-box">
      <b>狀態顏色：</b><br>
      <span style="color:var(--green)">●</span> <b style="color:var(--green)">全線開放</b> · 全日所有時段有位<br>
      <span style="color:var(--accent)">●</span> <b style="color:var(--accent)">大部份可訂</b> · 超過一半時段有位<br>
      <span style="color:var(--yellow)">●</span> <b style="color:var(--yellow)">少量時段</b> · 少於一半時段有位<br>
      <span style="color:var(--red)">●</span> <b style="color:var(--red)">無時段</b> · 全日爆滿<br>
      <b>點擊日期</b> 展開睇可預約時段 · <b>點擊時段</b> 複製資訊同前往預約<br>
      泊車收費以每小時計算 · 最少 2 小時 · 入場前 30 分鐘至 7 天預約
    </div>

    <!-- FOOTER -->
    <div class="footer-row">
      <span><span class="refresh-dot" id="rd"></span><span id="tLabel">30s</span></span>
      <button id="btnPause" onclick="togglePause()">&#9646;&#9646;</button>
      <span><a href="/parking/">v1</a> · <a href="/">Home</a></span>
    </div>
  </div>
</div>

<!-- CHATBOT -->
<button class="busbot-toggle" id="busbotToggle" onclick="toggleBusbot()"><img src="/assets/parking-bot-avatar.jpg" alt="泊車仔"></button>
<div class="busbot-panel" id="busbotPanel">
  <div class="busbot-head">
    <img src="/assets/parking-bot-avatar.jpg" alt="泊車仔">
    <div style="flex:1"><div style="font-weight:600;font-size:.82em">泊車仔</div><div style="font-size:.64em;color:var(--green)">巴士 · 泊車助手</div></div>
    <button class="close-btn" onclick="document.getElementById('busbotPanel').style.display='none'">&times;</button>
  </div>
  <div class="busbot-msgs" id="busbotMsgs">
    <div class="busbot-msg bot">嗨～我係泊車仔<br>有咩巴士或者泊車問題隨時問我！</div>
  </div>
  <div class="busbot-input-row">
    <input id="busbotInput" placeholder="問我..." onkeydown="if(event.key==='Enter')sendBusbot()">
    <button onclick="sendBusbot()">發送</button>
  </div>
</div>

<script>
const STATUS={open:{icon:'🟢',label:'全線開放',cls:'open'},available:{icon:'🔵',label:'大部份可訂',cls:'available'},limited:{icon:'🟡',label:'少量時段',cls:'limited'},full:{icon:'🔴',label:'無時段',cls:'full'}};
const VT={private:{name:'私家車',icon:'🚗'},goods:{name:'客貨車',icon:'🚛'},motorcycle:{name:'電單車',icon:'🏍️'},disabled_blue:{name:'傷殘人士(藍)',icon:'♿'},disabled_grey:{name:'接載殘疾(灰)',icon:'♿'}};
var _days=[],_expandedIdx=-1,refreshTimer=null,cdTimer=null,cdVal=30,paused=false,_best=null;

function initDate(){
  var hkt=new Date(Date.now()+8*3600000);
  window._fromDate=hkt.toISOString().split('T')[0];
  window._toDate=new Date(hkt.getTime()+6*86400000).toISOString().split('T')[0];
}

function startCD(){
  cdVal=30;if(cdTimer)clearInterval(cdTimer);
  document.getElementById('rd').classList.remove('paused');
  cdTimer=setInterval(function(){
    cdVal--;if(cdVal<0){document.getElementById('tLabel').textContent='0';return}
    document.getElementById('tLabel').textContent=cdVal+'s';
  },1000);
}
function clearTimers(){if(refreshTimer)clearTimeout(refreshTimer);if(cdTimer)clearInterval(cdTimer);refreshTimer=null;cdTimer=null}
function togglePause(){
  paused=!paused;var btn=document.getElementById('btnPause'),rd=document.getElementById('rd');
  if(paused){btn.textContent='\u25B6';btn.classList.add('paused');rd.classList.add('paused');document.getElementById('tLabel').textContent='--';clearTimers()}
  else{btn.textContent='\u25A0\u25A0';btn.classList.remove('paused');rd.classList.remove('paused');startCD();refreshTimer=setTimeout(refresh,30000)}
}

async function refresh(){
  clearTimers();document.getElementById('loading').style.display='block';document.getElementById('app').style.display='none';initDate();
  var ct=document.getElementById('carType').value;
  try{
    var r=await fetch('/parking/api/availability?type='+ct+'&from='+window._fromDate+'&to='+window._toDate);
    var d=await r.json();document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';
    if(!d.ok){document.getElementById('statusStrip').innerHTML='<span class=\"dot bad\"></span> '+d.error;return}
    _days=d.days;_expandedIdx=-1;_best=findBest();updateStatusStrip();renderDays();
    if(!paused){startCD();refreshTimer=setTimeout(refresh,30000)}
  }catch(e){document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';document.getElementById('statusStrip').innerHTML='<span class=\"dot bad\"></span> '+e.message}
}

function findBest(){
  var best=null;
  for(var i=0;i<_days.length;i++){
    var day=_days[i];if(day.status==='error'||day.status==='full')continue;
    var ws=day.windows||[];
    for(var j=0;j<ws.length;j++){var w=ws[j],score=w.spaces*10+50;if(!best||score>best.score)best={day:day,w:w,score:score};}
  }
  return best;
}

function updateStatusStrip(){
  var total=_days.length,good=0,warn=0,bad=0;
  for(var i=0;i<_days.length;i++){
    var s=_days[i].status;if(s==='error'){bad++;continue}
    if(s==='open'||s==='available')good++;else if(s==='limited')warn++;else bad++;
  }
  var avail=good+warn,ratio=avail/total;
  var cls=ratio>=.6?'good':ratio>=.3?'warn':'bad';
  var bestStr='';
  if(_best){var b=_best;bestStr='<span class=\"sep\">|</span> 最佳: <span class=\"best\">'+b.day.day_label+' '+b.w.start+' 至 '+b.w.end+'</span>'}
  var ct=document.getElementById('carType').value,v=VT[ct]||VT.private;
  document.getElementById('statusStrip').innerHTML='<span class=\"dot '+cls+'\"></span><span class=\"num\">'+avail+'/'+total+'</span> 日有位'+bestStr+'<span class=\"sep\">|</span>'+v.icon;
}

function sc(n){return n<=2?'u':n<=5?'l':'o'}

function renderDays(){
  var todayStr=new Date(Date.now()+8*3600000).toISOString().split('T')[0];
  document.getElementById('daysContainer').innerHTML=_days.map(function(day,i){
    var isToday=day.date.includes(todayStr.replace(/-/g,'/'));
    var st=STATUS[day.status]||{icon:'',label:'錯誤',cls:'full'};
    var dotCls=day.status==='error'||day.status==='full'?'bad':day.status==='limited'?'warn':'good';
    var countCls=dotCls;
    var ws=day.windows||[];
    var availCount=day.available_count||0;

    // Mini timeline for row
    var tl='';
    if(day.status!=='error'&&day.total_slots>0){
      var segs='';
      for(var h=6;h<22;h++)for(var m=0;m<60;m+=30){
        var t=(h<10?'0':'')+h+':'+(m?'30':'00'),av=false;
        for(var wi=0;wi<ws.length;wi++){if(t>=ws[wi].start&&t<=ws[wi].end){av=true;break}}
        segs+='<div class=\"rs '+(av?'a':'f')+'\"></div>';
      }
      tl='<div class=\"row-timeline\">'+segs+'</div>';
    }

    // Expanded windows
    var detail='';
    if(day.status!=='error'){
      var dtl='';
      if(day.total_slots>0){
        var dsegs='';
        for(var h2=6;h2<22;h2++)for(var m2=0;m2<60;m2+=30){
          var t2=(h2<10?'0':'')+h2+':'+(m2?'30':'00'),av2=false;
          for(var wj=0;wj<ws.length;wj++){if(t2>=ws[wj].start&&t2<=ws[wj].end){av2=true;break}}
          dsegs+='<div class=\"dt '+(av2?'a':'f')+'\"></div>';
        }
        dtl+='<div class=\"detail-timeline\">'+dsegs+'</div>';
      }
      if(day.full_day_available){
        dtl+='<div class=\"win-cards\"><div class=\"wc full\" onclick=\"openDialog(\\''+day.date+'\\',\\'06:00\\',\\'21:30\\','+day.quota+')\"><span class=\"wt\">06:00 至 22:00</span><span class=\"ws\"><strong class=\"o\">'+day.quota+'</strong> 位</span></div></div>';
      }else if(ws.length>0){
        dtl+='<div class=\"win-cards\">'+ws.map(function(w){return '<div class=\"wc\" onclick=\"openDialog(\\''+day.date+'\\',\\''+w.start+'\\',\\''+w.end+'\\','+w.spaces+')\"><span class=\"wt\">'+w.start+' 至 '+w.end+'</span><span class=\"ws\"><strong class=\"'+sc(w.spaces)+'\">'+w.spaces+'</strong>位</span></div>'}).join('')+'</div>';
      }else{dtl+='<div style=\"color:var(--dim);font-size:.7em;padding:4px 0\">無可預約時段</div>'}

      // Overnight
      if(i<_days.length-1){
        var lastWin=ws.length>0?ws[ws.length-1]:null;
        if(lastWin&&lastWin.end==='21:30'){
          var nd=_days[i+1];
          if(nd&&nd.status!=='error'&&nd.status!=='full'){
            var fw=(nd.windows||[]).length>0?nd.windows[0]:null;
            if(fw&&fw.start==='06:00'){
              var fh=parseInt(lastWin.start.split(':')[0]),fm=parseInt(lastWin.start.split(':')[1]);
              var eh=parseInt(fw.end.split(':')[0]),em=parseInt(fw.end.split(':')[1]);
              var hrs=(22-(fh+fm/60))+(eh+em/60-6);
              dtl+='<div class=\"ov-inline\"><span class=\"ov-badge\">可過夜</span> 翌日 06:00 至 '+fw.end+' · 約'+hrs.toFixed(0)+'h</div>';
            }
          }
        }
      }
      detail='<div class=\"day-detail\">'+dtl+'</div>';
    }

    return '<div class=\"day-row\" id=\"dr'+i+'\">'
      +'<div class=\"day-row-summary\" onclick=\"toggleDay('+i+')\">'
        +'<span class=\"row-dot '+dotCls+'\"></span>'
        +'<span class=\"row-label\">'+(isToday?'今天':day.day_name)+'</span>'
        +'<span class=\"row-date\">'+day.day_label+'</span>'
        +tl
        +'<span class=\"row-count\"><b class=\"'+countCls+'\">'+(day.status==='error'?'?':availCount)+'</b>/'+(day.total_slots||0)+'</span>'
        +(isToday?'<span class=\"row-today-badge\">今天</span>':'')
        +'<span class=\"row-chevron\">&#9654;</span>'
      +'</div>'
      +detail
    +'</div>';
  }).join('');
}

function toggleDay(idx){
  var row=document.getElementById('dr'+idx);
  if(!row)return;
  var was=row.classList.contains('expanded');
  // Close all
  document.querySelectorAll('.day-row').forEach(function(r){r.classList.remove('expanded')});
  if(!was){row.classList.add('expanded');row.scrollIntoView({behavior:'smooth',block:'nearest'})}
  _expandedIdx=was?-1:idx;
}

function openDialog(date,ws,we,sp){
  var ct=document.getElementById('carType').value,v=VT[ct]||VT.private;
  var p=date.split('/');var dd=p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日';
  var sh=parseInt(ws.split(':')[0]),sm=parseInt(ws.split(':')[1]);
  var eh=parseInt(we.split(':')[0]),em=parseInt(we.split(':')[1]);
  var h=eh+em/60+0.5-(sh+sm/60);
  var ov=document.createElement('div');ov.className='modal-overlay';ov.id='bookingDialog';
  ov.onclick=function(e){if(e.target===ov)ov.remove()};
  ov.innerHTML='<div class=\"modal\"><h2>'+v.icon+' '+v.name+'</h2><div class=\"info\"><b>'+dd+'</b><br>'+ws+' 至 '+we+' ('+h.toFixed(1)+'小時)<br>剩餘 &ge;'+sp+' 位</div><div class=\"hint\">已複製到剪貼簿</div><div class=\"actions\"><a class=\"btn-go\" href=\"https://hywparking.com.hk/car-park/carParkBooking?lang=zh_TW\" target=\"_blank\">前往官方預約</a><button class=\"btn-copy\" id=\"btnCopy\">Copy</button><button class=\"btn-close\" onclick=\"document.getElementById(\\'bookingDialog\\').remove()\">Close</button></div></div>';
  document.body.appendChild(ov);
  var txt=v.name+' | '+dd+' | '+ws+' 至 '+we;
  document.getElementById('btnCopy').onclick=function(){navigator.clipboard.writeText(txt);this.textContent='Done'};
  navigator.clipboard.writeText(txt).catch(function(){});
}

var busbotMsgs=[];
function toggleBusbot(){var p=document.getElementById("busbotPanel");p.style.display=p.style.display==="flex"?"none":"flex";if(p.style.display==="flex")document.getElementById("busbotInput").focus()}
function addBusbotMsg(role,text){var c=document.getElementById("busbotMsgs"),d=document.createElement("div");d.className="busbot-msg "+role;d.textContent=text;c.appendChild(d);c.scrollTop=c.scrollHeight}
function sendBusbot(){var inp=document.getElementById("busbotInput"),t=inp.value.trim();if(!t)return;inp.value="";addBusbotMsg("user",t);busbotMsgs.push({role:"user",content:t});var ld=document.createElement("div");ld.className="busbot-typing";ld.innerHTML="<span></span><span></span><span></span>";var c=document.getElementById("busbotMsgs");c.appendChild(ld);c.scrollTop=c.scrollHeight;fetch("/chatbot-api/message",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role:"busfan",messages:busbotMsgs})}).then(function(r){return r.json()}).then(function(d){ld.remove();if(d.ok){addBusbotMsg("bot",d.reply);busbotMsgs.push({role:"assistant",content:d.reply})}else addBusbotMsg("bot","❌ "+d.error)}).catch(function(e){ld.remove();addBusbotMsg("bot","❌ 網絡錯誤")})}

document.addEventListener('DOMContentLoaded',function(){initDate();refresh()});
</script>
