<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>香園圍停車場 · Confidence View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   Parking · taste-skill v2
   DENSITY 5 · VARIANCE 5 · MOTION 4
   ═══════════════════════════════════════ */
:root {
  --bg:#09090b;--card:#131316;--card-hover:#1a1a20;--card2:#1f1f26;
  --accent:#22d3ee;--accent-dim:rgba(34,211,238,.07);--accent-glow:rgba(34,211,238,.12);
  --text:#fafafa;--text-secondary:#d4d4d8;--dim:#71717a;
  --green:#22c55e;--green-dim:rgba(34,197,94,.08);--green-border:rgba(34,197,94,.14);
  --yellow:#eab308;--yellow-dim:rgba(234,179,8,.08);
  --red:#ef4444;--red-dim:rgba(239,68,68,.06);
  --border:rgba(255,255,255,.06);--border-active:rgba(34,211,238,.18);
  --radius:10px;--radius-lg:18px;--radius-xl:24px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --ease:cubic-bezier(0.16,1,0.3,1);--spring:cubic-bezier(0.34,1.56,0.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100dvh;padding:18px 14px 100px;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:520px;margin:0 auto}

/* ── HEADER ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.topbar h1{font-size:1.15em;font-weight:700;letter-spacing:-.015em}
.topbar select{
  background:var(--card);color:var(--text);border:1px solid var(--border);
  padding:7px 10px;border-radius:var(--radius);font-size:.72em;font-family:var(--font);
  cursor:pointer;outline:none;transition:border-color .15s
}
.topbar select:focus{border-color:var(--accent)}

/* ── GAUGE CARD ── */
.gauge-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-xl);padding:24px 20px 18px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.gauge-card::before{
  content:'';position:absolute;top:-30%;right:-15%;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);
  pointer-events:none;
}
.gauge-row{position:relative;z-index:1;display:flex;align-items:center;gap:20px}
.gauge-svg{flex-shrink:0;position:relative}
.gauge-svg svg{width:100px;height:100px;transform:rotate(-90deg)}
.gauge-bg{fill:none;stroke:rgba(255,255,255,.04);stroke-width:7}
.gauge-fill{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s var(--spring),stroke .4s}
.gauge-fill.warn{stroke:var(--yellow)}.gauge-fill.bad{stroke:var(--red)}
.gauge-num{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.gauge-num .big{font-size:1.8em;font-weight:900;letter-spacing:-.03em;line-height:1;transition:color .4s}
.gauge-num .big.good{color:var(--accent)}.gauge-num .big.warn{color:var(--yellow)}.gauge-num .big.bad{color:var(--red)}
.gauge-num .sub{font-size:.62em;color:var(--dim);margin-top:1px;font-weight:500}
.gauge-text{flex:1;min-width:0}
.gauge-text .gt-status{font-size:1em;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
.gauge-text .gt-status.good{color:var(--green)}.gauge-text .gt-status.warn{color:var(--yellow)}.gauge-text .gt-status.bad{color:var(--red)}
.gauge-text .gt-detail{font-size:.74em;color:var(--dim);line-height:1.45}

/* ── BEST SLOT ── */
.best-slot{
  position:relative;z-index:1;margin-top:14px;
  display:flex;align-items:center;gap:10px;
  background:var(--accent-dim);border:1px solid rgba(34,211,238,.1);
  border-radius:var(--radius);padding:10px 14px;font-size:.76em;
  cursor:pointer;transition:background .15s,transform .1s;
}
.best-slot:hover{background:rgba(34,211,238,.12)}
.best-slot:active{transform:scale(.98)}
.best-slot .bs-badge{
  font-size:.64em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--accent);white-space:nowrap;
}
.best-slot .bs-info{flex:1;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
.best-slot .bs-time{font-weight:700;font-family:var(--font-mono);font-size:.95em;letter-spacing:-.01em}
.best-slot .bs-date{color:var(--dim)}
.best-slot .bs-spots{font-weight:600;font-size:.85em;padding:2px 8px;border-radius:12px}
.best-slot .bs-spots.ok{background:var(--green-dim);color:var(--green)}
.best-slot .bs-spots.low{background:var(--yellow-dim);color:var(--yellow)}
.best-slot .bs-spots.u{background:var(--red-dim);color:var(--red)}
.best-slot .bs-arrow{color:var(--accent);font-size:.8em;opacity:.6}

/* ── DAY CARDS ── */
.day-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px;
  transition:border-color .2s var(--ease),background .2s;
}
.day-card:hover{border-color:rgba(255,255,255,.1)}
.day-card.today{border-color:var(--border-active);background:var(--card-hover)}

.day-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.day-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.day-dot.good{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.4)}
.day-dot.warn{background:var(--yellow);box-shadow:0 0 6px rgba(234,179,8,.3)}
.day-dot.bad{background:var(--red)}
.day-label{font-weight:600;font-size:.85em;letter-spacing:-.01em;min-width:42px}
.day-date{font-size:.72em;color:var(--dim);font-family:var(--font-mono)}
.day-badge{
  margin-left:auto;font-size:.62em;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;padding:2px 8px;border-radius:10px;
}
.day-badge.open{background:var(--green-dim);color:var(--green)}
.day-badge.available{background:var(--accent-dim);color:var(--accent)}
.day-badge.limited{background:var(--yellow-dim);color:var(--yellow)}
.day-badge.full{background:var(--red-dim);color:var(--red)}
.day-today-tag{font-size:.58em;font-weight:600;color:var(--accent);padding:2px 7px;border-radius:3px;background:var(--accent-dim);letter-spacing:.03em;white-space:nowrap}

/* Timeline */
.day-tl{display:flex;gap:1px;height:7px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.04);margin-bottom:10px}
.day-tl .ts{flex:1;min-width:0}
.day-tl .ts.a{background:var(--green);opacity:.6}
.day-tl .ts.f{background:var(--red);opacity:.1}

/* Window chips */
.day-wins{display:flex;flex-wrap:wrap;gap:6px}
.wc{
  background:var(--green-dim);border:1px solid var(--green-border);
  border-radius:8px;padding:7px 11px;font-size:.74em;cursor:pointer;
  transition:all .12s var(--ease);display:flex;align-items:center;gap:8px;
}
.wc:hover{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.25);transform:translateY(-1px)}
.wc:active{transform:scale(.97)}
.wc .wt{font-weight:600;font-family:var(--font-mono);color:var(--green);white-space:nowrap;letter-spacing:.01em}
.wc .ws{font-size:.82em;color:var(--dim)}
.wc .ws strong{font-weight:600}
.wc .ws strong.u{color:var(--red)}.wc .ws strong.l{color:var(--yellow)}.wc .ws strong.o{color:var(--green)}
.wc.full{background:var(--accent-dim);border-color:rgba(34,211,238,.12)}
.wc.full .wt{color:var(--accent)}
.wc.ov{background:rgba(34,197,94,.04);border-color:rgba(34,197,94,.08)}
.wc.ov .wt{color:var(--text-secondary);font-size:.8em}
.wc .wov{font-size:.68em;color:var(--green);font-weight:600;white-space:nowrap}
.no-win{color:var(--dim);font-size:.72em;padding:2px 0}

/* ── HELP / LOADING / FOOTER ── */
.help-row{text-align:right;margin-bottom:8px}
.help-row button{background:var(--card);border:1px solid var(--border);color:var(--dim);padding:4px 10px;border-radius:6px;font-size:.66em;cursor:pointer;font-family:var(--font)}
.help-row button:hover{color:var(--text)}
.help-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;font-size:.68em;color:var(--dim);line-height:1.9;display:none;margin-bottom:12px}
.help-box b{color:var(--text);font-weight:600}
.loading-state{text-align:center;padding:48px;color:var(--dim)}
.loading-spinner{width:26px;height:26px;border:2.5px solid rgba(255,255,255,.06);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-top:4px;font-size:.66em;color:var(--dim);font-family:var(--font-mono)}
.footer-bar a{color:var(--accent);text-decoration:none;font-weight:500}
.footer-bar button{background:none;border:1px solid var(--border);color:var(--dim);padding:3px 10px;border-radius:5px;font-size:.9em;cursor:pointer;font-family:var(--font-mono)}
.footer-bar button:hover{color:var(--text)}
.footer-bar button.paused{color:var(--yellow);border-color:rgba(234,179,8,.25)}
.refresh-indicator{display:inline-flex;align-items:center;gap:5px}
.refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:rp 1s ease infinite;display:inline-block}
.refresh-dot.paused{background:var(--yellow);animation:none}
@keyframes rp{0%,100%{opacity:1}50%{opacity:.3}}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-lg);padding:22px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-size:.92em;font-weight:600;margin-bottom:12px;letter-spacing:-.01em}
.modal .info{background:rgba(255,255,255,.03);padding:12px;border-radius:var(--radius);margin-bottom:12px;font-size:.78em;line-height:1.8}
.modal .info b{color:var(--text)}
.modal .hint{color:var(--yellow);font-size:.68em;margin-bottom:14px}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap}
.modal .actions a,.modal .actions button{padding:9px 16px;border-radius:var(--radius);font-size:.78em;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;font-family:var(--font);transition:all .15s}
.btn-go{flex:1;min-width:120px;background:var(--accent);color:#09090b;border:none}.btn-go:hover{background:#67e8f9}
.btn-copy{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn-copy:hover{background:rgba(255,255,255,.08)}
.btn-close-btn{background:transparent;color:var(--dim);border:1px solid var(--border)}.btn-close-btn:hover{color:var(--text)}

/* ── CHATBOT ── */
.busbot-toggle{position:fixed;bottom:18px;right:18px;z-index:50;width:48px;height:48px;border-radius:var(--radius-lg);border:1px solid rgba(255,255,255,.1);cursor:pointer;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.5);padding:0;background:var(--card);transition:border-color .2s,box-shadow .2s}
.busbot-toggle:hover{border-color:var(--accent);box-shadow:0 4px 24px rgba(0,0,0,.5),0 0 18px var(--accent-glow)}
.busbot-toggle:active{transform:scale(.93)}
.busbot-toggle img{width:100%;height:100%;object-fit:cover}
.busbot-panel{position:fixed;bottom:76px;right:18px;z-index:51;width:min(340px,calc(100vw - 28px));height:420px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-lg);display:none;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.6)}
.busbot-panel.open{display:flex}
.busbot-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card2)}
.busbot-head img{width:30px;height:30px;border-radius:var(--radius);object-fit:cover;border:1px solid rgba(255,255,255,.08)}
.busbot-head .close-btn{background:none;border:none;color:var(--dim);font-size:1em;cursor:pointer;padding:2px}.busbot-head .close-btn:hover{color:var(--text)}
.busbot-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:.78em;line-height:1.5}
.busbot-msg{max-width:85%;padding:8px 12px;border-radius:var(--radius);animation:bf .25s var(--ease)}
.busbot-msg.bot{background:var(--card2);align-self:flex-start;border-bottom-left-radius:3px;border:1px solid var(--border)}
.busbot-msg.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:3px;color:#09090b;font-weight:500}
.busbot-input-row{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border);background:var(--card2)}
.busbot-input-row input{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:.78em;outline:none;font-family:var(--font)}
.busbot-input-row input:focus{border-color:var(--accent)}
.busbot-input-row button{background:var(--accent);border:none;border-radius:var(--radius);padding:8px 14px;color:#09090b;font-weight:600;cursor:pointer;font-size:.78em;font-family:var(--font)}
.busbot-input-row button:hover{background:#67e8f9}
.busbot-typing{display:flex;gap:4px;padding:8px 12px;align-self:flex-start}
.busbot-typing span{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bb 1.4s infinite}
.busbot-typing span:nth-child(2){animation-delay:.2s}.busbot-typing span:nth-child(3){animation-delay:.4s}
@keyframes bb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes bf{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:380px){
  body{padding:12px 8px 100px}
  .gauge-card{padding:18px 14px 14px}.gauge-row{gap:14px}
  .gauge-svg svg{width:80px;height:80px}.gauge-num .big{font-size:1.4em}
  .day-card{padding:12px 12px}.wc{padding:6px 8px;font-size:.7em}
}
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <h1>香園圍邊境停車場</h1>
    <select id="carType" onchange="refresh()">
      <option value="private">私家車</option>
      <option value="goods">客貨車</option>
      <option value="motorcycle">電單車</option>
      <option value="disabled_blue">傷殘人士(藍)</option>
      <option value="disabled_grey">接載殘疾(灰)</option>
    </select>
  </div>

  <div id="loading" class="loading-state"><div class="loading-spinner"></div><p>載入中...</p></div>

  <div id="app" style="display:none">
    <!-- GAUGE -->
    <div class="gauge-card">
      <div class="gauge-row">
        <div class="gauge-svg">
          <svg viewBox="0 0 100 100">
            <circle class="gauge-bg" cx="50" cy="50" r="43"/>
            <circle class="gauge-fill" id="gf" cx="50" cy="50" r="43" stroke-dasharray="270.18" stroke-dashoffset="270.18"/>
          </svg>
          <div class="gauge-num"><span class="big" id="gn">0/7</span><span class="sub">日有位</span></div>
        </div>
        <div class="gauge-text">
          <div class="gt-status" id="gs">載入中...</div>
          <div class="gt-detail" id="gd"></div>
        </div>
      </div>
      <div class="best-slot" id="best" onclick="scrollToBest()">
        <span class="bs-badge">最佳時段</span>
        <span class="bs-info"><span class="bs-time" id="bt">--</span><span class="bs-date" id="bd"></span><span class="bs-spots" id="bp"></span></span>
        <span class="bs-arrow">&#8595;</span>
      </div>
    </div>

    <!-- DAY CARDS -->
    <div id="days"></div>

    <!-- HELP -->
    <div class="help-row">
      <button onclick="var h=document.getElementById('hb');h.style.display=h.style.display==='block'?'none':'block';this.textContent=h.style.display==='block'?'收起':'說明'">說明</button>
    </div>
    <div id="hb" class="help-box">
      <b>信心環：</b> 顯示未來 7 日有幾多日有位<br>
      <b>時間線：</b> <span style="color:var(--green)">■ 有位</span> <span style="color:var(--red)">■ 已滿</span> · 一條 bar 睇晒全日邊段時間有位<br>
      <b>點擊時段</b> 可複製資訊同前往官方預約<br>
      泊車收費以每小時計算 · 最少 2 小時 · 入場前 30 分鐘至 7 天預約
    </div>

    <div class="footer-bar">
      <span class="refresh-indicator"><span class="refresh-dot" id="rd"></span><span id="tl">30s</span></span>
      <button id="bpBtn" onclick="togglePause()">&#9646;&#9646;</button>
      <span><a href="/parking/">v1</a> · <a href="/">Home</a></span>
    </div>
  </div>
</div>

<!-- CHATBOT -->
<button class="busbot-toggle" id="busbotToggle" onclick="toggleBusbot()"><img src="/assets/parking-bot-avatar.jpg" alt="泊車仔"></button>
<div class="busbot-panel" id="busbotPanel">
  <div class="busbot-head">
    <img src="/assets/parking-bot-avatar.jpg" alt="泊車仔">
    <div style="flex:1"><div style="font-weight:600;font-size:.82em">泊車仔</div><div style="font-size:.64em;color:var(--green)">巴士 · 泊車助手</div></div>
    <button class="close-btn" onclick="document.getElementById('busbotPanel').style.display='none'">&times;</button>
  </div>
  <div class="busbot-msgs" id="busbotMsgs">
    <div class="busbot-msg bot">嗨～我係泊車仔<br>有咩巴士或者泊車問題隨時問我！</div>
  </div>
  <div class="busbot-input-row">
    <input id="busbotInput" placeholder="問我..." onkeydown="if(event.key==='Enter')sendBusbot()">
    <button onclick="sendBusbot()">發送</button>
  </div>
</div>

<script>
const STATUS={open:{label:'全線開放',cls:'open'},available:{label:'大部份可訂',cls:'available'},limited:{label:'少量時段',cls:'limited'},full:{label:'無時段',cls:'full'}};
const VT={private:{name:'私家車',icon:'🚗'},goods:{name:'客貨車',icon:'🚛'},motorcycle:{name:'電單車',icon:'🏍️'},disabled_blue:{name:'傷殘人士(藍)',icon:'♿'},disabled_grey:{name:'接載殘疾(灰)',icon:'♿'}};
var _days=[],_best=null,_bestIdx=-1,rt=null,cti=null,cd=30,paused=false;

function id(){initDate()}
function initDate(){var h=new Date(Date.now()+8*3600000);window._fd=h.toISOString().split('T')[0];window._td=new Date(h.getTime()+6*86400000).toISOString().split('T')[0]}

function startCD(){cd=30;if(cti)clearInterval(cti);document.getElementById('rd').classList.remove('paused');cti=setInterval(function(){cd--;if(cd<0){document.getElementById('tl').textContent='0';return}document.getElementById('tl').textContent=cd+'s'},1000)}
function clearAll(){if(rt)clearTimeout(rt);if(cti)clearInterval(cti);rt=null;cti=null}
function togglePause(){paused=!paused;var b=document.getElementById('bpBtn'),r=document.getElementById('rd');if(paused){b.textContent='\u25B6';b.classList.add('paused');r.classList.add('paused');document.getElementById('tl').textContent='--';clearAll()}else{b.textContent='\u25A0\u25A0';b.classList.remove('paused');r.classList.remove('paused');startCD();rt=setTimeout(refresh,30000)}}

async function refresh(){
  clearAll();document.getElementById('loading').style.display='block';document.getElementById('app').style.display='none';initDate();
  var ct=document.getElementById('carType').value;
  try{
    var r=await fetch('/parking/api/availability?type='+ct+'&from='+window._fd+'&to='+window._td);
    var d=await r.json();document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';
    if(!d.ok){showErr(d.error);return}
    _days=d.days;findBest();updateGauge();renderDays();
    if(!paused){startCD();rt=setTimeout(refresh,30000)}
  }catch(e){showErr(e.message)}
}
function showErr(m){document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';document.getElementById('gs').textContent='無法載入';document.getElementById('gs').className='gt-status bad';document.getElementById('gd').textContent=m}

function findBest(){_best=null;_bestIdx=-1;for(var i=0;i<_days.length;i++){var day=_days[i];if(day.status==='error'||day.status==='full')continue;var ws=day.windows||[];for(var j=0;j<ws.length;j++){var w=ws[j],s=w.spaces*10+50;if(!_best||s>_best.score){_best={day:day,w:w,score:s};_bestIdx=i}}}}

function updateGauge(){
  var t=_days.length,g=0,w=0,b=0;
  for(var i=0;i<t;i++){var s=_days[i].status;if(s==='error'){b++;continue}if(s==='open'||s==='available')g++;else if(s==='limited')w++;else b++}
  var a=g+w,rt=a/t,c=270.18*(1-rt);
  var f=document.getElementById('gf');f.style.strokeDashoffset=c;f.classList.remove('warn','bad');if(rt<.3)f.classList.add('bad');else if(rt<.6)f.classList.add('warn');
  var n=document.getElementById('gn');n.textContent=a+'/'+t;n.className='big '+(rt>=.6?'good':rt>=.3?'warn':'bad');
  var s=document.getElementById('gs'),dl=document.getElementById('gd');
  if(g===t){s.textContent='全線暢通';s.className='gt-status good';dl.textContent='未來 7 日全部時段有位，放心出發。'}
  else if(rt>=.8){s.textContent='大部份日子有位';s.className='gt-status good';dl.textContent=g+' 日全線開放，'+w+' 日少量時段。建議提早預約。'}
  else if(rt>=.4){s.textContent='部份日子緊張';s.className='gt-status warn';dl.textContent=g+' 日有位，'+b+' 日已滿。請揀選有位日子預約。'}
  else if(rt>0){s.textContent='大部份日子爆滿';s.className='gt-status bad';dl.textContent='只有 '+a+' 日有位。建議盡快預約或考慮其他口岸。'}
  else{s.textContent='未來 7 日全滿';s.className='gt-status bad';dl.textContent='暫無可預約時段。請稍後再檢查。'}

  // Best slot
  if(_best){var bw=_best;document.getElementById('bt').textContent=bw.w.start+' 至 '+bw.w.end;document.getElementById('bd').textContent=bw.day.day_label;var sc=bw.w.spaces<=2?'u':bw.w.spaces<=5?'low':'ok';document.getElementById('bp').textContent=bw.w.spaces+' 位';document.getElementById('bp').className='bs-spots '+sc;document.getElementById('best').style.display='flex'}
  else{document.getElementById('best').style.display='none'}
}
function scrollToBest(){if(_bestIdx>=0){var el=document.getElementById('dc'+_bestIdx);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}}

function sc(n){return n<=2?'u':n<=5?'l':'o'}
function dcls(s){return s==='error'||s==='full'?'bad':s==='limited'?'warn':'good'}

function renderDays(){
  var ts=new Date(Date.now()+8*3600000).toISOString().split('T')[0];
  document.getElementById('days').innerHTML=_days.map(function(day,i){
    var it=day.date.includes(ts.replace(/-/g,'/'));var st=STATUS[day.status]||{label:'錯誤',cls:'full'};
    var dc=dcls(day.status),ws=day.windows||[],ac=day.available_count||0;

    // Timeline
    var tl='';if(day.status!=='error'&&day.total_slots>0){var segs='';for(var h=6;h<22;h++)for(var m=0;m<60;m+=30){var t=(h<10?'0':'')+h+':'+(m?'30':'00'),av=false;for(var wi=0;wi<ws.length;wi++){if(t>=ws[wi].start&&t<=ws[wi].end){av=true;break}}segs+='<div class=\"ts '+(av?'a':'f')+'\"></div>'}tl='<div class=\"day-tl\">'+segs+'</div>'}

    // Windows
    var wh='';if(day.status==='error'){wh='<div class=\"no-win\">無法載入</div>'}
    else if(day.status==='full'||ws.length===0){wh='<div class=\"no-win\">無可預約時段</div>'}
    else if(day.full_day_available){wh='<div class=\"day-wins\"><div class=\"wc full\" onclick=\"openDlg(\''+day.date+'\',\'06:00\',\'21:30\','+day.quota+')\"><span class=\"wt\">06:00 至 22:00 全線開放</span><span class=\"ws\"><strong class=\"o\">'+day.quota+'</strong> 位</span></div></div>'}
    else{wh='<div class=\"day-wins\">'+ws.map(function(w){return '<div class=\"wc\" onclick=\"openDlg(\''+day.date+'\',\''+w.start+'\',\''+w.end+'\','+w.spaces+')\"><span class=\"wt\">'+w.start+' 至 '+w.end+'</span><span class=\"ws\"><strong class=\"'+sc(w.spaces)+'\">'+w.spaces+'</strong> 位</span></div>'}).join('')+'</div>'}

    // Overnight chip
    if(i<_days.length-1&&day.status!=='error'&&day.status!=='full'){var lw=ws.length>0?ws[ws.length-1]:null;if(lw&&lw.end==='21:30'){var nd=_days[i+1];if(nd&&nd.status!=='error'&&nd.status!=='full'){var fw=(nd.windows||[]).length>0?nd.windows[0]:null;if(fw&&fw.start==='06:00'){var fh=parseInt(lw.start.split(':')[0]),fm=parseInt(lw.start.split(':')[1]),eh=parseInt(fw.end.split(':')[0]),em=parseInt(fw.end.split(':')[1]),hrs=(22-(fh+fm/60))+(eh+em/60-6);wh+='<div class=\"day-wins\" style=\"margin-top:6px\"><div class=\"wc ov\"><span class=\"wov\">🌙 可過夜泊車</span><span class=\"wt\" style=\"font-size:.75em;color:var(--dim)\">翌日 06:00 至 '+fw.end+' · 約'+hrs.toFixed(0)+'h</span></div></div>'}}}}

    return '<div class=\"day-card'+(it?' today':'')+'\" id=\"dc'+i+'\">'
      +'<div class=\"day-head\">'
        +'<span class=\"day-dot '+dc+'\"></span>'
        +'<span class=\"day-label\">'+(it?'今天':day.day_name)+'</span>'
        +'<span class=\"day-date\">'+day.day_label+'</span>'
        +(it?'<span class=\"day-today-tag\">今天</span>':'')
        +'<span class=\"day-badge '+st.cls+'\">'+st.label+'</span>'
      +'</div>'
      +tl+wh
    +'</div>';
  }).join('');
}

function openDlg(d,ws,we,sp){
  var ct=document.getElementById('carType').value,v=VT[ct]||VT.private,p=d.split('/'),dd=p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日';
  var sh=parseInt(ws.split(':')[0]),sm=parseInt(ws.split(':')[1]),eh=parseInt(we.split(':')[0]),em=parseInt(we.split(':')[1]),h=eh+em/60+.5-(sh+sm/60);
  var ov=document.createElement('div');ov.className='modal-overlay';ov.id='bdg';ov.onclick=function(e){if(e.target===ov)ov.remove()};
  ov.innerHTML='<div class=\"modal\"><h2>'+v.icon+' '+v.name+'</h2><div class=\"info\"><b>'+dd+'</b><br>'+ws+' 至 '+we+' ('+h.toFixed(1)+'小時)<br>剩餘 &ge;'+sp+' 位</div><div class=\"hint\">已複製到剪貼簿</div><div class=\"actions\"><a class=\"btn-go\" href=\"https://hywparking.com.hk/car-park/carParkBooking?lang=zh_TW\" target=\"_blank\">前往官方預約</a><button class=\"btn-copy\" id=\"bcp\">Copy</button><button class=\"btn-close-btn\" onclick=\"document.getElementById(\'bdg\').remove()\">Close</button></div></div>';
  document.body.appendChild(ov);var txt=v.name+' | '+dd+' | '+ws+' 至 '+we;document.getElementById('bcp').onclick=function(){navigator.clipboard.writeText(txt);this.textContent='Done'};navigator.clipboard.writeText(txt).catch(function(){});
}

var bms=[];
function toggleBusbot(){var p=document.getElementById("busbotPanel");p.style.display=p.style.display==="flex"?"none":"flex";if(p.style.display==="flex")document.getElementById("busbotInput").focus()}
function addBm(r,t){var c=document.getElementById("busbotMsgs"),d=document.createElement("div");d.className="busbot-msg "+r;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight}
function sendBusbot(){var i=document.getElementById("busbotInput"),t=i.value.trim();if(!t)return;i.value="";addBm("user",t);bms.push({role:"user",content:t});var ld=document.createElement("div");ld.className="busbot-typing";ld.innerHTML="<span></span><span></span><span></span>";var c=document.getElementById("busbotMsgs");c.appendChild(ld);c.scrollTop=c.scrollHeight;fetch("/chatbot-api/message",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role:"busfan",messages:bms})}).then(function(r){return r.json()}).then(function(d){ld.remove();if(d.ok){addBm("bot",d.reply);bms.push({role:"assistant",content:d.reply})}else addBm("bot","❌ "+d.error)}).catch(function(e){ld.remove();addBm("bot","❌ 網絡錯誤")})}

document.addEventListener('DOMContentLoaded',function(){initDate();refresh()});
</script>
