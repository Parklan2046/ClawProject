<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>awesomeOpenCode · Agent & Skill Catalog</title>
<style>
:root{--pink:#ff3ea5;--cyan:#33e6ff;--purple:#8b5cf6;--green:#00e676;--gold:#ffd166;--orange:#ff9100;--red:#ff3d3d;--bg:#070312;--panel:rgba(14,6,30,.94);--text:#e8d4ff;--muted:#9e7aaa;--card:rgba(22,8,48,.85)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Courier New',Consolas,monospace;background:var(--bg);color:var(--text);min-height:100vh}
body{background:linear-gradient(180deg,#0f0828 0%,#070312 40%,#060211 100%)}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);pointer-events:none;z-index:999}
.container{max-width:1100px;margin:0 auto;padding:20px 16px 60px;position:relative;z-index:1}
.hero{text-align:center;padding:30px 0 20px}
.hero h1{font-size:2em;letter-spacing:.08em;text-transform:uppercase;color:var(--pink);text-shadow:0 0 18px rgba(255,62,165,.5),0 0 40px rgba(255,62,165,.2);animation:glitch 5s infinite}
@keyframes glitch{0%,90%,100%{opacity:1;transform:translateX(0)}92%{opacity:.85;transform:translateX(-1px);text-shadow:1px 0 var(--cyan),-1px 0 var(--pink)}94%{opacity:.9;transform:translateX(1px);text-shadow:-1px 0 var(--cyan),1px 0 var(--pink)}96%{opacity:.8;transform:translateX(0)}}
.hero .sub{color:var(--muted);margin-top:8px;font-size:.85em;letter-spacing:.06em}
.stats-bar{display:flex;justify-content:center;gap:24px;margin:16px 0 24px;flex-wrap:wrap}
.stats-bar .s{text-align:center;padding:6px 16px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(255,255,255,.03)}
.stats-bar .s .n{font-size:1.4em;font-weight:900;color:var(--cyan);text-shadow:0 0 8px rgba(51,230,255,.3)}
.stats-bar .s .l{font-size:.55em;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.search-wrap{text-align:center;margin-bottom:20px}
.search-wrap input{width:100%;max-width:500px;padding:12px 18px;border-radius:12px;border:1px solid rgba(255,62,165,.25);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:.9em;outline:none;box-shadow:0 0 20px rgba(139,92,246,.08)}
.search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 24px rgba(51,230,255,.15)}
.cat-nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:24px}
.cat-nav button{padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font-family:inherit;font-size:.6em;text-transform:uppercase;letter-spacing:.05em;transition:all .15s}
.cat-nav button:hover,.cat-nav button.active{border-color:var(--cyan);color:var(--cyan);background:rgba(51,230,255,.06);box-shadow:0 0 12px rgba(51,230,255,.1)}
.cat-section{margin-bottom:28px}
.cat-header{font-size:.85em;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--cyan);text-shadow:0 0 10px rgba(51,230,255,.2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(255,62,165,.15);display:flex;align-items:center;gap:8px}
.cat-header .count{font-size:.65em;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:rgba(255,62,165,.18);box-shadow:0 0 16px rgba(139,92,246,.06)}
.card .name{font-weight:900;font-size:.85em;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.card .desc{font-size:.7em;color:var(--muted);line-height:1.55}
.card .meta{margin-top:6px;display:flex;gap:8px;align-items:center}
.card .badge{font-size:.55em;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.badge-core{background:rgba(51,230,255,.12);color:var(--cyan)}
.badge-lang{background:rgba(139,92,246,.12);color:var(--purple)}
.badge-infra{background:rgba(255,145,0,.12);color:var(--orange)}
.badge-quality{background:rgba(0,230,118,.12);color:var(--green)}
.badge-data{background:rgba(255,209,102,.12);color:var(--gold)}
.badge-dx{background:rgba(255,62,165,.12);color:var(--pink)}
.badge-domain{background:rgba(255,61,61,.12);color:var(--red)}
.badge-business{background:rgba(77,232,255,.12);color:#4de8ff}
.badge-meta{background:rgba(255,171,64,.12);color:#ffab40}
.badge-research{background:rgba(200,180,255,.12);color:#c8b4ff}
.badge-manager{background:rgba(255,62,165,.15);color:var(--pink);box-shadow:0 0 8px rgba(255,62,165,.2)}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.skill-card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px}
.skill-card .name{font-weight:900;font-size:.8em;color:var(--green);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.skill-card .desc{font-size:.68em;color:var(--muted);line-height:1.5}
.hidden{display:none!important}
.footer{text-align:center;margin-top:40px;color:var(--muted);font-size:.7em;letter-spacing:.06em;text-transform:uppercase}
@media(max-width:600px){.hero h1{font-size:1.4em}.grid{grid-template-columns:1fr}.skill-grid{grid-template-columns:1fr}}
</style>

{name:"pr-review",desc:"Structured PR review checklist"},

];

const CATS = {
  all:"All",
  core:"Core Development",
  languages:"Language Specialists",
  infra:"Infrastructure",
  quality:"Quality & Security",
  data:"Data & AI",
  dx:"Developer Experience",
  domain:"Specialized Domains",
  business:"Business & Product",
  manager:"Manager Toolkit",
  meta:"Meta & Orchestration",
  research:"Research & Analysis",
  skills:"Skills"
};

function render(data,cats){
  let html='';
  const sorted=Object.entries(cats).filter(([k])=>k!=='all');
  sorted.forEach(([cat,label])=>{
    let items;
    if(cat==='skills') items=data.skills.filter(s=>s.name.toLowerCase().includes(data.query));
    else items=data.agents.filter(a=>a.cat===cat&&a.name.toLowerCase().includes(data.query));
    if(!items.length) return;
    html+=`<section class="cat-section" data-cat="${cat}"><div class="cat-header">${label} <span class="count">${items.length} items</span></div>`;
    if(cat==='skills'){
      html+=`<div class="skill-grid">`;
      items.forEach(s=>{html+=`<div class="skill-card"><div class="name">@${s.name}</div><div class="desc">${s.desc}</div></div>`});
      html+=`</div>`;
    }else{
      html+=`<div class="grid">`;
      items.forEach(a=>{html+=`<div class="card"><div class="name">@${a.name}</div><div class="desc">${a.desc}</div><div class="meta"><span class="badge badge-${a.badge}">${a.badge}</span></div></div>`});
      html+=`</div>`;
    }
    html+=`</section>`;
  });
  return html;
}

let activeCat='all';
let query='';

function update(){
  const data={agents:AGENTS,skills:SKILLS,query:query.toLowerCase()};
  document.getElementById('content').innerHTML=render(data, activeCat==='all'?CATS:{[activeCat]:CATS[activeCat]});
  document.querySelectorAll('.cat-nav button').forEach(b=>b.classList.toggle('active',b.dataset.cat===activeCat));
}

document.getElementById('catNav').addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  activeCat=btn.dataset.cat;update();
});

document.getElementById('search').addEventListener('input',e=>{
  query=e.target.value;update();
});

update();
</script>
