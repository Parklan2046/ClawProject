[package]
name = "jumpjump_core"
version = "0.1.0"
edition = "2021"
description = "WASM core for 跳一跳 — pure physics, platform-gen, landing detection"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
