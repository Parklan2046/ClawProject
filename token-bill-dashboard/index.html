<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>token bill</title>
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg:        #0c0e13;
    --card:      #13161e;
    --border:    #1f2330;
    --border-hi: #2a3040;
    --text:      #d8dde8;
    --text-dim:  #6b7280;
    --text-mute: #4b5363;
    --accent:    #7aa2ff;
    --green:     #1edc8b;
    --yellow:    #f5b74e;
    --red:       #ef4a5d;
    --grey:      #3a4150;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.4; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .page { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; margin-bottom: 18px;
    background: linear-gradient(90deg, rgba(122,162,255,0.08), rgba(30,220,139,0.04) 50%, transparent);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .header .brand { display: flex; align-items: baseline; gap: 10px; }
  .header .brand .mark {
    font-size: 15px; font-weight: 700; letter-spacing: 0.6px;
    background: linear-gradient(135deg, #7aa2ff 0%, #1edc8b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .header .brand .count { font-size: 11px; color: var(--text-dim); letter-spacing: 0.3px; }
  .header .right { display: flex; align-items: center; gap: 14px; font-size: 11px; color: var(--text-dim); }
  .header .right .live { color: var(--green); display: flex; align-items: center; gap: 5px; }
  .header .right .live.err { color: var(--red); }
  .header .right .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
  .header .right a { font-size: 10px; padding: 3px 8px; border: 1px solid var(--border-hi); border-radius: 4px; color: var(--text-dim); }
  .header .right a:hover { color: var(--text); border-color: var(--text-dim); text-decoration: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .card .name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
  .card .name .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }
  .card .name .dot.err { background: var(--red); }
  .card .name .dot.warn { background: var(--yellow); }
  .card .name .dot.idle { background: var(--grey); }
  .card .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }

  .bar-row { display: flex; align-items: baseline; justify-content: space-between; margin: 10px 0 4px; }
  .bar-row .lbl { font-size: 12px; color: var(--text-dim); }
  .bar-row .pct { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; }
  .bar-row .pct.crit { color: var(--red); }
  .bar-row .pct.warn { color: var(--yellow); }
  .bar-row .pct.ok { color: var(--green); }

  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar > .fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.4s ease; }
  .bar > .fill.ok { background: var(--green); }
  .bar > .fill.warn { background: var(--yellow); }
  .bar > .fill.crit { background: var(--red); }
  .bar > .fill.idle { background: var(--grey); }

  .bar-sub { font-size: 11px; color: var(--text-mute); margin-top: 4px; }

  .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge.capped { background: var(--red); color: #fff; }
  .badge.ok     { background: var(--green); color: #0c0e13; }

  /* (footer removed; live state now in header) */

  .err-box { font-size: 11px; color: var(--red); background: rgba(239, 74, 93, 0.08); padding: 6px 8px; border-radius: 4px; margin-top: 8px; font-family: ui-monospace, "SF Mono", monospace; word-break: break-all; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="brand">
      <span class="mark">TOKEN BILL</span>
      <span class="count" id="account-count">— accounts</span>
    </div>
    <div class="right">
      <span id="last-sync">…</span>
      <span id="live-indicator" class="live">live</span>
      <a href="api/usage?refresh=1" target="_blank">refresh</a>
    </div>
  </div>
  <div id="grid" class="grid"></div>
</div>

<script>
const REFRESH_MS = 30 * 1000;
const grid = document.getElementById("grid");
const liveEl = document.getElementById("live-indicator");
const lastSync = document.getElementById("last-sync");
const accountCount = document.getElementById("account-count");

function classify(pct) {
  if (pct == null) return "idle";
  if (pct >= 90) return "crit";
  if (pct >= 70) return "warn";
  return "ok";
}
function pctText(v) { return v == null ? "—" : `${Math.round(v)}%`; }
function shortId(id) { if (!id) return null; return id.length > 14 ? id.slice(0, 6) + "…" + id.slice(-4) : id; }

function card(name, meta) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <div class="name">
      <span class="dot idle" data-dot></span>
      <span data-name>${name}</span>
      <span data-badge></span>
    </div>
    <div class="meta" data-meta>${meta || ""}</div>
    <div data-bars></div>
    <div data-extra></div>
  `;
  return div;
}

function addBar(cardEl, label, pct, sub, opts = {}) {
  const bars = cardEl.querySelector("[data-bars]");
  const wrap = document.createElement("div");
  const cls = opts.cls || classify(pct);
  const displayPct = opts.text || pctText(pct);
  const pctClass = cls;
  const labelHtml = `<div class="bar-row"><span class="lbl">${label}</span><span class="pct ${pctClass}">${displayPct}</span></div>`;
  const barHtml = `<div class="bar"><div class="fill ${cls}" style="width:${Math.max(0, Math.min(100, pct || 0))}%"></div></div>`;
  const subHtml = sub ? `<div class="bar-sub">${sub}</div>` : "";
  wrap.innerHTML = labelHtml + barHtml + subHtml;
  bars.appendChild(wrap);
}

function setDot(cardEl, cls) {
  const dot = cardEl.querySelector("[data-dot]");
  dot.className = "dot " + (cls || "idle");
}

function setMeta(cardEl, html) {
  cardEl.querySelector("[data-meta]").innerHTML = html;
}

function setBadge(cardEl, text, cls) {
  const b = cardEl.querySelector("[data-badge]");
  if (text) {
    b.innerHTML = `<span class="badge ${cls}">${text}</span>`;
  } else {
    b.innerHTML = "";
  }
}

function setExtra(cardEl, html) {
  const e = cardEl.querySelector("[data-extra]");
  if (html) {
    e.innerHTML = `<div class="err-box">${html}</div>`;
  } else {
    e.innerHTML = "";
  }
}
function appendExtra(cardEl, html) {
  const e = cardEl.querySelector("[data-extra]");
  e.insertAdjacentHTML("beforeend", html);
}

function errCard(name, err) {
  const c = card(name, "fetch failed");
  setDot(c, "err");
  setExtra(c, err || "no data");
  return c;
}

function renderChatgpt(d, err) {
  if (err || !d) return errCard("chatgpt-plus", err);
  const p = d.primary || {};
  const s = d.secondary || {};
  const c = card("chatgpt-plus", `plan ${d.planType || "?"} · ${d.activeLimit || "?"}`);
  setDot(c, p.usedPct >= 90 || s.usedPct >= 90 ? "crit" : (p.usedPct >= 70 || s.usedPct >= 70 ? "warn" : "ok"));
  addBar(c, "5h", p.usedPct, p.resetInHuman ? `resets in ${p.resetInHuman}` : null);
  addBar(c, "7d", s.usedPct, s.resetInHuman ? `resets in ${s.resetInHuman}` : null);
  return c;
}

function renderMinimax(d, err) {
  if (err || !d) return errCard("minimax", err);
  const m = (d.models && d.models.general) || {};
  const i = m.interval || {};
  const w = m.weekly || {};
  const boost = m.interval && m.interval.boostPermille ? ` · boost ${(m.interval.boostPermille/1000).toFixed(1)}x` : "";
  const c = card("minimax", `cn · text models${boost}`);
  setDot(c, i.usedPct >= 90 || w.usedPct >= 90 ? "crit" : (i.usedPct >= 70 || w.usedPct >= 70 ? "warn" : "ok"));
  addBar(c, "5h", i.usedPct, i.resetInHuman ? `resets in ${i.resetInHuman}` : null);
  addBar(c, "weekly", w.usedPct, w.resetInHuman ? `resets in ${w.resetInHuman}` : null);
  return c;
}

function renderOpencodeGo(slot, label, d, err) {
  if (err || !d) return errCard(label, err);
  const capped = d.status === "limit_reached";
  const hardcoded = d.status === "ok_hardcoded";
  const meta = (d.workspace ? `workspace ${shortId(d.workspace)}` : "workspace —")
    + (hardcoded ? ` · <span style="color:var(--yellow)" title="placeholder value from opencode.ai web UI snapshot — public API does not expose usage %">hardcoded</span>` : "");
  const c = card(label, meta);
  if (capped) {
    setDot(c, "crit");
    setBadge(c, "capped", "capped");
    addBar(c, "monthly", 100, `resets in ${d.monthly?.resetInHuman || "?"}`);
    if (d.upgradeUrl) {
      appendExtra(c, `<div style="margin-top:8px;font-size:12px;"><a href="${d.upgradeUrl}" target="_blank" rel="noopener">add balance →</a></div>`);
    }
  } else {
    setDot(c, "ok");
    setBadge(c, hardcoded ? "live*" : "ok", "ok");
    addBar(c, "monthly", d.monthly.usedPct, hardcoded ? "live % requires cookie auth" : "within quota");
  }
  return c;
}

function renderOpenrouter(d, err) {
  if (err || !d) return errCard("openrouter", err);
  const cr = d.credits || {};
  const sp = d.spend || {};
  const c = card("openrouter", `user ${shortId(d.accountId) || "?"} · ${d.isFreeTier ? "free" : "paid"}`);
  setDot(c, cr.usedPct >= 90 ? "crit" : (cr.usedPct >= 70 ? "warn" : "ok"));
  addBar(c, "credits", cr.usedPct, `$${(cr.remaining||0).toFixed(2)} of $${(cr.total||0).toFixed(0)} left`);
  // spend chips
  const chips = [];
  if (sp.daily != null) chips.push(`day $${sp.daily.toFixed(2)}`);
  if (sp.weekly != null) chips.push(`wk $${sp.weekly.toFixed(2)}`);
  if (sp.monthly != null) chips.push(`mo $${sp.monthly.toFixed(2)}`);
  if (sp.byokMonthly > 0) chips.push(`byok $${sp.byokMonthly.toFixed(2)}`);
  if (chips.length) {
    setMeta(c.querySelector("[data-meta]").parentElement, c.querySelector("[data-meta]").outerHTML);
  }
  return c;
}

async function load() {
  let payload;
  try {
    const r = await fetch("api/usage", { cache: "no-store" });
    payload = await r.json();
  } catch (e) {
    grid.innerHTML = "";
    grid.appendChild(errCard("network", e.message));
    liveEl.textContent = "offline";
    liveEl.className = "live err";
    accountCount.textContent = "—";
    return;
  }
  const errs = payload.errors || {};
  const data = payload.data || {};
  grid.innerHTML = "";
  if (data.chatgpt || errs.chatgpt)   grid.appendChild(renderChatgpt(data.chatgpt, errs.chatgpt));
  if (data.minimax || errs.minimax)   grid.appendChild(renderMinimax(data.minimax, errs.minimax));
  if (data.opencode_go_1 || errs.opencode_go_1) grid.appendChild(renderOpencodeGo("opencode_go_1", "opencode-go-1", data.opencode_go_1, errs.opencode_go_1));
  if (data.opencode_go_2 || errs.opencode_go_2) grid.appendChild(renderOpencodeGo("opencode_go_2", "opencode-go-2", data.opencode_go_2, errs.opencode_go_2));
  if (data.openrouter || errs.openrouter) grid.appendChild(renderOpenrouter(data.openrouter, errs.openrouter));

  // header
  const allOk = payload.ok;
  liveEl.textContent = allOk ? "live" : "partial";
  liveEl.className = "live" + (allOk ? "" : " err");
  const age = (Date.now() - new Date(payload.fetchedAt).getTime()) / 1000;
  lastSync.textContent = `synced ${age < 1 ? "just now" : age < 60 ? Math.floor(age) + "s ago" : Math.floor(age/60) + "m ago"}`;
  // count accounts that loaded (data + no error)
  const slots = ["chatgpt","minimax","opencode_go_1","opencode_go_2","openrouter"];
  const loaded = slots.filter(s => data[s] && !errs[s]).length;
  const capped = data.opencode_go_1 && data.opencode_go_1.status === "limit_reached" ? 1 : 0
               + (data.opencode_go_2 && data.opencode_go_2.status === "limit_reached" ? 1 : 0);
  const capNote = capped ? ` · ${capped} capped` : "";
  accountCount.textContent = `${loaded}/${slots.length} accounts${capNote}`;
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
