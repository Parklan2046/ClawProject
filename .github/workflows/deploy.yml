name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          port: 22
          timeout: 30s
          script: |
            echo "🚀 Starting automatic deployment..."
            cd /var/www/clawproject

            echo "📥 Pulling latest changes..."
            git pull origin main

            echo "🔑 Writing API key..."
            echo "OPENCODE_GO_API_KEY=${{ secrets.OPENCODE_GO_API_KEY }}" > stock-report/.env

            echo "✅ Successfully updated at $(date)"
            echo "📁 Current directory contents:"
            ls -la

            echo "🎉 Deployment completed! on9claw.com should be updated now."