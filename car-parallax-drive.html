<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari Lawrence Drive - Parallax</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Animation variables
        let time = 0;
        let scrollSpeed = 5;

        let skyOffset = 0;
        let hillOffset = 0;
        let treeOffset = 0;
        let groundOffset = 0;

        let wheelAngle = 0;
        let bob = 0;

        function drawSky() {
            const grad = ctx.createLinearGradient(0, 0, 0, height * 0.65);
            grad.addColorStop(0, '#1a2a4a');
            grad.addColorStop(0.35, '#ff6b3d');
            grad.addColorStop(0.6, '#ff9f1c');
            grad.addColorStop(1, '#ffd166');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height * 0.7);

            // Sun
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffeb3b';
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.arc(width * 0.78, height * 0.22, 45, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Clouds
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            for (let i = 0; i < 4; i++) {
                const x = (width * 0.15 * i + skyOffset * 0.08) % (width * 1.5);
                ctx.beginPath();
                ctx.ellipse(x, height * 0.18 + i*15, 90, 35, 0, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawHills() {
            // Distant hills
            ctx.fillStyle = '#1e5f3a';
            let hillY = height * 0.62;
            ctx.beginPath();
            ctx.moveTo(0, hillY);
            for (let x = 0; x <= width; x += 8) {
                ctx.lineTo(x, hillY - Math.sin((x + hillOffset)*0.004)*95);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();

            // Closer hills
            ctx.fillStyle = '#2a7d4a';
            ctx.beginPath();
            ctx.moveTo(0, hillY + 40);
            for (let x = 0; x <= width; x += 8) {
                ctx.lineTo(x, hillY + 40 - Math.sin((x + hillOffset*1.3)*0.007)*55);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
        }

        function drawTreesAndPoles() {
            const spacing = 140;
            for (let i = -3; i < Math.ceil(width / spacing) + 4; i++) {
                let x = (i * spacing + treeOffset * 1.6) % (width * 1.8) - spacing * 1.5;

                // Tree trunk
                ctx.fillStyle = '#3d2a1f';
                ctx.fillRect(x + 8, height * 0.65, 14, height * 0.28);

                // Foliage
                ctx.fillStyle = '#1e5f2a';
                ctx.beginPath();
                ctx.moveTo(x - 25, height * 0.68);
                ctx.quadraticCurveTo(x + 20, height * 0.42, x + 55, height * 0.68);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(x - 18, height * 0.78);
                ctx.quadraticCurveTo(x + 25, height * 0.55, x + 48, height * 0.78);
                ctx.fill();

                // Occasional poles
                if (i % 4 === 0) {
                    ctx.fillStyle = '#444';
                    ctx.fillRect(x + 85, height * 0.48, 10, height * 0.38);
                    ctx.fillRect(x + 70, height * 0.48, 40, 12);
                }
            }
        }

        function drawRoadAndGround() {
            // Grass
            ctx.fillStyle = '#1e5f2a';
            ctx.fillRect(0, height * 0.83, width, height);

            // Road
            ctx.fillStyle = '#222';
            ctx.fillRect(0, height * 0.8, width, height * 0.22);

            // White lines
            ctx.strokeStyle = '#eee';
            ctx.lineWidth = 5;
            ctx.setLineDash([30, 45]);
            ctx.beginPath();
            ctx.moveTo(0, height * 0.83);
            ctx.lineTo(width, height * 0.83);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, height * 0.97);
            ctx.lineTo(width, height * 0.97);
            ctx.stroke();
            ctx.setLineDash([]);

            // Yellow center line
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 9;
            ctx.setLineDash([50, 80]);
            ctx.lineDashOffset = -(groundOffset * 3.5) % 130;
            ctx.beginPath();
            ctx.moveTo(0, height * 0.9);
            ctx.lineTo(width, height * 0.9);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawCar() {
            const carX = width * 0.3;
            const carY = height * 0.72 + Math.sin(bob) * 4;

            // Shadow under car
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(carX + 75, carY + 38, 95, 14, 0, 0, Math.PI*2);
            ctx.fill();

            // Main body - Ferrari red with gradient
            const bodyGrad = ctx.createLinearGradient(carX, carY-60, carX, carY);
            bodyGrad.addColorStop(0, '#ff1e1e');
            bodyGrad.addColorStop(0.5, '#e60000');
            bodyGrad.addColorStop(1, '#b30000');
            ctx.fillStyle = bodyGrad;

            ctx.beginPath();
            // Sleek Ferrari-style body
            ctx.moveTo(carX - 10, carY - 25);
            ctx.quadraticCurveTo(carX + 10, carY - 55, carX + 65, carY - 58);  // hood
            ctx.quadraticCurveTo(carX + 125, carY - 55, carX + 175, carY - 32); // roof
            ctx.quadraticCurveTo(carX + 195, carY - 5, carX + 200, carY + 18); // rear
            ctx.lineTo(carX + 195, carY + 28);
            ctx.lineTo(carX - 5, carY + 30);
            ctx.closePath();
            ctx.fill();

            // Gloss highlight
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath();
            ctx.moveTo(carX + 15, carY - 48);
            ctx.quadraticCurveTo(carX + 55, carY - 52, carX + 110, carY - 35);
            ctx.lineTo(carX + 90, carY - 22);
            ctx.closePath();
            ctx.fill();

            // Windows
            ctx.fillStyle = '#112233';
            ctx.beginPath();
            ctx.moveTo(carX + 68, carY - 52);
            ctx.quadraticCurveTo(carX + 88, carY - 52, carX + 115, carY - 38);
            ctx.lineTo(carX + 145, carY - 22);
            ctx.lineTo(carX + 115, carY - 20);
            ctx.closePath();
            ctx.fill();

            // Lawrence text
            ctx.fillStyle = '#ffee00';
            ctx.font = 'bold 18px Arial';
            ctx.textBaseline = 'middle';
            ctx.fillText('Lawrence', carX + 45, carY + 8);

            // Wheels
            const wheelY = carY + 28;
            const r = 24;

            // Rear wheel
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(carX + 38, wheelY, r, 0, Math.PI * 2);
            ctx.fill();

            // Rim
            ctx.fillStyle = '#ccc';
            ctx.beginPath();
            ctx.arc(carX + 38, wheelY, r - 8, 0, Math.PI * 2);
            ctx.fill();

            // Front wheel
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(carX + 148, wheelY, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ccc';
            ctx.beginPath();
            ctx.arc(carX + 148, wheelY, r - 8, 0, Math.PI * 2);
            ctx.fill();

            // Spokes with rotation
            ctx.save();
            ctx.translate(carX + 38, wheelY);
            ctx.rotate(wheelAngle);
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 4;
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, r - 10);
                ctx.rotate(Math.PI * 2 / 6);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.translate(carX + 148, wheelY);
            ctx.rotate(wheelAngle);
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, r - 10);
                ctx.rotate(Math.PI * 2 / 6);
                ctx.stroke();
            }
            ctx.restore();

            // Headlight
            ctx.fillStyle = '#fff7cc';
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ffeb3b';
            ctx.fillRect(carX + 195, carY - 18, 18, 14);
            ctx.shadowBlur = 0;
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            time += 0.018;

            skyOffset -= scrollSpeed * 0.12;
            hillOffset -= scrollSpeed * 0.55;
            treeOffset -= scrollSpeed * 1.65;
            groundOffset -= scrollSpeed * 3.2;

            wheelAngle += scrollSpeed * 0.085;
            bob = time * 14;

            drawSky();
            drawHills();
            drawTreesAndPoles();
            drawRoadAndGround();
            drawCar();

            requestAnimationFrame(animate);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') scrollSpeed = Math.min(scrollSpeed + 1, 15);
            if (e.key === 'ArrowDown') scrollSpeed = Math.max(scrollSpeed - 1, 2);
        });

        animate();

        console.log('%c✅ Ferrari Lawrence Parallax Simulation Ready! ↑↓ adjust speed', 'color:#ff1e1e; font-weight:bold');
    </script>
</body>
</html>
