<!doctype html>
<html lang="zh-HK">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,viewport-fit=cover">
	<title>逆命大郎</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #07090c;
			--paper: #f1eadc;
			--muted: #a9a397;
			--red: #9f2d26;
			--gold: #c9a765;
			--gold-bright: #f0d49a;
		}
		* { box-sizing: border-box; }
		html, body, #canvas {
			width: 100%;
			height: 100%;
			margin: 0;
			border: 0;
			padding: 0;
		}
		body {
			overflow: hidden;
			background: var(--ink);
			color: var(--paper);
			touch-action: none;
		}
		#canvas {
			display: block;
			outline: none;
		}
		#status {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: grid;
			overflow: hidden;
			background: var(--ink);
			opacity: 1;
			transition: opacity 600ms ease;
		}
		#status::before {
			content: "";
			position: absolute;
			inset: 0;
			background:
				linear-gradient(180deg, rgba(3,5,8,.1) 25%, rgba(3,5,8,.22) 54%, rgba(3,5,8,.94) 100%),
				linear-gradient(90deg, rgba(3,5,8,.72), transparent 37%, transparent 68%, rgba(3,5,8,.34));
			z-index: 1;
		}
		#status.leaving {
			opacity: 0;
			pointer-events: none;
		}
		#status-splash {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
			transform: scale(1.035);
			filter: saturate(.82) contrast(1.06);
			animation: breathe 12s cubic-bezier(.2,.75,.25,1) both;
		}
		#status-grain {
			position: absolute;
			inset: 0;
			z-index: 2;
			opacity: .11;
			pointer-events: none;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
		}
		#status-atmosphere {
			position: absolute;
			inset: 0;
			z-index: 2;
			overflow: hidden;
			pointer-events: none;
		}
		.mist {
			position: absolute;
			left: -25%;
			width: 150%;
			height: 17%;
			border-radius: 50%;
			background: radial-gradient(ellipse at center, rgba(177,195,203,.16), rgba(79,97,107,.07) 48%, transparent 72%);
			filter: blur(18px);
			opacity: .62;
			animation: drift 18s ease-in-out infinite alternate;
		}
		.mist-a { top: 38%; }
		.mist-b { top: 57%; animation-duration: 25s; animation-direction: alternate-reverse; opacity: .42; }
		#status-embers {
			position: absolute;
			inset: 46% 0 0;
			opacity: .7;
			background-image:
				radial-gradient(circle, rgba(255,177,84,.95) 0 1px, transparent 1.8px),
				radial-gradient(circle, rgba(190,61,37,.9) 0 1px, transparent 1.7px);
			background-size: 137px 173px, 211px 149px;
			background-position: 20px 0, 90px 30px;
			animation: embers 10s linear infinite;
			mask-image: linear-gradient(90deg, #000, transparent 47%, transparent 60%, #000);
		}
		#status-copy {
			position: absolute;
			z-index: 3;
			top: clamp(52px, 8vh, 90px);
			left: clamp(38px, 6.2vw, 108px);
			text-align: left;
			text-shadow: 0 2px 28px rgba(0,0,0,.9);
		}
		#status-seal {
			display: inline-grid;
			width: 42px;
			height: 42px;
			margin-bottom: 19px;
			place-items: center;
			border: 1px solid rgba(245,213,157,.72);
			background: rgba(140,35,28,.9);
			box-shadow: inset 0 0 0 3px rgba(65,11,9,.32), 0 8px 25px rgba(0,0,0,.28);
			font: 600 20px/1 "Noto Serif TC","Songti TC","PMingLiU",serif;
			transform: rotate(-2deg);
		}
		#status-kicker {
			display: inline-block;
			margin: 0 0 0 13px;
			color: var(--gold-bright);
			font: 600 10px/1 "Noto Sans TC","Microsoft JhengHei",sans-serif;
			letter-spacing: .3em;
			vertical-align: 17px;
		}
		#status-title {
			margin: 0;
			max-width: 3.2em;
			font: 700 clamp(56px, 7vw, 104px)/.9 "Noto Serif TC","Songti TC","PMingLiU",serif;
			letter-spacing: .08em;
			text-wrap: balance;
			background: linear-gradient(180deg, #fff8e8 5%, #d9c49b 76%, #977847);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			filter: drop-shadow(0 5px 1px rgba(0,0,0,.28));
		}
		#status-subtitle {
			margin: 18px 0 0 3px;
			color: rgba(238,232,220,.76);
			font: 500 12px/1.4 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
			letter-spacing: .34em;
		}
		#status-subtitle::before {
			content: "";
			display: inline-block;
			width: 38px;
			height: 1px;
			margin-right: 12px;
			background: var(--red);
			vertical-align: middle;
		}
		#status-loader {
			position: absolute;
			z-index: 3;
			right: clamp(38px, 6.2vw, 108px);
			bottom: max(45px, calc(env(safe-area-inset-bottom) + 32px));
			width: min(540px, calc(100vw - 76px));
			font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
		}
		#status-episode {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 17px;
			color: var(--gold-bright);
			font-size: 10px;
			font-weight: 600;
			letter-spacing: .28em;
		}
		#status-episode::after {
			content: "";
			flex: 1;
			height: 1px;
			background: linear-gradient(90deg, rgba(201,167,101,.55), transparent);
		}
		#status-meta {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			margin-bottom: 14px;
			color: rgba(238,232,220,.78);
			font-size: 12px;
			letter-spacing: .14em;
		}
		#status-percent {
			color: var(--gold-bright);
			font: 500 22px/1 "Noto Serif TC","Songti TC",serif;
			letter-spacing: .02em;
		}
		#status-track {
			position: relative;
			height: 3px;
			overflow: visible;
			background: rgba(238,232,220,.16);
			box-shadow: 0 1px 0 rgba(0,0,0,.7);
		}
		#status-progress {
			position: absolute;
			inset: 0 auto 0 0;
			width: 0;
			background: linear-gradient(90deg, #6f1714, #bd493b 58%, #e1a05d);
			box-shadow: 0 0 20px rgba(189,68,57,.76);
			transition: width 180ms ease-out;
		}
		#status-progress::after {
			content: "";
			position: absolute;
			top: 50%;
			right: -3px;
			width: 8px;
			height: 8px;
			background: #f1cf8b;
			box-shadow: 0 0 18px rgba(240,179,90,.95);
			transform: translateY(-50%) rotate(45deg);
		}
		#status-chapter {
			margin: 12px 0 0;
			color: var(--muted);
			font-size: 11px;
			letter-spacing: .16em;
			text-align: left;
		}
		#status-hint {
			margin: 18px 0 0;
			padding-top: 14px;
			border-top: 1px solid rgba(238,232,220,.1);
			color: rgba(238,232,220,.48);
			font-size: 10px;
			line-height: 1.55;
			letter-spacing: .08em;
		}
		#status-notice {
			display: none;
			position: absolute;
			z-index: 5;
			left: 50%;
			bottom: 12%;
			width: min(520px, calc(100vw - 40px));
			padding: 18px 22px;
			border: 1px solid rgba(189,68,57,.7);
			background: rgba(8,11,15,.94);
			color: var(--paper);
			font: 14px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif;
			text-align: center;
			transform: translateX(-50%);
		}
		@keyframes breathe {
			from { transform: scale(1.065) translate3d(-.5%, 0, 0); }
			to { transform: scale(1.035) translate3d(.25%, 0, 0); }
		}
		@keyframes drift {
			from { transform: translate3d(-4%, 0, 0) scale(1); }
			to { transform: translate3d(5%, -10%, 0) scale(1.06); }
		}
		@keyframes embers {
			from { transform: translate3d(0, 8%, 0); }
			to { transform: translate3d(1%, -12%, 0); }
		}
		@media (max-width: 600px) {
			#status::before {
				background: linear-gradient(180deg, rgba(3,5,8,.12) 20%, rgba(3,5,8,.9) 100%);
			}
			#status-splash {
				object-position: 50% center;
			}
			#status-copy {
				top: max(28px, calc(env(safe-area-inset-top) + 20px));
				left: 24px;
			}
			#status-seal {
				width: 34px;
				height: 34px;
				margin-bottom: 10px;
				font-size: 17px;
			}
			#status-title {
				max-width: none;
				font-size: clamp(45px, 13vw, 58px);
				letter-spacing: .06em;
			}
			#status-subtitle {
				margin-top: 11px;
				font-size: 10px;
			}
			#status-kicker {
				vertical-align: 14px;
				font-size: 8px;
			}
			#status-loader {
				right: 24px;
				bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px));
				width: calc(100vw - 48px);
			}
			#status-meta {
				font-size: 11px;
			}
			#status-hint { display: none; }
			#status-episode { margin-bottom: 12px; }
		}
		@media (prefers-reduced-motion: reduce) {
			#status-splash, .mist, #status-embers { animation: none; }
			#status, #status-progress { transition: none; }
		}
	</style>
	<meta name="theme-color" content="#090b0e"><meta name="description" content="逆命大郎 Godot 網頁版">
</head>
<body>
	<canvas id="canvas">你的瀏覽器不支援 Canvas。</canvas>
	<noscript>你的瀏覽器需要啟用 JavaScript 才能進入江湖。</noscript>
	<div id="status" aria-live="polite">
		<picture>
			<source media="(max-width: 600px)" srcset="loading-mobile-v1.png">
			<img id="status-splash" src="index.png" alt="">
		</picture>
		<div id="status-grain"></div>
		<div id="status-atmosphere" aria-hidden="true">
			<div class="mist mist-a"></div>
			<div class="mist mist-b"></div>
			<div id="status-embers"></div>
		</div>
		<header id="status-copy">
			<div><span id="status-seal">逆</span><span id="status-kicker">一餅起家 · 一命重寫</span></div>
			<h1 id="status-title">逆命大郎</h1>
			<p id="status-subtitle">北宋商戰武俠 RPG</p>
		</header>
		<section id="status-loader">
			<div id="status-episode">序章 · 死局重生</div>
			<div id="status-meta">
				<span id="status-state">正在升起爐火</span>
				<span><strong id="status-percent">0%</strong> · <span id="status-time">估算時間中</span></span>
			</div>
			<div id="status-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
				<div id="status-progress"></div>
			</div>
			<p id="status-chapter">陽谷縣 · 景陽岡下</p>
			<p id="status-hint">提示：恩義換來人心，把柄只能換來一時服從。</p>
		</section>
		<div id="status-notice"></div>
	</div>
	<script src="index.js"></script>
	<script>
	const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":15997232,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	const engine = new Engine(GODOT_CONFIG);

	(() => {
		const overlay = document.getElementById("status");
		const loader = document.getElementById("status-loader");
		const notice = document.getElementById("status-notice");
		const fill = document.getElementById("status-progress");
		const track = document.getElementById("status-track");
		const percent = document.getElementById("status-percent");
		const time = document.getElementById("status-time");
		const state = document.getElementById("status-state");
		const startedAt = performance.now();
		let smoothedRate = 0;
		let lastCurrent = 0;
		let lastTime = startedAt;

		function updateProgress(current, total) {
			if (!(current > 0 && total > 0)) {
				state.textContent = "正在點燃炊餅爐火";
				return;
			}
			const now = performance.now();
			const elapsed = Math.max((now - lastTime) / 1000, .05);
			const instantRate = Math.max(current - lastCurrent, 0) / elapsed;
			if (instantRate > 0) {
				smoothedRate = smoothedRate ? smoothedRate * .78 + instantRate * .22 : instantRate;
			}
			lastCurrent = current;
			lastTime = now;
			const ratio = Math.min(Math.max(current / total, 0), 1);
			const value = Math.round(ratio * 100);
			fill.style.width = value + "%";
			track.setAttribute("aria-valuenow", String(value));
			percent.textContent = value + "%";
			state.textContent = value < 22 ? "正在展開陽谷縣輿圖" : value < 48 ? "正在清點商盟貨物" : value < 76 ? "正在召集江湖人物" : "正在改寫大郎命數";
			if (smoothedRate > 0 && ratio < .995) {
				const remaining = Math.max(Math.ceil((total - current) / smoothedRate), 1);
				time.textContent = remaining > 60 ? "剩餘約 " + Math.ceil(remaining / 60) + " 分鐘" : "剩餘約 " + remaining + " 秒";
			} else {
				time.textContent = ratio >= .995 ? "即將完成" : "估算時間中";
			}
		}

		function showFailure(error) {
			console.error(error);
			loader.style.display = "none";
			notice.style.display = "block";
			notice.textContent = "命運之門暫時無法開啟，請重新整理頁面再試。" + (error && error.message ? " " + error.message : "");
		}

		if (new URLSearchParams(location.search).has("loading-preview")) {
			const previewTotal = 1000;
			updateProgress(680, previewTotal);
			state.textContent = "正在召集江湖人物";
			time.textContent = "剩餘約 4 秒";
			return;
		}

		engine.startGame({ onProgress: updateProgress }).then(() => {
			fill.style.width = "100%";
			percent.textContent = "100%";
			time.textContent = "門扉已開";
			state.textContent = "命運已改寫";
			setTimeout(() => {
				overlay.classList.add("leaving");
				setTimeout(() => overlay.remove(), 620);
			}, 260);
		}, showFailure);
	})();
	</script>
</body>
</html>
