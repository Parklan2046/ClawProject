<!doctype html>
<html lang="zh-HK">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,viewport-fit=cover">
	<title>俠客行</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #080b0f;
			--paper: #eee8dc;
			--muted: #aaa59b;
			--red: #bd4439;
		}
		* { box-sizing: border-box; }
		html, body, #canvas {
			width: 100%;
			height: 100%;
			margin: 0;
			border: 0;
			padding: 0;
		}
		body {
			overflow: hidden;
			background: var(--ink);
			color: var(--paper);
			touch-action: none;
		}
		#canvas {
			display: block;
			outline: none;
		}
		#status {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: grid;
			overflow: hidden;
			background: var(--ink);
			opacity: 1;
			transition: opacity 600ms ease;
		}
		#status::before {
			content: "";
			position: absolute;
			inset: 0;
			background:
				linear-gradient(180deg, rgba(3,5,8,.06) 30%, rgba(3,5,8,.88) 100%),
				linear-gradient(90deg, rgba(3,5,8,.25), transparent 38%, transparent 62%, rgba(3,5,8,.25));
			z-index: 1;
		}
		#status.leaving {
			opacity: 0;
			pointer-events: none;
		}
		#status-splash {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
			transform: scale(1.02);
			animation: breathe 8s ease-out both;
		}
		#status-grain {
			position: absolute;
			inset: 0;
			z-index: 2;
			opacity: .11;
			pointer-events: none;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
		}
		#status-copy {
			position: relative;
			z-index: 3;
			align-self: start;
			justify-self: center;
			margin-top: clamp(34px, 6vh, 72px);
			text-align: center;
			text-shadow: 0 2px 28px rgba(0,0,0,.9);
		}
		#status-seal {
			display: inline-grid;
			width: 40px;
			height: 40px;
			margin-bottom: 14px;
			place-items: center;
			border: 1px solid rgba(238,232,220,.62);
			background: rgba(145,39,32,.88);
			font: 500 20px/1 "Noto Serif TC","Songti TC","PMingLiU",serif;
		}
		#status-title {
			margin: 0;
			font: 300 clamp(42px, 5.5vw, 78px)/1.05 "Noto Serif TC","Songti TC","PMingLiU",serif;
			letter-spacing: .28em;
			text-indent: .28em;
		}
		#status-subtitle {
			margin: 13px 0 0;
			color: rgba(238,232,220,.76);
			font: 400 12px/1.4 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
			letter-spacing: .42em;
			text-indent: .42em;
		}
		#status-loader {
			position: relative;
			z-index: 3;
			align-self: end;
			justify-self: center;
			width: min(560px, calc(100vw - 48px));
			margin-bottom: max(44px, calc(env(safe-area-inset-bottom) + 30px));
			font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
		}
		#status-meta {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			margin-bottom: 12px;
			color: rgba(238,232,220,.78);
			font-size: 12px;
			letter-spacing: .14em;
		}
		#status-percent {
			color: var(--paper);
			font: 300 22px/1 "Noto Serif TC","Songti TC",serif;
			letter-spacing: .02em;
		}
		#status-track {
			position: relative;
			height: 2px;
			overflow: visible;
			background: rgba(238,232,220,.22);
		}
		#status-progress {
			position: absolute;
			inset: 0 auto 0 0;
			width: 0;
			background: var(--red);
			box-shadow: 0 0 18px rgba(189,68,57,.9);
			transition: width 180ms ease-out;
		}
		#status-progress::after {
			content: "";
			position: absolute;
			top: 50%;
			right: -3px;
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: #f0b3aa;
			box-shadow: 0 0 16px rgba(240,179,170,.95);
			transform: translateY(-50%);
		}
		#status-chapter {
			margin: 12px 0 0;
			color: var(--muted);
			font-size: 11px;
			letter-spacing: .16em;
			text-align: center;
		}
		#status-notice {
			display: none;
			position: absolute;
			z-index: 5;
			left: 50%;
			bottom: 12%;
			width: min(520px, calc(100vw - 40px));
			padding: 18px 22px;
			border: 1px solid rgba(189,68,57,.7);
			background: rgba(8,11,15,.94);
			color: var(--paper);
			font: 14px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif;
			text-align: center;
			transform: translateX(-50%);
		}
		@keyframes breathe {
			from { transform: scale(1.06); }
			to { transform: scale(1.02); }
		}
		@media (max-width: 600px) {
			#status::before {
				background: linear-gradient(180deg, rgba(3,5,8,.12) 20%, rgba(3,5,8,.9) 100%);
			}
			#status-splash {
				object-position: 50% center;
			}
			#status-copy {
				margin-top: max(30px, calc(env(safe-area-inset-top) + 22px));
			}
			#status-seal {
				width: 34px;
				height: 34px;
				margin-bottom: 10px;
				font-size: 17px;
			}
			#status-title {
				font-size: clamp(38px, 13vw, 54px);
			}
			#status-loader {
				margin-bottom: max(36px, calc(env(safe-area-inset-bottom) + 24px));
			}
			#status-meta {
				font-size: 11px;
			}
		}
		@media (prefers-reduced-motion: reduce) {
			#status-splash { animation: none; }
			#status, #status-progress { transition: none; }
		}
	</style>
	<meta name="theme-color" content="#090b0e"><meta name="description" content="俠客行 Godot 網頁版登入門面">
</head>
<body>
	<canvas id="canvas">你的瀏覽器不支援 Canvas。</canvas>
	<noscript>你的瀏覽器需要啟用 JavaScript 才能進入江湖。</noscript>
	<div id="status" aria-live="polite">
		<picture>
			<source media="(max-width: 600px)" srcset="loading-mobile-v1.png">
			<img id="status-splash" src="index.png" alt="">
		</picture>
		<div id="status-grain"></div>
		<header id="status-copy">
			<div id="status-seal">俠</div>
			<h1 id="status-title">俠客行</h1>
			<p id="status-subtitle">江湖載入中</p>
		</header>
		<section id="status-loader">
			<div id="status-meta">
				<span id="status-state">正在整理行囊</span>
				<span><strong id="status-percent">0%</strong> · <span id="status-time">估算時間中</span></span>
			</div>
			<div id="status-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
				<div id="status-progress"></div>
			</div>
			<p id="status-chapter">第一章 · 青石鎮</p>
		</section>
		<div id="status-notice"></div>
	</div>
	<script src="index.js"></script>
	<script>
	const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":15994896,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	const engine = new Engine(GODOT_CONFIG);

	(() => {
		const overlay = document.getElementById("status");
		const loader = document.getElementById("status-loader");
		const notice = document.getElementById("status-notice");
		const fill = document.getElementById("status-progress");
		const track = document.getElementById("status-track");
		const percent = document.getElementById("status-percent");
		const time = document.getElementById("status-time");
		const state = document.getElementById("status-state");
		const startedAt = performance.now();
		let smoothedRate = 0;
		let lastCurrent = 0;
		let lastTime = startedAt;

		function updateProgress(current, total) {
			if (!(current > 0 && total > 0)) {
				state.textContent = "正在喚醒江湖";
				return;
			}
			const now = performance.now();
			const elapsed = Math.max((now - lastTime) / 1000, .05);
			const instantRate = Math.max(current - lastCurrent, 0) / elapsed;
			if (instantRate > 0) {
				smoothedRate = smoothedRate ? smoothedRate * .78 + instantRate * .22 : instantRate;
			}
			lastCurrent = current;
			lastTime = now;
			const ratio = Math.min(Math.max(current / total, 0), 1);
			const value = Math.round(ratio * 100);
			fill.style.width = value + "%";
			track.setAttribute("aria-valuenow", String(value));
			percent.textContent = value + "%";
			state.textContent = value < 22 ? "正在展開江湖畫卷" : value < 72 ? "正在載入俠客記憶" : "正在推開青石鎮門";
			if (smoothedRate > 0 && ratio < .995) {
				const remaining = Math.max(Math.ceil((total - current) / smoothedRate), 1);
				time.textContent = remaining > 60 ? "剩餘約 " + Math.ceil(remaining / 60) + " 分鐘" : "剩餘約 " + remaining + " 秒";
			} else {
				time.textContent = ratio >= .995 ? "即將完成" : "估算時間中";
			}
		}

		function showFailure(error) {
			console.error(error);
			loader.style.display = "none";
			notice.style.display = "block";
			notice.textContent = "江湖暫時無法開啟。請重新整理頁面再試。" + (error && error.message ? " " + error.message : "");
		}

		engine.startGame({ onProgress: updateProgress }).then(() => {
			fill.style.width = "100%";
			percent.textContent = "100%";
			time.textContent = "門扉已開";
			state.textContent = "歡迎來到江湖";
			setTimeout(() => {
				overlay.classList.add("leaving");
				setTimeout(() => overlay.remove(), 620);
			}, 260);
		}, showFailure);
	})();
	</script>
</body>
</html>
