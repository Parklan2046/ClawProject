<!doctype html>
<html lang="zh-HK">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,viewport-fit=cover">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #07090c;
			--paper: #f1eadc;
			--muted: #a9a397;
			--red: #9f2d26;
			--gold: #c9a765;
			--gold-bright: #f0d49a;
		}
		* { box-sizing: border-box; }
		html, body, #canvas {
			width: 100%;
			height: 100%;
			margin: 0;
			border: 0;
			padding: 0;
		}
		body {
			overflow: hidden;
			background: var(--ink);
			color: var(--paper);
			touch-action: none;
		}
		#canvas {
			display: block;
			outline: none;
		}
		#status {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: grid;
			overflow: hidden;
			background: var(--ink);
			opacity: 1;
			transition: opacity 600ms ease;
		}
		#status::before {
			content: "";
			position: absolute;
			inset: 0;
			background:
				linear-gradient(180deg, rgba(3,5,8,.1) 25%, rgba(3,5,8,.22) 54%, rgba(3,5,8,.94) 100%),
				linear-gradient(90deg, rgba(3,5,8,.72), transparent 37%, transparent 68%, rgba(3,5,8,.34));
			z-index: 1;
		}
		#status.leaving {
			opacity: 0;
			pointer-events: none;
		}
		#status-splash {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
			transform: scale(1.035);
			filter: saturate(.82) contrast(1.06);
			animation: breathe 12s cubic-bezier(.2,.75,.25,1) both;
		}
		#status-grain {
			position: absolute;
			inset: 0;
			z-index: 2;
			opacity: .11;
			pointer-events: none;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
		}
		#status-atmosphere {
			position: absolute;
			inset: 0;
			z-index: 2;
			overflow: hidden;
			pointer-events: none;
		}
		.mist {
			position: absolute;
			left: -25%;
			width: 150%;
			height: 17%;
			border-radius: 50%;
			background: radial-gradient(ellipse at center, rgba(177,195,203,.16), rgba(79,97,107,.07) 48%, transparent 72%);
			filter: blur(18px);
			opacity: .62;
			animation: drift 18s ease-in-out infinite alternate;
		}
		.mist-a { top: 38%; }
		.mist-b { top: 57%; animation-duration: 25s; animation-direction: alternate-reverse; opacity: .42; }
		#status-embers {
			position: absolute;
			inset: 46% 0 0;
			opacity: .7;
			background-image:
				radial-gradient(circle, rgba(255,177,84,.95) 0 1px, transparent 1.8px),
				radial-gradient(circle, rgba(190,61,37,.9) 0 1px, transparent 1.7px);
			background-size: 137px 173px, 211px 149px;
			background-position: 20px 0, 90px 30px;
			animation: embers 10s linear infinite;
			mask-image: linear-gradient(90deg, #000, transparent 47%, transparent 60%, #000);
		}
		#status-copy {
			position: absolute;
			z-index: 3;
			top: clamp(52px, 8vh, 90px);
			left: clamp(38px, 6.2vw, 108px);
			text-align: left;
			text-shadow: 0 2px 28px rgba(0,0,0,.9);
		}
		#status-seal {
			display: inline-grid;
			width: 42px;
			height: 42px;
			margin-bottom: 19px;
			place-items: center;
			border: 1px solid rgba(245,213,157,.72);
			background: rgba(140,35,28,.9);
			box-shadow: inset 0 0 0 3px rgba(65,11,9,.32), 0 8px 25px rgba(0,0,0,.28);
			font: 600 20px/1 "Noto Serif TC","Songti TC","PMingLiU",serif;
			transform: rotate(-2deg);
		}
		#status-kicker {
			display: inline-block;
			margin: 0 0 0 13px;
			color: var(--gold-bright);
			font: 600 10px/1 "Noto Sans TC","Microsoft JhengHei",sans-serif;
			letter-spacing: .3em;
			vertical-align: 17px;
		}
		#status-title {
			margin: 0;
			max-width: 3.2em;
			font: 700 clamp(56px, 7vw, 104px)/.9 "Noto Serif TC","Songti TC","PMingLiU",serif;
			letter-spacing: .08em;
			text-wrap: balance;
			background: linear-gradient(180deg, #fff8e8 5%, #d9c49b 76%, #977847);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			filter: drop-shadow(0 5px 1px rgba(0,0,0,.28));
		}
		#status-subtitle {
			margin: 18px 0 0 3px;
			color: rgba(238,232,220,.76);
			font: 500 12px/1.4 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
			letter-spacing: .34em;
		}
		#status-subtitle::before {
			content: "";
			display: inline-block;
			width: 38px;
			height: 1px;
			margin-right: 12px;
			background: var(--red);
			vertical-align: middle;
		}
		#status-loader {
			position: absolute;
			z-index: 3;
			right: clamp(38px, 6.2vw, 108px);
			bottom: max(45px, calc(env(safe-area-inset-bottom) + 32px));
			width: min(540px, calc(100vw - 76px));
			font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
		}
		#status-episode {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 17px;
			color: var(--gold-bright);
			font-size: 10px;
			font-weight: 600;
			letter-spacing: .28em;
		}
		#status-episode::after {
			content: "";
			flex: 1;
			height: 1px;
			background: linear-gradient(90deg, rgba(201,167,101,.55), transparent);
		}
		#status-meta {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			margin-bottom: 14px;
			color: rgba(238,232,220,.78);
			font-size: 12px;
			letter-spacing: .14em;
		}
		#status-percent {
			color: var(--gold-bright);
			font: 500 22px/1 "Noto Serif TC","Songti TC",serif;
			letter-spacing: .02em;
		}
		#status-track {
			position: relative;
			height: 3px;
			overflow: visible;
			background: rgba(238,232,220,.16);
			box-shadow: 0 1px 0 rgba(0,0,0,.7);
		}
		#status-progress {
			position: absolute;
			inset: 0 auto 0 0;
			width: 0;
			background: linear-gradient(90deg, #6f1714, #bd493b 58%, #e1a05d);
			box-shadow: 0 0 20px rgba(189,68,57,.76);
			transition: width 180ms ease-out;
		}
		#status-progress::after {
			content: "";
			position: absolute;
			top: 50%;
			right: -3px;
			width: 8px;
			height: 8px;
			background: #f1cf8b;
			box-shadow: 0 0 18px rgba(240,179,90,.95);
			transform: translateY(-50%) rotate(45deg);
		}
		#status-chapter {
			margin: 12px 0 0;
			color: var(--muted);
			font-size: 11px;
			letter-spacing: .16em;
			text-align: left;
		}
		#status-hint {
			margin: 18px 0 0;
			padding-top: 14px;
			border-top: 1px solid rgba(238,232,220,.1);
			color: rgba(238,232,220,.48);
			font-size: 10px;
			line-height: 1.55;
			letter-spacing: .08em;
		}
		#status-audio {
			position: absolute;
			z-index: 4;
			top: max(22px, calc(env(safe-area-inset-top) + 16px));
			right: clamp(24px, 4vw, 64px);
			min-width: 138px;
			padding: 10px 14px;
			border: 1px solid rgba(201,167,101,.5);
			border-radius: 999px;
			background: rgba(7,9,12,.68);
			color: rgba(241,234,220,.82);
			font: 500 11px/1 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
			letter-spacing: .08em;
			backdrop-filter: blur(10px);
			cursor: pointer;
			transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
		}
		#status-audio:hover,
		#status-audio[aria-pressed="true"] {
			border-color: rgba(240,212,154,.9);
			background: rgba(111,23,20,.78);
			color: #fff8e8;
		}
		#status-notice {
			display: none;
			position: absolute;
			z-index: 5;
			left: 50%;
			bottom: 12%;
			width: min(520px, calc(100vw - 40px));
			padding: 18px 22px;
			border: 1px solid rgba(189,68,57,.7);
			background: rgba(8,11,15,.94);
			color: var(--paper);
			font: 14px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif;
			text-align: center;
			transform: translateX(-50%);
		}
		@keyframes breathe {
			from { transform: scale(1.065) translate3d(-.5%, 0, 0); }
			to { transform: scale(1.035) translate3d(.25%, 0, 0); }
		}
		@keyframes drift {
			from { transform: translate3d(-4%, 0, 0) scale(1); }
			to { transform: translate3d(5%, -10%, 0) scale(1.06); }
		}
		@keyframes embers {
			from { transform: translate3d(0, 8%, 0); }
			to { transform: translate3d(1%, -12%, 0); }
		}
		@media (max-width: 600px) {
			#status::before {
				background: linear-gradient(180deg, rgba(3,5,8,.12) 20%, rgba(3,5,8,.9) 100%);
			}
			#status-splash {
				object-position: 50% center;
			}
			#status-copy {
				top: max(28px, calc(env(safe-area-inset-top) + 20px));
				left: 24px;
			}
			#status-seal {
				width: 34px;
				height: 34px;
				margin-bottom: 10px;
				font-size: 17px;
			}
			#status-title {
				max-width: none;
				font-size: clamp(45px, 13vw, 58px);
				letter-spacing: .06em;
			}
			#status-subtitle {
				margin-top: 11px;
				font-size: 10px;
			}
			#status-kicker {
				vertical-align: 14px;
				font-size: 8px;
			}
			#status-loader {
				right: 24px;
				bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px));
				width: calc(100vw - 48px);
			}
			#status-meta {
				font-size: 11px;
			}
			#status-hint { display: none; }
			#status-episode { margin-bottom: 12px; }
			#status-audio {
				top: max(18px, calc(env(safe-area-inset-top) + 12px));
				right: 16px;
				min-width: 0;
				padding: 9px 12px;
				font-size: 10px;
			}
		}
		@media (prefers-reduced-motion: reduce) {
			#status-splash, .mist, #status-embers { animation: none; }
			#status, #status-progress { transition: none; }
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">你的瀏覽器不支援 Canvas。</canvas>
	<noscript>你的瀏覽器需要啟用 JavaScript 才能進入江湖。</noscript>
	<audio id="niming-ost" preload="auto" autoplay loop playsinline>
		<source src="guzheng-theme.mp3?v=3076930" type="audio/mpeg">
	</audio>
	<audio id="niming-story-modern" preload="auto" loop playsinline src="audio/prologue/s1.mp3?v=4782426"></audio>
	<audio id="niming-story-song" preload="auto" loop playsinline src="audio/prologue/s2.mp3?v=2603541"></audio>
	<div id="status" aria-live="polite">
		<button id="status-audio" type="button" aria-pressed="false">♫ 播放古箏配樂</button>
		<picture>
			<source media="(max-width: 600px)" srcset="loading-mobile-v1.png">
			<img id="status-splash" src="$GODOT_SPLASH" alt="">
		</picture>
		<div id="status-grain"></div>
		<div id="status-atmosphere" aria-hidden="true">
			<div class="mist mist-a"></div>
			<div class="mist mist-b"></div>
			<div id="status-embers"></div>
		</div>
		<header id="status-copy">
			<div><span id="status-seal">逆</span><span id="status-kicker">一餅起家 · 一命重寫</span></div>
			<h1 id="status-title">逆命大郎</h1>
			<p id="status-subtitle">北宋商戰武俠 RPG</p>
		</header>
		<section id="status-loader">
			<div id="status-episode">序章 · 死局重生</div>
			<div id="status-meta">
				<span id="status-state">正在升起爐火</span>
				<span><strong id="status-percent">0%</strong> · <span id="status-time">估算時間中</span></span>
			</div>
			<div id="status-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
				<div id="status-progress"></div>
			</div>
			<p id="status-chapter">陽谷縣 · 景陽岡下</p>
			<p id="status-hint">提示：恩義換來人心，把柄只能換來一時服從。</p>
		</section>
		<div id="status-notice"></div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
	const GODOT_CONFIG = $GODOT_CONFIG;
	const engine = new Engine(GODOT_CONFIG);

	// Cache-bust the heavy Godot assets (.pck / .wasm / audio worklets) so a
	// new deploy actually reaches players — iPhone Safari otherwise caches the
	// 55 MB bundle indefinitely. The stamp is derived from GODOT_CONFIG.fileSizes,
	// which Godot regenerates on every export, so the query string changes the
	// moment the build content changes.
	(() => {
		const sizes = GODOT_CONFIG.fileSizes || {};
		const version = (sizes["index.pck"] || 0) + "-" + (sizes["index.wasm"] || 0);
		const bustable = /\.(pck|wasm|worklet\.js)(\?.*)?$/i;
		const stamp = (url) => {
			if (typeof url !== "string" || !bustable.test(url)) return url;
			const sep = url.indexOf("?") === -1 ? "?" : "&";
			return url + sep + "v=" + version;
		};
		const origFetch = window.fetch;
		if (origFetch) {
			window.fetch = function (input, init) {
				if (typeof input === "string") input = stamp(input);
				return origFetch.call(this, input, init);
			};
		}
		const origOpen = XMLHttpRequest.prototype.open;
		XMLHttpRequest.prototype.open = function (method, url, ...rest) {
			return origOpen.call(this, method, stamp(url), ...rest);
		};
	})();

	// Two unlocked HTML audio channels allow the modern office and Song-house
	// themes to overlap briefly during the time-travel crossfade on iOS Safari.
	(() => {
		class NimingStoryMusic {
			constructor(modern, song) {
				this.tracks = { modern, song };
				this.baseVolumes = { modern: .20, song: .22 };
				this.activeId = "";
				this.unlocked = false;
				this.animations = new Map();
				this.duckTimer = 0;
				Object.values(this.tracks).forEach(audio => {
					audio.volume = 0;
					audio.loop = true;
				});
			}

			unlock() {
				if (this.unlocked) return;
				this.unlocked = true;
				Object.values(this.tracks).forEach(audio => {
					audio.muted = true;
					audio.volume = 0;
					const attempt = audio.play();
					if (attempt) {
						attempt.then(() => {
							audio.pause();
							audio.currentTime = 0;
							audio.muted = false;
						}).catch(() => {
							audio.muted = false;
						});
					}
				});
			}

			playTrack(id, fadeSeconds = 1.5) {
				const incoming = this.tracks[id];
				if (!incoming || id === this.activeId) return;
				const outgoing = this.tracks[this.activeId];
				clearTimeout(this.duckTimer);
				incoming.muted = false;
				incoming.currentTime = 0;
				incoming.volume = 0;
				incoming.play().catch(() => {});
				this.animate(incoming, this.baseVolumes[id], fadeSeconds);
				if (outgoing && !outgoing.paused) {
					this.animate(outgoing, 0, fadeSeconds);
					setTimeout(() => {
						if (this.activeId !== id) return;
						outgoing.pause();
						outgoing.currentTime = 0;
					}, Math.max(20, fadeSeconds * 1000 + 40));
				}
				this.activeId = id;
			}

			duck(amountDb = 8, holdSeconds = 1.6) {
				const audio = this.tracks[this.activeId];
				if (!audio) return;
				clearTimeout(this.duckTimer);
				const factor = Math.pow(10, -Math.abs(Number(amountDb) || 0) / 20);
				this.animate(audio, this.baseVolumes[this.activeId] * factor, .16);
				const activeAtStart = this.activeId;
				this.duckTimer = setTimeout(() => {
					if (this.activeId === activeAtStart) {
						this.animate(audio, this.baseVolumes[activeAtStart], .42);
					}
				}, Math.max(0, Number(holdSeconds) || 0) * 1000);
			}

			stopAll(fadeSeconds = .5) {
				clearTimeout(this.duckTimer);
				const duration = Math.max(.01, Number(fadeSeconds) || .01);
				Object.values(this.tracks).forEach(audio => this.animate(audio, 0, duration));
				setTimeout(() => {
					Object.values(this.tracks).forEach(audio => {
						audio.pause();
						audio.currentTime = 0;
					});
				}, duration * 1000 + 40);
				this.activeId = "";
			}

			animate(audio, target, seconds) {
				if (!audio) return;
				const previous = this.animations.get(audio);
				if (previous) cancelAnimationFrame(previous);
				const from = audio.volume;
				const safeTarget = Math.max(0, Math.min(1, target));
				const started = performance.now();
				const duration = Math.max(10, Number(seconds) * 1000 || 10);
				const step = now => {
					const progress = Math.min(1, (now - started) / duration);
					const eased = .5 - Math.cos(progress * Math.PI) * .5;
					audio.volume = from + (safeTarget - from) * eased;
					if (progress < 1) {
						this.animations.set(audio, requestAnimationFrame(step));
					} else {
						this.animations.delete(audio);
					}
				};
				this.animations.set(audio, requestAnimationFrame(step));
			}
		}

		window.nimingStoryMusic = new NimingStoryMusic(
			document.getElementById("niming-story-modern"),
			document.getElementById("niming-story-song")
		);
		const unlockStoryMusic = () => window.nimingStoryMusic.unlock();
		document.addEventListener("pointerdown", unlockStoryMusic, { once: true, capture: true });
		document.addEventListener("touchstart", unlockStoryMusic, { once: true, capture: true });
		document.addEventListener("keydown", unlockStoryMusic, { once: true, capture: true });
	})();

	// Original procedural sound design for the prologue. Keeping these cues in
	// Web Audio avoids extra downloads and lets iPhone Safari unlock everything
	// from the same first gesture that starts the game.
	(() => {
		class NimingSFX {
			constructor() {
				this.context = null;
				this.sfxGain = null;
				this.ambienceGain = null;
				this.ambienceNodes = [];
			}

			ensureContext() {
				if (this.context) return this.context;
				const AudioContextClass = window.AudioContext || window.webkitAudioContext;
				if (!AudioContextClass) return null;
				this.context = new AudioContextClass();
				this.sfxGain = this.context.createGain();
				this.sfxGain.gain.value = .78;
				this.sfxGain.connect(this.context.destination);
				return this.context;
			}

			unlock() {
				const context = this.ensureContext();
				if (context && context.state === "suspended") context.resume().catch(() => {});
				return context;
			}

			tone(startHz, endHz, duration, gain = .08, type = "sine", delay = 0) {
				const context = this.unlock();
				if (!context || !this.sfxGain) return;
				const start = context.currentTime + delay;
				const oscillator = context.createOscillator();
				const envelope = context.createGain();
				oscillator.type = type;
				oscillator.frequency.setValueAtTime(Math.max(startHz, 20), start);
				oscillator.frequency.exponentialRampToValueAtTime(Math.max(endHz, 20), start + duration);
				envelope.gain.setValueAtTime(.0001, start);
				envelope.gain.exponentialRampToValueAtTime(gain, start + Math.min(.025, duration * .18));
				envelope.gain.exponentialRampToValueAtTime(.0001, start + duration);
				oscillator.connect(envelope).connect(this.sfxGain);
				oscillator.start(start);
				oscillator.stop(start + duration + .03);
			}

			noise(duration, gain = .08, filterType = "bandpass", frequency = 1200, delay = 0, sweepTo = 0) {
				const context = this.unlock();
				if (!context || !this.sfxGain) return;
				const frameCount = Math.max(1, Math.floor(context.sampleRate * duration));
				const buffer = context.createBuffer(1, frameCount, context.sampleRate);
				const data = buffer.getChannelData(0);
				let state = 0;
				for (let index = 0; index < frameCount; index++) {
					state = state * .72 + (Math.random() * 2 - 1) * .28;
					data[index] = state;
				}
				const start = context.currentTime + delay;
				const source = context.createBufferSource();
				const filter = context.createBiquadFilter();
				const envelope = context.createGain();
				source.buffer = buffer;
				filter.type = filterType;
				filter.frequency.setValueAtTime(frequency, start);
				if (sweepTo > 0) filter.frequency.exponentialRampToValueAtTime(sweepTo, start + duration);
				filter.Q.value = filterType === "bandpass" ? 1.2 : .4;
				envelope.gain.setValueAtTime(.0001, start);
				envelope.gain.linearRampToValueAtTime(gain, start + Math.min(.035, duration * .16));
				envelope.gain.exponentialRampToValueAtTime(.0001, start + duration);
				source.connect(filter).connect(envelope).connect(this.sfxGain);
				source.start(start);
			}

			play(id) {
				switch (id) {
					case "notification":
						this.tone(880, 1080, .10, .075, "sine");
						this.tone(1120, 1380, .13, .065, "sine", .12);
						break;
					case "paper":
						this.noise(.26, .075, "bandpass", 1900, 0, 820);
						this.noise(.18, .045, "highpass", 2600, .08);
						break;
					case "voicemail":
						this.tone(142, 132, .17, .075, "square");
						this.tone(142, 128, .17, .065, "square", .23);
						break;
					case "rain_focus":
						this.noise(.48, .075, "highpass", 1700, 0, 3200);
						break;
					case "choice":
						this.tone(430, 620, .16, .105, "triangle");
						this.tone(620, 820, .16, .075, "sine", .08);
						break;
					case "transition":
						this.noise(1.45, .23, "lowpass", 5400, 0, 120);
						this.tone(96, 38, 1.35, .18, "sine");
						this.tone(62, 54, .14, .16, "sine", .18);
						this.tone(62, 50, .16, .13, "sine", .49);
						break;
					case "wake":
						this.noise(.52, .085, "lowpass", 680, 0, 180);
						this.tone(118, 72, .46, .07, "triangle");
						break;
					case "memory":
						this.tone(318, 184, .72, .045, "sine");
						this.tone(476, 286, .62, .025, "sine", .04);
						break;
					case "coins":
						this.tone(1780, 1420, .16, .075, "triangle");
						this.tone(2210, 1680, .18, .055, "triangle", .07);
						this.tone(1320, 980, .20, .04, "sine", .14);
						break;
					case "steamer":
						this.noise(.42, .09, "highpass", 1500, 0, 3900);
						this.tone(540, 310, .18, .045, "triangle");
						break;
					case "debt":
						this.noise(.34, .07, "bandpass", 1600, 0, 720);
						this.tone(176, 124, .34, .045, "sine", .08);
						break;
					case "stove":
						this.tone(116, 72, .28, .14, "triangle");
						this.noise(.34, .08, "lowpass", 540, .04, 150);
						break;
					case "pan_enter":
						this.noise(.28, .045, "highpass", 2200);
						this.tone(392, 588, .42, .05, "sine", .06);
						break;
					case "contract_equal":
						this.noise(.12, .08, "bandpass", 1100);
						this.tone(440, 880, .48, .13, "triangle", .04);
						break;
					case "contract_trial":
						this.noise(.12, .065, "bandpass", 980);
						this.tone(390, 560, .34, .105, "triangle", .04);
						break;
					case "contract_refuse":
						this.noise(.14, .08, "bandpass", 760);
						this.tone(224, 112, .48, .13, "triangle", .03);
						break;
					case "repair_prepare":
						this.noise(.44, .09, "lowpass", 820, 0, 230);
						this.tone(128, 92, .32, .06, "triangle", .08);
						break;
					case "gauge_start":
						this.tone(520, 510, .09, .05, "triangle");
						break;
					case "gauge_perfect":
						this.tone(720, 1360, .28, .10, "sine");
						this.noise(.17, .055, "highpass", 2800, .03);
						break;
					case "gauge_good":
						this.tone(460, 680, .22, .075, "triangle");
						break;
					case "gauge_miss":
						this.noise(.30, .095, "lowpass", 620, 0, 150);
						this.tone(132, 74, .28, .07, "square");
						break;
					case "fire_master":
						this.noise(1.10, .15, "bandpass", 920, 0, 2400);
						this.tone(168, 326, .92, .11, "sine");
						this.tone(520, 1040, .62, .055, "sine", .18);
						break;
					case "fire_steady":
						this.noise(.82, .12, "bandpass", 760, 0, 1680);
						this.tone(142, 228, .66, .085, "sine");
						break;
					case "fire_fragile":
						this.noise(.62, .085, "lowpass", 680, 0, 210);
						this.tone(108, 76, .44, .055, "triangle");
						break;
					case "summary":
						this.tone(196, 192, .72, .13, "sine");
						this.tone(294, 588, .74, .065, "sine", .08);
						this.tone(440, 880, .64, .045, "sine", .18);
						break;
				}
			}

			startAmbience(id) {
				const context = this.unlock();
				if (!context) return;
				this.stopAmbience(.18);
				const gain = context.createGain();
				gain.gain.setValueAtTime(.0001, context.currentTime);
				gain.gain.exponentialRampToValueAtTime(id === "modern" ? .18 : .13, context.currentTime + .8);
				gain.connect(context.destination);
				const duration = 4;
				const buffer = context.createBuffer(1, context.sampleRate * duration, context.sampleRate);
				const data = buffer.getChannelData(0);
				let state = 0;
				for (let index = 0; index < data.length; index++) {
					state = state * (id === "modern" ? .82 : .91) + (Math.random() * 2 - 1) * (id === "modern" ? .18 : .09);
					data[index] = state;
				}
				const noiseSource = context.createBufferSource();
				const filter = context.createBiquadFilter();
				noiseSource.buffer = buffer;
				noiseSource.loop = true;
				filter.type = id === "modern" ? "highpass" : "lowpass";
				filter.frequency.value = id === "modern" ? 1200 : 780;
				noiseSource.connect(filter).connect(gain);
				noiseSource.start();
				const hum = context.createOscillator();
				const humGain = context.createGain();
				hum.type = "sine";
				hum.frequency.value = id === "modern" ? 58 : 86;
				humGain.gain.value = id === "modern" ? .035 : .018;
				hum.connect(humGain).connect(gain);
				hum.start();
				this.ambienceGain = gain;
				this.ambienceNodes = [noiseSource, hum];
			}

			stopAmbience(fade = .35) {
				if (!this.context || !this.ambienceGain) return;
				const context = this.context;
				const gain = this.ambienceGain;
				const nodes = this.ambienceNodes.slice();
				const end = context.currentTime + Math.max(.01, Number(fade) || .01);
				gain.gain.cancelScheduledValues(context.currentTime);
				gain.gain.setValueAtTime(Math.max(gain.gain.value, .0001), context.currentTime);
				gain.gain.exponentialRampToValueAtTime(.0001, end);
				nodes.forEach(node => {
					try { node.stop(end + .03); } catch (_) {}
				});
				this.ambienceGain = null;
				this.ambienceNodes = [];
			}

			stopAll() {
				this.stopAmbience(.08);
			}
		}

		window.nimingSFX = new NimingSFX();
		const unlockSFX = () => window.nimingSFX.unlock();
		document.addEventListener("pointerdown", unlockSFX, { once: true, capture: true });
		document.addEventListener("touchstart", unlockSFX, { once: true, capture: true });
		document.addEventListener("keydown", unlockSFX, { once: true, capture: true });
	})();

	(() => {
		const overlay = document.getElementById("status");
		const loader = document.getElementById("status-loader");
		const notice = document.getElementById("status-notice");
		const fill = document.getElementById("status-progress");
		const track = document.getElementById("status-track");
		const percent = document.getElementById("status-percent");
		const time = document.getElementById("status-time");
		const state = document.getElementById("status-state");
		const soundtrack = document.getElementById("niming-ost");
		const audioButton = document.getElementById("status-audio");
		const startedAt = performance.now();
		let smoothedRate = 0;
		let lastCurrent = 0;
		let lastTime = startedAt;

		window.nimingOST = soundtrack;
		soundtrack.volume = .34;

		function syncAudioButton() {
			const playing = !soundtrack.paused;
			audioButton.setAttribute("aria-pressed", String(playing));
			audioButton.textContent = playing ? "♫ 古箏配樂播放中" : "♫ 播放古箏配樂";
		}

		audioButton.addEventListener("click", async () => {
			if (soundtrack.paused) {
				try {
					await soundtrack.play();
				} catch (error) {
					console.warn("Soundtrack playback requires another user gesture.", error);
				}
			} else {
				soundtrack.pause();
			}
			syncAudioButton();
		});
		soundtrack.addEventListener("play", syncAudioButton);
		soundtrack.addEventListener("pause", syncAudioButton);
		syncAudioButton();
		soundtrack.play().then(syncAudioButton).catch(syncAudioButton);
		const unlockSoundtrack = event => {
			if (event.target === audioButton || !soundtrack.paused) return;
			soundtrack.play().then(syncAudioButton).catch(syncAudioButton);
		};
		document.addEventListener("pointerdown", unlockSoundtrack, { once: true, capture: true });
		document.addEventListener("click", unlockSoundtrack, { once: true, capture: true });
		document.addEventListener("keydown", unlockSoundtrack, { once: true, capture: true });

		function updateProgress(current, total) {
			if (!(current > 0 && total > 0)) {
				state.textContent = "正在點燃炊餅爐火";
				return;
			}
			const now = performance.now();
			const elapsed = Math.max((now - lastTime) / 1000, .05);
			const instantRate = Math.max(current - lastCurrent, 0) / elapsed;
			if (instantRate > 0) {
				smoothedRate = smoothedRate ? smoothedRate * .78 + instantRate * .22 : instantRate;
			}
			lastCurrent = current;
			lastTime = now;
			const ratio = Math.min(Math.max(current / total, 0), 1);
			const value = Math.round(ratio * 100);
			fill.style.width = value + "%";
			track.setAttribute("aria-valuenow", String(value));
			percent.textContent = value + "%";
			state.textContent = value < 22 ? "正在展開陽谷縣輿圖" : value < 48 ? "正在清點商盟貨物" : value < 76 ? "正在召集江湖人物" : "正在改寫大郎命數";
			if (smoothedRate > 0 && ratio < .995) {
				const remaining = Math.max(Math.ceil((total - current) / smoothedRate), 1);
				time.textContent = remaining > 60 ? "剩餘約 " + Math.ceil(remaining / 60) + " 分鐘" : "剩餘約 " + remaining + " 秒";
			} else {
				time.textContent = ratio >= .995 ? "即將完成" : "估算時間中";
			}
		}

		function showFailure(error) {
			console.error(error);
			loader.style.display = "none";
			notice.style.display = "block";
			notice.textContent = "命運之門暫時無法開啟，請重新整理頁面再試。" + (error && error.message ? " " + error.message : "");
		}

		if (new URLSearchParams(location.search).has("loading-preview")) {
			const previewTotal = 1000;
			updateProgress(680, previewTotal);
			state.textContent = "正在召集江湖人物";
			time.textContent = "剩餘約 4 秒";
			return;
		}

		engine.startGame({ onProgress: updateProgress }).then(() => {
			fill.style.width = "100%";
			percent.textContent = "100%";
			time.textContent = "門扉已開";
			state.textContent = "命運已改寫";
			setTimeout(() => {
				overlay.classList.add("leaving");
				setTimeout(() => overlay.remove(), 620);
			}, 260);
		}, showFailure);
	})();
	</script>
