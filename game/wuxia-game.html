function createPetals(scene, count) {
  const geo = new THREE.PlaneGeometry(0.1, 0.07);
  const colors = [0xFFB7C5, 0xFFC8DD, 0xFFE0EC, 0xF0C940];
  const petals = [];
  for (let i = 0; i < count; i++) {
    const c = colors[Math.floor(Math.random() * colors.length)];
    const mat = new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.5 + Math.random() * 0.3, side: THREE.DoubleSide });
    const p = new THREE.Mesh(geo, mat);
    p.position.set(
      (Math.random() - 0.5) * 18,
      Math.random() * 10 + 3,
      (Math.random() - 0.5) * 12 - 3
    );
    p.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    p.userData = {
      vy: -0.004 - Math.random() * 0.006,
      vx: (Math.random() - 0.5) * 0.008,
      rotSpeed: (Math.random() - 0.5) * 0.015,
      swayPhase: Math.random() * Math.PI * 2,
    };
    scene.add(p);
    petals.push(p);
  }
  return petals;
}

function createScenery(scene) {
  const bambooMat = new THREE.MeshPhongMaterial({ color: 0x4a7a40, shininess: 5, specular: 0x224422 });
  const positions = [
    [-6, -3], [-6.5, -1.5], [6, -3], [6.5, -1.5],
    [-5, -4.5], [5, -4.5], [-7, -2.5], [7, -2.5],
    [-4.5, -5], [4.5, -5],
  ];
  for (const [x, z] of positions) {
    const h = 5 + Math.random() * 3;
    const bamboo = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, h, 5), bambooMat);
    bamboo.position.set(x + (Math.random() - 0.5) * 0.6, h / 2, z);
    bamboo.rotation.z = (Math.random() - 0.5) * 0.08;
    scene.add(bamboo);

    const leafMat = new THREE.MeshPhongMaterial({ color: 0x5a8b50, shininess: 5, specular: 0x2a4a2a });
    for (let j = 0; j < 3; j++) {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.4, 6, 4), leafMat);
      leaf.position.set(x + (Math.random() - 0.5) * 0.8, h - 0.5 + j * 0.3, z + (Math.random() - 0.5) * 0.5);
      leaf.scale.set(1, 0.5, 1);
      scene.add(leaf);
    }
  }

  // Distant mountains — visible blue-grey silhouettes
  const mountainMat = new THREE.MeshPhongMaterial({ color: 0x3a3550, shininess: 2, specular: 0x222244 });
  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(new THREE.ConeGeometry(3 + Math.random() * 2.5, 5 + Math.random() * 3, 5), mountainMat);
    m.position.set((i - 2) * 4 + (Math.random() - 0.5) * 2, 1.5, -14 + (Math.random() - 0.5) * 2);
    scene.add(m);
  }

  // Stone lanterns for atmosphere
  const stoneMat = new THREE.MeshPhongMaterial({ color: 0x55504a, shininess: 5 });
  const lanternMat = new THREE.MeshBasicMaterial({ color: 0xFFD89B, transparent: true, opacity: 0.7 });
  const lanternPositions = [[-4, 0, -1], [4, 0, -1]];
  for (const [lx, ly, lz] of lanternPositions) {
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.2, 6), stoneMat);
    base.position.set(lx, 0.1, lz);
    scene.add(base);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.8, 6), stoneMat);
    post.position.set(lx, 0.6, lz);
    scene.add(post);
    const lantern = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), lanternMat);
    lantern.position.set(lx, 1.15, lz);
    scene.add(lantern);
    const lanternLight = new THREE.PointLight(0xFFD89B, 0.8, 4);
    lanternLight.position.set(lx, 1.15, lz);
    scene.add(lanternLight);
  }
}

function createHitBurst(scene, position, color) {
  const count = 16;
  const particles = [];
  const geo = new THREE.SphereGeometry(0.06, 4, 3);
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1 });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(position);
    const angle = (i / count) * Math.PI * 2;
    p.userData = {
      vx: Math.cos(angle) * (0.05 + Math.random() * 0.08),
      vy: 0.05 + Math.random() * 0.08,
      vz: Math.sin(angle) * (0.05 + Math.random() * 0.08),
      life: 1,
    };
    scene.add(p);
    particles.push(p);
  }
  return particles;
}

function initCombat3D(enemyId) {
  const overlay = document.getElementById('combat-3d-overlay');
  const container = document.getElementById('three-canvas-container');
  overlay.classList.add('active');
  overlay.classList.remove('fading-out');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1520);
  scene.fog = new THREE.FogExp2(0x1a1520, 0.028);

  const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 3.2, 7.5);
  camera.lookAt(0, 1.3, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  // Lighting setup — bright romantic moonlit scene
  const ambient = new THREE.AmbientLight(0x887799, 0.8);
  scene.add(ambient);

  const moonLight = new THREE.DirectionalLight(0xe0e8ff, 1.2);
  moonLight.position.set(-2, 8, 3);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.set(2048, 2048);
  moonLight.shadow.camera.near = 0.5;
  moonLight.shadow.camera.far = 25;
  moonLight.shadow.camera.left = -6;
  moonLight.shadow.camera.right = 6;
  moonLight.shadow.camera.top = 6;
  moonLight.shadow.camera.bottom = -6;
  moonLight.shadow.bias = -0.0005;
  scene.add(moonLight);

  const warmFill = new THREE.DirectionalLight(0xFFD89B, 0.6);
  warmFill.position.set(3, 4, 3);
  scene.add(warmFill);

  const rimLight = new THREE.DirectionalLight(0xC0392B, 0.7);
  rimLight.position.set(0, 2.5, -6);
  scene.add(rimLight);

  const hemi = new THREE.HemisphereLight(0x8a93b8, 0x2a2018, 0.35);
  scene.add(hemi);

  // Moon — brighter
  const moonGeo = new THREE.CircleGeometry(2.5, 32);
  const moonMat = new THREE.MeshBasicMaterial({ color: 0xF5F0E0, transparent: true, opacity: 0.45 });
  const moon = new THREE.Mesh(moonGeo, moonMat);
  moon.position.set(0, 5.5, -15);
  scene.add(moon);

  // Moon glow halo
  const moonGlow = new THREE.Mesh(new THREE.CircleGeometry(5, 32), new THREE.MeshBasicMaterial({ color: 0xF5F0E0, transparent: true, opacity: 0.12 }));
  moonGlow.position.set(0, 5.5, -15);
  scene.add(moonGlow);
  // Additional moon glow layers
  const moonGlow2 = new THREE.Mesh(new THREE.CircleGeometry(8, 32), new THREE.MeshBasicMaterial({ color: 0x9090C0, transparent: true, opacity: 0.05 }));
  moonGlow2.position.set(0, 5.5, -15.5);
  scene.add(moonGlow2);

  // Arena ground — weathered stone path, no stage markings
  const groundGeo = new THREE.CircleGeometry(14, 48);
  const groundMat = new THREE.MeshPhongMaterial({ color: 0x2f2b25, shininess: 8, specular: 0x3a332a });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Scattered stone slabs for a natural path feel
  const slabMat = new THREE.MeshPhongMaterial({ color: 0x3d3830, shininess: 6, specular: 0x2a251e });
  for (let i = 0; i < 7; i++) {
    const slab = new THREE.Mesh(new THREE.CylinderGeometry(0.55 + Math.random() * 0.35, 0.6 + Math.random() * 0.35, 0.05, 6), slabMat);
    slab.position.set((i - 3) * 1.1 + (Math.random() - 0.5) * 0.4, 0.028, (Math.random() - 0.5) * 0.5);
    slab.rotation.y = Math.random() * Math.PI;
    slab.receiveShadow = true;
    scene.add(slab);
  }

  // Scenery
  createScenery(scene);

  // Characters
  const isBoss = enemyId === 'xuanMingZhenRen';
  const player3D = createFighter({
    x: -2.5, facing: Math.PI * 0.12,
    bodyColor: 0x1a4e87, headColor: 0xF0DCC8, hairColor: 0x1a1a1a, accentColor: 0xD4AF37,
    auraColor: 0xD4AF37,
  });
  scene.add(player3D);

  const enemyColor = isBoss ? 0x5B0A0A : 0x2a1a1a;
  const enemyAccent = isBoss ? 0xC0392B : 0x8B4513;
  const enemy3D = createFighter({
    x: 2.5, facing: -Math.PI * 0.12,
    bodyColor: enemyColor, headColor: 0xF0DCC8, hairColor: isBoss ? 0x6B0000 : 0x1a1a1a, accentColor: enemyAccent,
    auraColor: 0xC0392B,
  });
  if (isBoss) {
    enemy3D.scale.set(1.2, 1.2, 1.2);
  }
  scene.add(enemy3D);

  const petals = createPetals(scene, 50);
  const burstParticles = [];

  const clock = new THREE.Clock();
  let animId = null;
  let camShake = 0;
  const camRig = { px: 0, py: 2.9, pz: 7.8, tx: 0, ty: 1.35, tz: 0 };

  function animate() {
    animId = requestAnimationFrame(animate);
    // Hit-stop: freeze the whole frame briefly on impact
    if (performance.now() < (combat3D ? combat3D.hitStopUntil : 0)) return;
    const t = clock.getElapsedTime();

    // Idle bob (skipped when a fighter is downed / posing)
    if (!player3D.userData.noBob) {
      player3D.position.y = Math.sin(t * 1.4) * 0.025;
      player3D.userData.torso.scale.y = 1 + Math.sin(t * 1.4) * 0.015;
    }
    player3D.userData.aura.scale.setScalar(1 + Math.sin(t * 1.8) * 0.04);
    player3D.userData.auraLight.intensity = 0.5 + Math.sin(t * 2.2) * 0.2;
    player3D.userData.glowDisc.material.opacity = 0.08 + Math.sin(t * 1.8) * 0.04;

    if (!enemy3D.userData.noBob) {
      enemy3D.position.y = Math.sin(t * 1.2 + 1) * 0.025;
      enemy3D.userData.torso.scale.y = 1 + Math.sin(t * 1.2 + 1) * 0.015;
    }
    enemy3D.userData.aura.scale.setScalar(1 + Math.sin(t * 1.6 + 1) * 0.04);
    enemy3D.userData.auraLight.intensity = 0.5 + Math.sin(t * 2.0 + 1) * 0.2;
    enemy3D.userData.glowDisc.material.opacity = 0.08 + Math.sin(t * 1.6 + 1) * 0.04;

    // Hair sway
    player3D.userData.hairLong.rotation.x = Math.sin(t * 1.5) * 0.05 - 0.1;
    enemy3D.userData.hairLong.rotation.x = Math.sin(t * 1.2 + 1) * 0.05 - 0.1;

    // Camera: rig position (tweened by clips) + idle drift + shake
    const idleX = Math.sin(t * 0.15) * 0.22;
    const idleY = Math.sin(t * 0.2) * 0.09;
    const shX = camShake > 0 ? (Math.random() - 0.5) * camShake : 0;
    const shY = camShake > 0 ? (Math.random() - 0.5) * camShake * 0.5 : 0;
    if (camShake > 0) camShake *= 0.85;
    camera.position.set(camRig.px + idleX + shX, camRig.py + idleY + shY, camRig.pz);
    camera.lookAt(camRig.tx, camRig.ty, camRig.tz);

    // Petals
    for (const p of petals) {
      p.position.y += p.userData.vy;
      p.position.x += p.userData.vx + Math.sin(t + p.userData.swayPhase) * 0.004;
      p.rotation.z += p.userData.rotSpeed;
      if (p.position.y < 0.1) {
        p.position.y = 10 + Math.random() * 3;
        p.position.x = (Math.random() - 0.5) * 18;
      }
    }

    // Burst particles
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const bp = burstParticles[i];
      bp.position.x += bp.userData.vx;
      bp.position.y += bp.userData.vy;
      bp.position.z += bp.userData.vz;
      bp.userData.vy -= 0.006;
      bp.userData.life -= 0.03;
      bp.material.opacity = bp.userData.life;
      bp.scale.setScalar(bp.userData.life);
      if (bp.userData.life <= 0) {
        scene.remove(bp);
        bp.geometry.dispose();
        bp.material.dispose();
        burstParticles.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
  }
  animate();

  combat3D = {
    scene, camera, renderer, container, player3D, enemy3D, petals, burstParticles,
    animId, clock, overlay, camRig, hitStopUntil: 0, clipPlaying: false,
    addShake: function(v) { camShake = Math.max(camShake, v); },
    addBurst: function(pos, color) {
      const burst = createHitBurst(scene, pos, color);
      for (const b of burst) burstParticles.push(b);
    },
  };

  window.addEventListener('resize', onCombat3DResize);

  // VS text animation
  const vsText = document.getElementById('vs-text');
  anime({
    targets: vsText,
    opacity: [{ value: 0 }, { value: 1, duration: 400 }, { value: 1, duration: 600 }, { value: 0, duration: 400 }],
    scale: [{ value: 0.3 }, { value: 1.3, duration: 400 }, { value: 1, duration: 600 }, { value: 1.8, duration: 400 }],
    translateX: ['-50%', '-50%'],
    translateY: ['-50%', '-50%'],
    duration: 1800,
    easing: 'easeOutQuad',
  });

  // Cinematic entrance: sweep from high wide shot into home framing
  camRig.px = 0; camRig.py = 5.2; camRig.pz = 12.5;
  camRig.tx = 0; camRig.ty = 1.0; camRig.tz = 0;
  combat3D.camRig = camRig;
  camHome(1600);
}

function onCombat3DResize() {
  if (!combat3D) return;
  const c = combat3D.container;
  combat3D.camera.aspect = c.clientWidth / c.clientHeight;
  combat3D.camera.updateProjectionMatrix();
  combat3D.renderer.setSize(c.clientWidth, c.clientHeight);
}

/* ===== Cinematic clip system ===== */
const CAM_HOME = { px: 0, py: 2.9, pz: 7.8, tx: 0, ty: 1.35, tz: 0 };

function camTo(px, py, pz, tx, ty, tz, dur, easing) {
  if (!combat3D) return;
  anime.remove(combat3D.camRig);
  anime({
    targets: combat3D.camRig,
    px: px, py: py, pz: pz, tx: tx, ty: ty, tz: tz,
    duration: dur || 600,
    easing: easing || 'easeInOutQuad',
  });
}

function camHome(dur) {
  camTo(CAM_HOME.px, CAM_HOME.py, CAM_HOME.pz, CAM_HOME.tx, CAM_HOME.ty, CAM_HOME.tz, dur || 650, 'easeOutQuad');
}

function hitStop(ms) {
  if (!combat3D) return;
  combat3D.hitStopUntil = performance.now() + ms;
}

function enterClip() {
  const ov = document.getElementById('combat-3d-overlay');
  if (ov) ov.classList.add('clip-playing');
  if (combat3D) combat3D.clipPlaying = true;
}

function exitClip() {
  const ov = document.getElementById('combat-3d-overlay');
  if (ov) ov.classList.remove('clip-playing');
  if (combat3D) combat3D.clipPlaying = false;
}

/* Skill identity: color per skill family */
function skillFxColor(skillId) {
  const sk = SKILLS[skillId];
  if (!sk) return { hex: 0xD4AF37, css: '#D4AF37' };
  const n = sk.name || '';
  if (sk.type === 'heal') return { hex: 0x3DDC97, css: '#3DDC97' };
  if (sk.type === 'absorb') return { hex: 0x9B59B6, css: '#BB8FCE' };
  if (sk.type === 'buff') return { hex: 0x5DADE2, css: '#85C1E9' };
  if (n.indexOf('劍') >= 0 || n.indexOf('刀') >= 0) return { hex: 0xA8D4E6, css: '#A8D4E6' };
  if (n.indexOf('掌') >= 0 || n.indexOf('拳') >= 0 || n.indexOf('指') >= 0) return { hex: 0xFF6B5A, css: '#FF8A80' };
  return { hex: 0xF0C940, css: '#F0C940' };
}

function showSkillPlate(name, cssColor) {
  const el = document.getElementById('c3d-skill-plate');
  if (!el) return;
  el.textContent = '「 ' + name + ' 」';
  el.style.color = cssColor || '#F0C940';
  el.style.borderColor = cssColor || 'rgba(212,175,55,0.55)';
  el.style.textShadow = '0 0 18px ' + (cssColor || 'rgba(212,175,55,0.35)') + ', 0 2px 8px rgba(0,0,0,0.8)';
  anime.remove(el);
  anime({
    targets: el,
    opacity: [{ value: 0, duration: 0 }, { value: 1, duration: 160 }, { value: 1, duration: 620 }, { value: 0, duration: 220 }],
    scale: [{ value: 1.35, duration: 0 }, { value: 1, duration: 240, easing: 'easeOutBack' }, { value: 1, duration: 560 }, { value: 0.96, duration: 220 }],
    translateX: ['-50%', '-50%'],
    translateY: ['-50%', '-50%'],
    duration: 1000,
  });
}

/* Sword slash trail — crescent arc that sweeps and fades, facing the camera */
function spawnSlashTrail(scene, origin, dir, colorHex, big) {
  const geo = new THREE.RingGeometry(big ? 0.7 : 0.55, big ? 1.6 : 1.25, 24, 1, 0, Math.PI * 0.75);
  const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(origin);
  mesh.position.y = 1.5;
  mesh.position.z = 0.3;
  const startZ = dir > 0 ? 0.5 : Math.PI - 0.5 - Math.PI * 0.75;
  mesh.rotation.z = startZ;
  scene.add(mesh);
  anime({
    targets: mesh.rotation,
    z: startZ + (dir > 0 ? -1.2 : 1.2),
    duration: 200,
    easing: 'easeInQuad',
  });
  anime({
    targets: mat,
    opacity: 0,
    duration: 320,
    easing: 'easeOutQuad',
    complete: function () {
      scene.remove(mesh);
      geo.dispose();
      mat.dispose();
    },
  });
}

/* Impact flash — brief white/cinnabar plane burst at hit point */
function spawnImpactFlash(scene, position, colorHex) {
  const geo = new THREE.CircleGeometry(0.55, 20);
  const mat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.95, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);
  scene.add(mesh);
  const rim = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.62, 24), new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false }));
  rim.position.copy(position);
  scene.add(rim);
  anime({ targets: mesh.scale, x: 2.2, y: 2.2, z: 2.2, duration: 180, easing: 'easeOutQuad' });
  anime({ targets: rim.scale, x: 2.8, y: 2.8, z: 2.8, duration: 300, easing: 'easeOutQuad' });
  anime({
    targets: [mat, rim.material],
    opacity: 0,
    duration: 320,
    easing: 'easeOutQuad',
    complete: function () {
      scene.remove(mesh); scene.remove(rim);
      geo.dispose(); mat.dispose(); rim.geometry.dispose(); rim.material.dispose();
    },
  });
}

/* Dash streaks — speed lines while a fighter rushes */
function spawnDashStreaks(scene, fromX, dir, colorHex) {
  for (let i = 0; i < 5; i++) {
    const len = 0.7 + Math.random() * 0.7;
    const geo = new THREE.PlaneGeometry(len, 0.03);
    const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(fromX - dir * (0.2 + Math.random() * 0.6), 0.7 + Math.random() * 1.2, (Math.random() - 0.5) * 0.5);
    scene.add(mesh);
    anime({ targets: mesh.position, x: mesh.position.x - dir * 1.2, duration: 220 + i * 30, easing: 'easeOutQuad' });
    anime({
      targets: mat, opacity: 0, duration: 260 + i * 30, easing: 'easeOutQuad',
      complete: function () { scene.remove(mesh); geo.dispose(); mat.dispose(); },
    });
  }
}

/*
 * playFightClip — the core cinematic exchange.
 * opts: { attacker, defender, kind: 'attack'|'skill', skillId, crit, onImpact, onDone }
 */
function playFightClip(opts) {
  if (!combat3D) { if (opts.onImpact) opts.onImpact(); if (opts.onDone) opts.onDone(); return; }
  const c3 = combat3D;
  const atk = opts.attacker;
  const def = opts.defender;
  const isPlayerAtk = atk === c3.player3D;
  const dir = isPlayerAtk ? 1 : -1;
  const aud = atk.userData;
  const dud = def.userData;
  const atkHomeX = isPlayerAtk ? -2.5 : 2.5;
  const defHomeX = isPlayerAtk ? 2.5 : -2.5;
  const isSkill = opts.kind === 'skill';
  const isEnemySkill = opts.kind === 'enemySkill';
  let fx = { hex: 0xE8EEF7, css: '#E8EEF7' };
  if (isSkill) fx = skillFxColor(opts.skillId);
  else if (isEnemySkill) fx = { hex: 0xC0392B, css: '#FF6B5A' };

  enterClip();

  // Beat 1 — camera behind attacker's shoulder, attacker winds up
  camTo(atkHomeX - dir * 1.6, 2.1, 4.6, defHomeX * 0.4, 1.4, 0, 320, 'easeOutQuad');
  anime({ targets: atk.rotation, z: dir * 0.1, duration: 260, easing: 'easeOutQuad' });
  anime({ targets: aud.armR.rotation, x: -0.5, duration: 260, easing: 'easeOutQuad' });

  if (isSkill || isEnemySkill) {
    // Charge: aura + emissive, name plate
    const skillName = isSkill ? SKILLS[opts.skillId].name : (opts.enemySkill ? opts.enemySkill.name : '');
    showSkillPlate(skillName, fx.css);
    aud.matRobe.emissive = new THREE.Color(fx.hex);
    aud.matRobe.emissiveIntensity = 0.7;
    anime({ targets: aud.aura.scale, x: 1.7, y: 1.7, z: 1.7, duration: 420, easing: 'easeOutQuad' });
    c3.addBurst(new THREE.Vector3(atkHomeX, 1.2, 0), fx.hex);
  }

  const windup = (isSkill || isEnemySkill) ? 480 : 300;

  setTimeout(function () {
    if (!combat3D) return;
    // Beat 2 — dash to the defender with speed streaks, whip-pan camera
    const clashX = defHomeX - dir * 1.05;
    spawnDashStreaks(c3.scene, atkHomeX, dir, fx.hex);
    anime({ targets: atk.position, x: clashX, duration: 190, easing: 'easeInQuad' });
    anime({ targets: atk.rotation, z: dir * 0.16, duration: 190, easing: 'easeInQuad' });
    camTo(dir * 1.1, 1.9, 4.9, clashX * 0.6, 1.45, 0, 210, 'easeInQuad');

    setTimeout(function () {
      if (!combat3D) return;
      // Beat 3 — the strike lands: slash trail, impact flash, hit-stop, shake
      anime({ targets: aud.armR.rotation, x: -2.2, duration: 120, easing: 'easeInQuad' });
      const hitPos = new THREE.Vector3(clashX + dir * 0.55, 1.45, 0.15);
      spawnSlashTrail(c3.scene, hitPos, dir, fx.hex, isSkill || isEnemySkill || opts.crit);

      if (opts.dodged) {
        // Defender sidesteps in a blur — no impact, just afterimage
        anime({ targets: def.position, x: defHomeX - dir * 0.9, z: 0.7, duration: 160, easing: 'easeOutQuad',
          complete: function () {
            anime({ targets: def.position, x: defHomeX, z: 0, duration: 420, easing: 'easeOutElastic(1, 0.55)' });
          },
        });
        spawnDashStreaks(c3.scene, defHomeX, -dir, 0x85C1E9);
      } else {
        spawnImpactFlash(c3.scene, hitPos, fx.hex);
        c3.addBurst(hitPos, fx.hex);
        hitStop(opts.crit ? 110 : 70);
        c3.addShake(opts.crit ? 0.22 : ((isSkill || isEnemySkill) ? 0.15 : 0.1));

        // Defender reaction: stagger + red flash
        anime({ targets: def.position, x: defHomeX + dir * 0.5, duration: 130, easing: 'easeOutQuad',
          complete: function () {
            anime({ targets: def.position, x: defHomeX, duration: 420, easing: 'easeOutElastic(1, 0.55)' });
          },
        });
        anime({ targets: def.rotation, z: dir * 0.22, duration: 130, easing: 'easeOutQuad',
          complete: function () {
            anime({ targets: def.rotation, z: 0, duration: 400, easing: 'easeOutElastic(1, 0.55)' });
          },
        });
        dud.matRobe.emissive = new THREE.Color(0xFF2222);
        dud.matRobe.emissiveIntensity = 0.65;
        setTimeout(function () {
          if (dud.matRobe) { dud.matRobe.emissive = new THREE.Color(0x000000); dud.matRobe.emissiveIntensity = 0; }
        }, 170);
      }

      if (opts.onImpact) opts.onImpact();

      // Beat 4 — recover: attacker returns, camera pulls home
      setTimeout(function () {
        if (!combat3D) return;
        anime({ targets: atk.position, x: atkHomeX, duration: 430, easing: 'easeOutQuad' });
        anime({ targets: atk.rotation, z: 0, duration: 430, easing: 'easeOutQuad' });
        anime({ targets: aud.armR.rotation, x: 0, duration: 380, easing: 'easeOutQuad' });
        if (isSkill || isEnemySkill) {
          anime({ targets: aud.aura.scale, x: 1, y: 1, z: 1, duration: 380, easing: 'easeOutQuad' });
          setTimeout(function () {
            if (aud.matRobe) { aud.matRobe.emissive = new THREE.Color(0x000000); aud.matRobe.emissiveIntensity = 0; }
          }, 300);
        }
        camHome(520);
        setTimeout(function () {
          exitClip();
          if (opts.onDone) opts.onDone();
        }, 460);
      }, opts.crit ? 200 : 140);
    }, 200);
  }, windup);
}

/* Shorter clip for defend / heal / buff (no dash) */
function playSelfClip(fighter, type, skillId, onDone) {
  if (!combat3D) { if (onDone) onDone(); return; }
  const isPlayer = fighter === combat3D.player3D;
  const homeX = isPlayer ? -2.5 : 2.5;
  enterClip();
  camTo(homeX * 0.7, 2.2, 5.2, homeX, 1.35, 0, 380, 'easeOutQuad');
  if (skillId) showSkillPlate(SKILLS[skillId].name, skillFxColor(skillId).css);
  animFighterAction(fighter, type);
  setTimeout(function () {
    if (!combat3D) return;
    camHome(480);
    setTimeout(function () {
      exitClip();
      if (onDone) onDone();
    }, 400);
  }, 780);
}

function animFighterAction(fighter, type, onComplete) {
  const ud = fighter.userData;
  const origX = fighter.position.x;
  const isPlayer = fighter === combat3D.player3D;
  const dir = isPlayer ? 1 : -1;

  if (type === 'attack') {
    // Camera zoom in slightly
    anime({
      targets: combat3D.camera.position,
      z: 6,
      duration: 250,
      easing: 'easeOutQuad',
      complete: function() {
        anime({ targets: combat3D.camera.position, z: 7.5, duration: 400, easing: 'easeOutQuad' });
      }
    });
    // Lunge forward
    anime({
      targets: fighter.position,
      x: origX + 1.3 * dir,
      duration: 220,
      easing: 'easeOutQuad',
      complete: function() {
        anime({
          targets: fighter.position,
          x: origX,
          duration: 400,
          easing: 'easeOutElastic(1, 0.6)',
          complete: function() { if (onComplete) onComplete(); }
        });
      }
    });
    // Weapon swing
    anime({
      targets: ud.armR.rotation,
      x: [-0.3, -1.8, 0],
      duration: 600,
      easing: 'easeOutQuad',
    });
  } else if (type === 'hit') {
    anime({
      targets: fighter.position,
      x: origX + 0.5 * (-dir),
      z: 0.25 * (-dir),
      duration: 120,
      easing: 'easeOutQuad',
      complete: function() {
        anime({ targets: fighter.position, x: origX, z: 0, duration: 350, easing: 'easeOutElastic(1, 0.5)' });
      }
    });
    // Red flash
    ud.matRobe.emissive = new THREE.Color(0xFF0000);
    ud.matRobe.emissiveIntensity = 0.6;
    setTimeout(function() {
      ud.matRobe.emissive = new THREE.Color(0x000000);
      ud.matRobe.emissiveIntensity = 0;
    }, 180);
    // Hit burst particles
    const burstPos = new THREE.Vector3(fighter.position.x, 1.4, 0);
    combat3D.addBurst(burstPos, isPlayer ? 0xFF6B5A : 0xFFD700);
    combat3D.addShake(0.08);
  } else if (type === 'defend') {
    ud.matRobe.emissive = new THREE.Color(0x2980B9);
    ud.matRobe.emissiveIntensity = 0.35;
    anime({
      targets: [ud.aura.scale],
      x: [1.4, 1], y: [1.4, 1], z: [1.4, 1],
      duration: 700,
      easing: 'easeOutQuad',
      complete: function() {
        ud.matRobe.emissive = new THREE.Color(0x000000);
        ud.matRobe.emissiveIntensity = 0;
      }
    });
  } else if (type === 'skill') {
    const origScale = fighter.scale.x;
    // Charge up
    anime({
      targets: fighter.scale,
      x: origScale * 1.12, y: origScale * 1.12, z: origScale * 1.12,
      duration: 350,
      easing: 'easeOutQuad',
    });
    ud.matRobe.emissive = new THREE.Color(0xD4AF37);
    ud.matRobe.emissiveIntensity = 0.7;
    anime({
      targets: [ud.aura.scale],
      x: [1, 1.6], y: [1, 1.6], z: [1, 1.6],
      duration: 350,
      easing: 'easeOutQuad',
      complete: function() {
        // Burst release
        anime({ targets: fighter.scale, x: origScale, y: origScale, z: origScale, duration: 300, easing: 'easeOutElastic(1, 0.5)' });
        anime({ targets: ud.aura.scale, x: 1, y: 1, z: 1, duration: 400, easing: 'easeOutQuad' });
        const burstPos = new THREE.Vector3(fighter.position.x + 0.5 * dir, 1.4, 0);
        combat3D.addBurst(burstPos, 0xD4AF37);
        combat3D.addShake(0.05);
        if (onComplete) onComplete();
      }
    });
    setTimeout(function() {
      ud.matRobe.emissive = new THREE.Color(0x000000);
      ud.matRobe.emissiveIntensity = 0;
    }, 500);
    return;
  } else if (type === 'heal') {
    ud.matRobe.emissive = new THREE.Color(0x27AE60);
    ud.matRobe.emissiveIntensity = 0.45;
    anime({
      targets: [ud.aura.scale],
      x: [1, 1.5, 1], y: [1, 1.5, 1], z: [1, 1.5, 1],
      duration: 900,
      easing: 'easeOutQuad',
    });
    // Green healing particles rising
    for (let i = 0; i < 8; i++) {
      setTimeout(function() {
        const burstPos = new THREE.Vector3(
          fighter.position.x + (Math.random() - 0.5) * 0.6,
          0.5 + Math.random() * 0.3,
          (Math.random() - 0.5) * 0.4
        );
        combat3D.addBurst(burstPos, 0x27AE60);
      }, i * 80);
    }
    setTimeout(function() {
      ud.matRobe.emissive = new THREE.Color(0x000000);
      ud.matRobe.emissiveIntensity = 0;
    }, 700);
  } else if (type === 'defeat') {
    ud.noBob = true;
    // Stagger back, crumple, sink
    anime({
      targets: fighter.position,
      x: origX + 0.5 * (-dir),
      duration: 240,
      easing: 'easeOutQuad',
      complete: function () {
        anime({
          targets: fighter.rotation,
          z: isPlayer ? -1.1 : 1.1,
          duration: 620,
          easing: 'easeInQuad',
        });
        anime({
          targets: fighter.position,
          y: -0.55,
          duration: 620,
          easing: 'easeInQuad',
        });
      },
    });
    anime({
      targets: ud.matRobe,
      opacity: [0.92, 0.25],
      duration: 1100,
      easing: 'easeOutQuad',
    });
  } else if (type === 'victory') {
    ud.noBob = true;
    // Sword raise flourish, then settle into a poised stance
    anime({
      targets: ud.armR.rotation,
      x: [{ value: -2.6, duration: 320 }, { value: -0.4, duration: 500 }],
      easing: 'easeOutQuad',
    });
    anime({
      targets: fighter.rotation,
      y: [{ value: fighter.rotation.y + 0.5, duration: 400 }, { value: fighter.rotation.y, duration: 500 }],
      easing: 'easeInOutQuad',
    });
    ud.matRobe.emissive = new THREE.Color(0xD4AF37);
    ud.matRobe.emissiveIntensity = 0.5;
    // Golden burst
    for (let i = 0; i < 3; i++) {
      setTimeout(function() {
        const burstPos = new THREE.Vector3(
          fighter.position.x + (Math.random() - 0.5) * 1.2,
          1 + Math.random() * 0.8,
          (Math.random() - 0.5) * 0.6
        );
        combat3D.addBurst(burstPos, 0xD4AF37);
      }, i * 200);
    }
    setTimeout(function() {
      ud.matRobe.emissive = new THREE.Color(0x000000);
      ud.matRobe.emissiveIntensity = 0;
    }, 1200);
  }
}

function cleanupCombat3D() {
  if (!combat3D) return;
  cancelAnimationFrame(combat3D.animId);
  combat3D.renderer.dispose();
  if (combat3D.renderer.domElement && combat3D.renderer.domElement.parentNode) {
    combat3D.renderer.domElement.parentNode.removeChild(combat3D.renderer.domElement);
  }
  combat3D.scene.traverse(function(obj) {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(function(m) { m.dispose(); });
      else obj.material.dispose();
    }
  });
  window.removeEventListener('resize', onCombat3DResize);
  combat3D = null;
}

function updateCombat3DUI() {
  if (!combat || !combat3D) return;
  const e = combat.enemy;
  const eHpPct = clamp(e.hp / e.maxHp * 100, 0, 100);
  const pHpPct = clamp(player.hp / player.maxHp * 100, 0, 100);
  const pMpPct = clamp(player.mp / player.maxMp * 100, 0, 100);

  document.getElementById('c3d-enemy-name').textContent = e.name;
  document.getElementById('c3d-enemy-hp-bar').style.width = eHpPct + '%';
  document.getElementById('c3d-enemy-hp-text').textContent = Math.max(0, e.hp) + ' / ' + e.maxHp;
  document.getElementById('c3d-player-name').textContent = player.name;
  document.getElementById('c3d-player-hp-bar').style.width = pHpPct + '%';
  document.getElementById('c3d-player-hp-text').textContent = player.hp + ' / ' + player.maxHp;
  document.getElementById('c3d-player-mp-bar').style.width = pMpPct + '%';
  document.getElementById('c3d-player-mp-text').textContent = player.mp + ' / ' + player.maxMp;

  const logEl = document.getElementById('c3d-log');
  if (logEl) {
    logEl.innerHTML = combat.log.slice(-6).map(function(l) {
      return '<p class="' + l.cls + '">' + l.text + '</p>';
    }).join('');
    logEl.scrollTop = logEl.scrollHeight;
  }
}

function setCombat3DActionsEnabled(enabled) {
  const actions = document.getElementById('c3d-actions');
  if (!actions) return;
  actions.querySelectorAll('button').forEach(function(b) {
    b.disabled = !enabled;
    if (enabled && b.id === 'c3d-flee-btn' && combat.isBoss) b.disabled = true;
  });
  const turnEl = document.getElementById('c3d-turn');
  if (turnEl) turnEl.textContent = enabled ? '你的回合' : '...';
}

function clearCombat3DSubmenu() {
  const sub = document.getElementById('c3d-submenu');
  if (sub) sub.innerHTML = '';
}

function showCombatSkillMenu() {
  const sub = document.getElementById('c3d-submenu');
  let html = '';
  for (const skillId of player.skills) {
    const sk = SKILLS[skillId];
    const canUse = player.mp >= sk.mpCost;
    html += '<button class="option-btn" ' + (canUse ? '' : 'disabled') + ' onclick="combatSkill(\'' + skillId + '\')">' +
      sk.name + '（內力：' + sk.mpCost + '）— ' + sk.desc + '</button>';
  }
  html += '<button class="option-btn" onclick="clearCombat3DSubmenu()">返回</button>';
  sub.innerHTML = html;
}

function showCombatItemMenu() {
  const sub = document.getElementById('c3d-submenu');
  const consumables = Object.entries(player.inventory)
    .filter(function(e) { return e[1] > 0 && ITEMS[e[0]].type === 'consumable'; })
    .map(function(e) { return { id: e[0], qty: e[1] }; });
  if (consumables.length === 0) {
    sub.innerHTML = '<p style="color:var(--smoke); padding:8px;">沒有可使用的物品。</p><button class="option-btn" onclick="clearCombat3DSubmenu()">返回</button>';
    return;
  }
  let html = '';
  for (const c of consumables) {
    const item = ITEMS[c.id];
    html += '<button class="option-btn" onclick="combatUseItem(\'' + c.id + '\')">' + item.name + ' x' + c.qty + ' — ' + item.desc + '</button>';
  }
  html += '<button class="option-btn" onclick="clearCombat3DSubmenu()">返回</button>';
  sub.innerHTML = html;
}

function floatDamage3D(text, isCrit, onPlayer) {
  const overlay = document.getElementById('combat-3d-ui');
  if (!overlay) return;
  const el = document.createElement('div');
  el.className = 'damage-float' + (isCrit ? ' crit' : '') + (onPlayer ? ' player-dmg' : '');
  el.textContent = text;
  el.style.position = 'absolute';
  // Player stands left (~28%), enemy right (~72%)
  const baseX = onPlayer ? 22 : 66;
  el.style.left = (baseX + Math.random() * 10) + '%';
  el.style.top = (36 + Math.random() * 8) + '%';
  overlay.appendChild(el);
  anime({
    targets: el,
    translateY: [0, -70],
    opacity: [1, 0],
    scale: [0.8, isCrit ? 1.5 : 1.2],
    duration: 1200,
    easing: 'easeOutQuad',
    complete: function() { el.remove(); }
  });
}

function startCombat(enemyId) {
  const tmpl = ENEMIES[enemyId];
  combat = {
    enemyId,
    enemy: {
      name: tmpl.name, maxHp: tmpl.maxHp, hp: tmpl.maxHp,
      atk: tmpl.atk, def: tmpl.def, spd: tmpl.spd,
      skills: tmpl.skills, exp: tmpl.exp, gold: tmpl.gold, drops: tmpl.drops || [],
    },
    log: [], defending: false, playerEscaped: false, dodgeNext: false,
    isBoss: enemyId === 'xuanMingZhenRen',
  };
  combat.log.push({ cls: 'info', text: tmpl.flavor || tmpl.name + '出現了！' });
  initCombat3D(enemyId);
  updateCombat3DUI();
  const fleeBtn = document.getElementById('c3d-flee-btn');
  if (fleeBtn) fleeBtn.disabled = combat.isBoss;
}

function combatAttack() {
  setCombat3DActionsEnabled(false);
  const e = combat.enemy;
  const isCrit = Math.random() < (player.attrs.agi * 0.015);
  const power = isCrit ? 1.6 : 1;
  const dmg = calcDamage(getEffectiveAttack(), e.def, power);
  playFightClip({
    attacker: combat3D.player3D,
    defender: combat3D.enemy3D,
    kind: 'attack',
    crit: isCrit,
    onImpact: function() {
      e.hp -= dmg;
      if (isCrit) {
        combat.log.push({ cls: 'crit', text: '暴擊！你奮力一擊，對' + e.name + '造成 ' + dmg + ' 點傷害！' });
        shakeScreen(6);
      } else {
        combat.log.push({ cls: 'dmg-out', text: '你發動攻擊，對' + e.name + '造成 ' + dmg + ' 點傷害。' });
      }
      updateCombat3DUI();
      floatDamage3D('-' + dmg, isCrit, false);
    },
    onDone: function() {
      if (e.hp <= 0) { setTimeout(function() { endCombat(true); }, 600); return; }
      setTimeout(function() { enemyTurn(); }, 320);
    },
  });
}

function combatSkill(skillId) {
  const sk = SKILLS[skillId];
  if (!sk || player.mp < sk.mpCost) return;
  setCombat3DActionsEnabled(false);
  clearCombat3DSubmenu();
  player.mp -= sk.mpCost;
  const e = combat.enemy;

  if (sk.type === 'heal') {
    const healHp = Math.round(player.maxHp * (sk.healPct || 0));
    const healMp = sk.mpPct ? Math.round(player.maxMp * sk.mpPct) : 0;
    const actualHeal = Math.min(healHp, player.maxHp - player.hp);
    player.hp += actualHeal;
    if (healMp) player.mp = Math.min(player.maxMp, player.mp + healMp);
    combat.log.push({ cls: 'info', text: '你施展' + sk.name + '，恢復了 ' + actualHeal + ' 點氣血' + (healMp ? '和 ' + healMp + ' 點內力' : '') + '。' });
    updateCombat3DUI();
    playSelfClip(combat3D.player3D, 'heal', skillId, function() {
      setTimeout(function() { enemyTurn(); }, 250);
    });
    return;
  }

  if (sk.type === 'buff') {
    combat.dodgeNext = true;
    combat.log.push({ cls: 'info', text: '你施展' + sk.name + '，身法大增，下次攻擊將被閃避！' });
    updateCombat3DUI();
    playSelfClip(combat3D.player3D, 'defend', skillId, function() {
      setTimeout(function() { enemyTurn(); }, 250);
    });
    return;
  }

  const isCrit = Math.random() < (player.attrs.agi * 0.01);
  const dmg = calcDamage(getEffectiveAttack(), e.def, sk.power * (isCrit ? 1.3 : 1));

  playFightClip({
    attacker: combat3D.player3D,
    defender: combat3D.enemy3D,
    kind: 'skill',
    skillId: skillId,
    crit: isCrit,
    onImpact: function() {
      e.hp -= dmg;
      if (sk.type === 'absorb') {
        const absorbed = Math.round(dmg * (sk.absorbPct || 0.5));
        const actualAbsorb = Math.min(absorbed, player.maxHp - player.hp);
        player.hp += actualAbsorb;
        combat.log.push({ cls: 'dmg-out', text: '你施展' + sk.name + '，對' + e.name + '造成 ' + dmg + ' 點傷害，並吸取了 ' + actualAbsorb + ' 點氣血！' });
      } else if (isCrit) {
        combat.log.push({ cls: 'crit', text: sk.name + '命中要害！對' + e.name + '造成 ' + dmg + ' 點傷害！' });
        shakeScreen(5);
      } else {
        combat.log.push({ cls: 'dmg-out', text: '你施展' + sk.name + '，對' + e.name + '造成 ' + dmg + ' 點傷害！' });
      }
      updateCombat3DUI();
      floatDamage3D('-' + dmg, isCrit, false);
    },
    onDone: function() {
      if (e.hp <= 0) { setTimeout(function() { endCombat(true); }, 600); return; }
      setTimeout(function() { enemyTurn(); }, 320);
    },
  });
}

function combatUseItem(itemId) {
  const item = ITEMS[itemId];
  if (!item || item.type !== 'consumable') return;
  setCombat3DActionsEnabled(false);
  clearCombat3DSubmenu();
  const eff = item.effect;
  if (eff.kind === 'healHp') {
    const heal = Math.min(eff.amt, player.maxHp - player.hp);
    player.hp += heal;
    combat.log.push({ cls: 'info', text: '你使用了' + item.name + '，恢復 ' + heal + ' 點氣血。' });
  } else if (eff.kind === 'healMp') {
    const heal = Math.min(eff.amt, player.maxMp - player.mp);
    player.mp += heal;
    combat.log.push({ cls: 'info', text: '你使用了' + item.name + '，恢復 ' + heal + ' 點內力。' });
  } else if (eff.kind === 'full') {
    player.hp = player.maxHp; player.mp = player.maxMp;
    combat.log.push({ cls: 'info', text: '你使用了' + item.name + '，氣血與內力完全恢復！' });
  } else if (eff.kind === 'snowLotus') {
    player.hp = player.maxHp; player.mp = player.maxMp;
    player.maxHp += 50; player.hp = player.maxHp;
    combat.log.push({ cls: 'info', text: '你使用了' + item.name + '！氣血內力完全恢復，氣血上限永久提升！' });
  }
  removeFromInventory(itemId, 1);
  updateCombat3DUI();
  playSelfClip(combat3D.player3D, 'heal', null, function() {
    setTimeout(function() { enemyTurn(); }, 250);
  });
}

function combatDefend() {
  setCombat3DActionsEnabled(false);
  combat.defending = true;
  const mpRestore = Math.min(10, player.maxMp - player.mp);
  player.mp += mpRestore;
  combat.log.push({ cls: 'info', text: '你擺出防禦架勢，減少下次受到的傷害' + (mpRestore > 0 ? '，並回復了 ' + mpRestore + ' 點內力' : '') + '。' });
  updateCombat3DUI();
  playSelfClip(combat3D.player3D, 'defend', null, function() {
    setTimeout(function() { enemyTurn(); }, 250);
  });
}

function combatFlee() {
  if (combat.isBoss) return;
  setCombat3DActionsEnabled(false);
  const chance = clamp(0.3 + (player.attrs.agi - combat.enemy.spd) * 0.05, 0.1, 0.9);
  if (Math.random() < chance) {
    combat.log.push({ cls: 'info', text: '你成功逃脫了！' });
    combat.playerEscaped = true;
    updateCombat3DUI();
    setTimeout(function() {
      exitCombat3D();
      const hadRomanceCb = romanceCombatCallback;
      romanceCombatCallback = null;
      combat = null;
      if (hadRomanceCb) showRomanceHub();
      else goToLocation(player.location);
    }, 800);
  } else {
    combat.log.push({ cls: 'info', text: '逃跑失敗！' });
    updateCombat3DUI();
    setTimeout(function() { enemyTurn(); }, 800);
  }
}

function enemyTurn() {
  const e = combat.enemy;
  if (e.hp <= 0) return;

  if (combat.dodgeNext) {
    combat.dodgeNext = false;
    combat.log.push({ cls: 'crit', text: '你以幻影步閃避了' + e.name + '的攻擊！' });
    updateCombat3DUI();
    playFightClip({
      attacker: combat3D.enemy3D,
      defender: combat3D.player3D,
      kind: 'attack',
      dodged: true,
      onImpact: function() {
        floatDamage3D('閃避', false, true);
      },
      onDone: function() {
        setCombat3DActionsEnabled(true);
      },
    });
    return;
  }

  let useSkill = false;
  if (e.skills && e.skills.length > 0 && Math.random() < 0.5) useSkill = true;
  const esk = useSkill ? pick(e.skills) : null;

  playFightClip({
    attacker: combat3D.enemy3D,
    defender: combat3D.player3D,
    kind: useSkill ? 'enemySkill' : 'attack',
    enemySkill: esk,
    onImpact: function() {
      let dmg;
      if (useSkill) {
        dmg = calcDamage(e.atk, getEffectiveDefense(), esk.power);
        combat.log.push({ cls: 'dmg-in', text: e.name + '使出' + esk.name + '！對你造成 ' + dmg + ' 點傷害！' });
      } else {
        dmg = calcDamage(e.atk, getEffectiveDefense(), 1);
        combat.log.push({ cls: 'dmg-in', text: e.name + '發動攻擊，對你造成 ' + dmg + ' 點傷害。' });
      }

      if (combat.defending) {
        dmg = Math.round(dmg * 0.4);
        combat.log.push({ cls: 'info', text: '防禦生效！實際受到 ' + dmg + ' 點傷害。' });
        combat.defending = false;
      }

      player.hp -= dmg;
      updateCombat3DUI();
      floatDamage3D('-' + dmg, false, true);
    },
    onDone: function() {
      if (player.hp <= 0) {
        player.hp = 0;
        shakeScreen(8);
        setTimeout(function() { endCombat(false); }, 700);
        return;
      }
      setCombat3DActionsEnabled(true);
    },
  });
}

function exitCombat3D() {
  const overlay = document.getElementById('combat-3d-overlay');
  overlay.classList.add('fading-out');
  overlay.classList.remove('clip-playing');
  setTimeout(function() {
    overlay.classList.remove('active', 'fading-out');
    cleanupCombat3D();
  }, 600);
}

function endCombat(victory) {
  const e = combat.enemy;
  if (victory) {
    combat.log.push({ cls: 'info', text: '你擊敗了' + e.name + '！' });
    addLog('擊敗了' + e.name + '！獲得經驗值 ' + e.exp + ' 點，銀兩 ' + e.gold + ' 兩。');
    player.exp += e.exp;
    player.gold += e.gold;
    let drops = [];
    for (const drop of e.drops) {
      if (Math.random() < drop.chance) {
        addToInventory(drop.id, 1);
        drops.push(ITEMS[drop.id].name);
      }
    }
    if (drops.length > 0) addLog('獲得物品：' + drops.join('、') + '。');
    const leveled = checkLevelUp();

    const wasBoss = combat.isBoss;
    const pendingStage = combat.pendingStronghold || 0;

    enterClip();
    animFighterAction(combat3D.enemy3D, 'defeat');
    animFighterAction(combat3D.player3D, 'victory');
    // Slow victory orbit around the standing winner
    camTo(0, 2.2, 5.2, 0, 1.3, 0, 1400, 'easeInOutQuad');
    updateCombat3DUI();

    setTimeout(function() {
      exitCombat3D();
      combat = null;
      saveGame();

      if (wasBoss) { showVictory(); return; }

      if (pendingStage > 0) { strongholdProgress = pendingStage; saveGame(); }

      renderTypedScene('【戰鬥勝利】',
        '你擊敗了' + e.name + '！',
        '<p>獲得經驗值 <span style="color:var(--exp);">' + e.exp + '</span> 點。</p>' +
        '<p>獲得銀兩 <span style="color:var(--cinnabar-light);">' + e.gold + '</span> 兩。</p>' +
        (drops.length > 0 ? '<p>獲得物品：<span style="color:var(--gold);">' + drops.join('、') + '</span></p>' : '') +
        (leveled ? '<p style="color:var(--gold); font-size:1.1em;">★ 等級提升至 ' + player.level + ' 級！★</p>' : ''),
        [
          { text: '繼續', action: 'afterCombatContinue()' },
        ]
      );
      saveGame();
    }, wasBoss ? 2000 : 1600);
  } else {
    addLog('你被' + e.name + '擊敗了……所幸被路人救回了客棧。');
    player.hp = Math.round(player.maxHp * 0.5);
    player.mp = Math.round(player.maxMp * 0.5);
    const lostGold = Math.round(player.gold * 0.1);
    player.gold -= lostGold;
    player.location = '青石鎮';
    const wasInStronghold = strongholdProgress > 0 && strongholdProgress < 3;
    romanceCombatCallback = null;

    enterClip();
    animFighterAction(combat3D.player3D, 'defeat');
    camTo(-1.5, 1.6, 4.5, -2.5, 0.9, 0, 1200, 'easeInOutQuad');
    updateCombat3DUI();

    setTimeout(function() {
      exitCombat3D();
      combat = null;
      if (wasInStronghold) strongholdProgress = 0;
      saveGame();
      renderTypedScene('【敗北】',
        '你眼前一黑……',
        '<p>不知過了多久，你在客棧中醒來。老王告訴你，是路過的好心人把你抬回來的。</p>' +
        '<p>氣血恢復了一半。損失了 ' + lostGold + ' 兩銀子作為醫藥費。</p>' +
        (wasInStronghold ? '<p style="color:var(--smoke);">你在黑風寨的進度已重置，需要重新突入。</p>' : ''),
        [
          { text: '繼續', action: "goToLocation('青石鎮')" },
        ]
      );
    }, 1800);
  }
}

function setActionsEnabled(enabled) {
  setCombat3DActionsEnabled(enabled);
}

function afterCombatContinue() {
  if (romanceCombatCallback) {
    onRomanceQuestComplete();
    return;
  }
  if (player.location === '黑風寨') renderStronghold();
  else goToLocation(player.location);
}

function initRomance() {
  romance = {};
  for (const id of Object.keys(GIRLS)) {
    romance[id] = { met: false, affection: 0, talkedToday: false, questDone: false, reward50: false, reward100: false };
  }
}

function getGirlStatus(id) {
  const r = romance[id];
  if (!r.met) return { label: '未邂逅', cls: 'locked' };
  if (r.affection >= 100) return { label: '♥ 紅顏知己 ♥', cls: 'love' };
  if (r.affection >= 50) return { label: '心意相通', cls: 'friend' };
  return { label: '初識', cls: 'met' };
}

function showRomanceHub() {
  let cards = '';
  for (const [id, g] of Object.entries(GIRLS)) {
    const r = romance[id];
    const status = getGirlStatus(id);
    const lockedNote = g.meetLevelReq ? `(需 ${g.meetLevelReq} 級)` : '';
    const src = ASSETS.girls[id] || '';
    cards += `
      <div class="girl-card ${r.reward100 ? 'completed' : ''}" onclick="visitGirl('${id}')">
        <img class="girl-thumb" src="${src}" alt="${g.name}" loading="lazy">
        <div class="girl-title">${g.name}</div>
        <div class="girl-desc">${g.title}<br>${lockedNote}</div>
        <div class="girl-status ${status.cls}">${status.label}</div>
      </div>
    `;
  }
  const completed = Object.values(romance).filter(r => r.reward100).length;
  renderScene('【紅顏知己】', `
    <p>江湖路遠，有人同行便不覺孤單。在這青石鎮中，流傳著不少奇女子的故事。或許，你該去結識一番。</p>
    ${completed > 0 ? `<p style="color:var(--jade);">已結交紅顏：${completed} / 7</p>` : ''}
    <div class="girl-grid">${cards}</div>
  `, [
    { text: '返回', action: "goToLocation('青石鎮')" },
  ], 'town');
  staggerIn('.girl-card');
}

function canMeetGirl(id) {
  const g = GIRLS[id];
  if (g.meetLevelReq && player.level < g.meetLevelReq) return false;
  return true;
}

function visitGirl(id) {
  const g = GIRLS[id];
  const r = romance[id];
  const loc = g.loc || 'town';

  if (!canMeetGirl(id)) {
    renderScene(`【${g.name}】`, `
      ${girlHeroCard(id)}
      <p>你四處打聽，卻找不到這位女子的蹤跡。</p>
      <p style="color:var(--smoke);">需要達到 ${g.meetLevelReq} 級才能邂逅此人。</p>
    `, [
      { text: '返回', action: 'showRomanceHub()' },
    ], loc);
    return;
  }

  if (!r.met) {
    r.met = true;
    r.talkedToday = true;
    r.affection += 5;
    addLog(`邂逅了${g.name}（${g.title}）。`);
    saveGame();
    renderTypedScene(`【邂逅 · ${g.name}】`,
      g.meetText,
      `${girlHeroCard(id)}
      ${npcBubble(id, g.dialogues[0].replace(/\$\{name\}/g, player.name))}
      <p style="color:var(--jade); font-size:0.9em;">好感度 +5（初次邂逅）</p>
      ${renderAffectionBar(id)}`,
      [
        { text: '繼續聊天', action: `girlTalk('${id}')` },
        { text: '贈送禮物', action: `girlGiftMenu('${id}')` },
        { text: '接受任務', action: `girlQuest('${id}')`, disabled: r.questDone },
        { text: '返回', action: 'showRomanceHub()' },
      ],
      loc
    );
    return;
  }

  checkGirlRewards(id);
  const status = getGirlStatus(id);
  renderScene(`【${g.name} · ${g.title}】`, `
    ${girlHeroCard(id)}
    ${renderAffectionBar(id)}
    <p style="color:var(--smoke);">狀態：${status.label}</p>
    ${r.questDone ? '<p style="color:var(--jade); font-size:0.9em;">已完成她的請求。</p>' : ''}
    ${r.reward50 ? '<p style="color:var(--gold); font-size:0.9em;">已獲得第一階段獎勵。</p>' : ''}
    ${r.reward100 ? '<p style="color:var(--cinnabar-light); font-size:0.9em;">♥ 已結為紅顏知己 ♥</p>' : ''}
  `, [
    { text: r.talkedToday ? '今日已聊過' : '繼續聊天', action: `girlTalk('${id}')`, disabled: r.talkedToday },
    { text: '贈送禮物', action: `girlGiftMenu('${id}')` },
    { text: r.questDone ? '任務已完成' : '接受任務', action: `girlQuest('${id}')`, disabled: r.questDone },
    { text: '返回', action: 'showRomanceHub()' },
  ], loc);
}

function renderAffectionBar(id) {
  const r = romance[id];
  const pct = clamp(r.affection, 0, 100);
  return `
    <div class="affection-bar">
      <div style="color:var(--smoke); font-size:0.85em; margin-bottom:2px;">❤ 好感度</div>
      <div class="bar-track">
        <div class="bar-fill aff" style="width:${pct}%"></div>
        <span class="bar-text">${r.affection} / 100</span>
      </div>
    </div>
  `;
}

function girlTalk(id) {
  const g = GIRLS[id];
  const r = romance[id];
  const loc = g.loc || 'town';
  const idx = Math.min(Math.floor(r.affection / 25), g.dialogues.length - 1);
  const dialogue = g.dialogues[idx].replace(/\$\{name\}/g, player.name);
  r.talkedToday = true;
  r.affection = Math.min(100, r.affection + 5);
  addLog(`與${g.name}聊天，好感度提升。`);
  checkGirlRewards(id);
  saveGame();
  renderScene(`【${g.name}】`, `
    ${girlHeroCard(id)}
    ${renderAffectionBar(id)}
    ${npcBubble(id, dialogue)}
    <p style="color:var(--jade); font-size:0.9em;">好感度 +5</p>
    ${r.reward100 ? '<p style="color:var(--cinnabar-light);">♥ 你們的感情已臻圓滿 ♥</p>' : ''}
  `, [
    { text: '贈送禮物', action: `girlGiftMenu('${id}')` },
    { text: r.questDone ? '任務已完成' : '接受任務', action: `girlQuest('${id}')`, disabled: r.questDone },
    { text: '返回', action: 'showRomanceHub()' },
  ], loc);
}

function girlGiftMenu(id) {
  const g = GIRLS[id];
  const loc = g.loc || 'town';
  const gifts = Object.entries(player.inventory)
    .filter(([iid, q]) => q > 0 && ITEMS[iid] && ITEMS[iid].type === 'gift')
    .map(([iid, q]) => ({ id: iid, ...ITEMS[iid], qty: q }));

  if (gifts.length === 0) {
    renderScene(`【贈送禮物 · ${g.name}】`, `
      ${girlHeroCard(id)}
      ${renderAffectionBar(id)}
      <p style="color:var(--smoke);">你沒有可以贈送的禮物。可以在雜貨鋪購買鮮花、珍珠簪等禮物。</p>
    `, [
      { text: '返回', action: `visitGirl('${id}')` },
    ], loc);
    return;
  }

  let giftHTML = '';
  for (const gift of gifts) {
    giftHTML += `
      <div class="gift-item">
        <span class="gift-name">${gift.name} x${gift.qty}</span>
        <span class="gift-aff">好感度 +${gift.aff}</span>
        <button class="btn" onclick="girlGiveGift('${id}', '${gift.id}')">贈送</button>
      </div>
    `;
  }

  renderScene(`【贈送禮物 · ${g.name}】`, `
    ${girlHeroCard(id)}
    ${renderAffectionBar(id)}
    <p>你有一些禮物可以送給${g.name}。</p>
    ${giftHTML}
  `, [
    { text: '返回', action: `visitGirl('${id}')` },
  ], loc);
}

function girlGiveGift(girlId, giftId) {
  const g = GIRLS[girlId];
  const r = romance[girlId];
  const gift = ITEMS[giftId];
  if (!gift || !player.inventory[giftId]) return;
  removeFromInventory(giftId, 1);
  r.affection = Math.min(100, r.affection + gift.aff);
  addLog(`送給${g.name}一份${gift.name}，好感度 +${gift.aff}。`);
  checkGirlRewards(girlId);
  saveGame();
  updateStatus();
  visitGirl(girlId);
}

function girlQuest(id) {
  const g = GIRLS[id];
  const r = romance[id];
  const loc = g.loc || 'town';
  if (r.questDone) { visitGirl(id); return; }
  renderScene(`【${g.questTitle} · ${g.name}】`, `
    ${girlHeroCard(id)}
    ${renderAffectionBar(id)}
    <p>${g.questText}</p>
    ${npcBubble(id, `拜託你了，${player.name}。`)}
    <p style="color:var(--gold);">任務目標：${g.questReqText}</p>
    <p style="color:var(--smoke); font-size:0.9em;">完成任務後好感度大幅提升，並獲得特殊獎勵。</p>
  `, [
    { text: '立即出發！', action: `girlStartQuest('${id}')` },
    { text: '稍後再說', action: `visitGirl('${id}')` },
  ], loc);
}

function girlStartQuest(id) {
  const g = GIRLS[id];
  startCombat(g.questEnemy);
  romanceCombatCallback = id;
}

function onRomanceQuestComplete() {
  const id = romanceCombatCallback;
  if (!id) return;
  const g = GIRLS[id];
  const r = romance[id];
  r.questDone = true;
  r.affection = Math.min(100, r.affection + 25);
  addLog(`完成了${g.name}的請求「${g.questTitle}」！好感度大幅提升。`);
  checkGirlRewards(id);
  saveGame();
  romanceCombatCallback = null;

  renderScene(`【任務完成 · ${g.questTitle}】`, `
    ${girlHeroCard(id)}
    ${renderAffectionBar(id)}
    <p style="color:var(--jade); font-size:1.1em;">你成功完成了${g.name}的請求！</p>
    ${npcBubble(id, `太好了……謝謝你，${player.name}。`)}
    <p style="color:var(--gold);">好感度 +25</p>
    ${r.reward50 ? `<div class="dialogue" style="border-left-color: var(--jade);"><span class="speaker">獎勵：</span>${g.reward50Text}</div>` : ''}
    ${r.reward100 ? `<div class="dialogue" style="border-left-color: var(--cinnabar);"><span class="speaker">至寶：</span>${g.reward100Text}</div>` : ''}
  `, [
    { text: '繼續', action: `visitGirl('${id}')` },
  ], g.loc || 'town');
}

function checkGirlRewards(id) {
  const g = GIRLS[id];
  const r = romance[id];
  if (r.affection >= 50 && !r.reward50) {
    r.reward50 = true;
    const rw = g.reward50;
    if (rw.items) for (const [iid, q] of Object.entries(rw.items)) addToInventory(iid, q);
    if (rw.gold) player.gold += rw.gold;
    if (rw.maxHpBonus) { player.maxHp += rw.maxHpBonus; player.hp += rw.maxHpBonus; }
    if (rw.maxMpBonus) { player.maxMp += rw.maxMpBonus; player.mp += rw.maxMpBonus; }
    if (rw.skills) for (const sk of rw.skills) { if (!player.skills.includes(sk)) player.skills.push(sk); }
    if (rw.attrBonus) for (const [ak, av] of Object.entries(rw.attrBonus)) player.attrs[ak] = (player.attrs[ak] || 0) + av;
    addLog(`與${g.name}好感度達到50！獲得獎勵！`);
  }
  if (r.affection >= 100 && !r.reward100) {
    r.reward100 = true;
    const rw = g.reward100;
    if (rw.items) for (const [iid, q] of Object.entries(rw.items)) addToInventory(iid, q);
    if (rw.gold) player.gold += rw.gold;
    if (rw.maxHpBonus) { player.maxHp += rw.maxHpBonus; player.hp += rw.maxHpBonus; }
    if (rw.maxMpBonus) { player.maxMp += rw.maxMpBonus; player.mp += rw.maxMpBonus; }
    if (rw.skills) for (const sk of rw.skills) { if (!player.skills.includes(sk)) player.skills.push(sk); }
    if (rw.attrBonus) for (const [ak, av] of Object.entries(rw.attrBonus)) player.attrs[ak] = (player.attrs[ak] || 0) + av;
    addLog(`與${g.name}好感度達到滿值！結為紅顏知己！獲得至寶！`);
  }
}

      玄冥真人轟然倒地，黑袍上沾滿了鮮血。他難以置信地望著你，嘴角泛起一絲苦笑。
    </div>
    <div class="dialogue" style="max-width:500px; margin:0 auto 28px;">
      <span class="speaker">玄冥真人：</span>「不可能……我的玄冥神掌……你……你到底是什麼人……」
    </div>
    <div class="ending-text">
      「邪不勝正，你的惡行到此為止了。」你收起兵器，頭也不回地走出了主殿。
    </div>
    <div class="ending-text">
      隨著玄冥真人的倒台，黑風寨的惡勢力土崩瓦解。魔教教眾作鳥獸散，山賊們也紛紛逃入深山，再也不敢為禍一方。
      青石鎮的百姓們奔相走告，歡呼雀躍。老王在客棧裡擺了三天三夜的慶功宴，每個人都在談論著你的名字。
      從此，你的俠名傳遍江湖，成為一代武林傳說。而你的故事……才剛剛開始。
    </div>
    <p style="color:var(--gold); font-size:1.1em; margin: 20px 0;">
      — 全 劇 終 —<br><br>
      <span style="color:var(--smoke); font-size:0.9em;">
        最終等級：${player.level}｜門派：${player.sectName}<br>
        擊敗Boss：玄冥真人
      </span>
    </p>
    <button class="btn btn-cinnabar btn-large" onclick="newGame()">重新開始</button>
  `;
  strongholdProgress = 3;
  saveGame();
  anime({
    targets: '#ending-content > *',
    opacity: [0, 1],
    translateY: [20, 0],
    delay: anime.stagger(300, { start: 400 }),
    duration: 800,
    easing: 'easeOutQuad'
  });
}

function newGame() {
  deleteSave();
  player = null;
  tempGender = '男';
  tempSect = null;
  tempAttrs = null;
  strongholdProgress = 0;
  gossipShown = 0;
  gameLog = [];
  combat = null;
  romance = null;
  romanceCombatCallback = null;
  const nameInput = document.getElementById('input-name');
  if (nameInput) nameInput.value = '';
  document.querySelectorAll('.sect-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.gender-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.gender === '男');
  });
  const attrSec = document.getElementById('attr-section');
  if (attrSec) attrSec.style.display = 'none';
  const warn = document.getElementById('create-warning');
  if (warn) warn.remove();
  showScreen('create-screen');
}

function init() {
  renderSectGrid();
  if (hasSave()) {
    document.getElementById('continue-btn').style.display = 'inline-block';
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
